# Functional classes of food additives, as they appear before additive names on EU labels
# ("emulgator: lecytyny", "Säureregulator: Citronensäure"). Category names from
# Reg (EU) 1169/2011 Annex VII Part C, with the plural forms labels actually use.
# provenance: ai-drafted from the regulation; review_status: draft (names need a native check).
classes:
  - id: acid
    names: { en: [acid, acids], pl: [kwas, kwasy], de: [säuerungsmittel] }
    source: reg-1169-2011
  - id: acidity-regulator
    names: { en: [acidity regulator, acidity regulators], pl: [regulator kwasowości, regulatory kwasowości], de: [säureregulator, säureregulatoren] }
    source: reg-1169-2011
  - id: anti-caking-agent
    names: { en: [anti-caking agent, anti-caking agents, anticaking agent], pl: [substancja przeciwzbrylająca, substancje przeciwzbrylające], de: [trennmittel, rieselhilfe] }
    source: reg-1169-2011
  - id: anti-foaming-agent
    names: { en: [anti-foaming agent, anti-foaming agents], pl: [substancja przeciwpieniąca, substancje przeciwpieniące], de: [schaumverhüter] }
    source: reg-1169-2011
  - id: antioxidant
    names: { en: [antioxidant, antioxidants], pl: [przeciwutleniacz, przeciwutleniacze], de: [antioxidationsmittel, antioxidans] }
    source: reg-1169-2011
  - id: bulking-agent
    names: { en: [bulking agent, bulking agents], pl: [substancja wypełniająca, substancje wypełniające], de: [füllstoff, füllstoffe] }
    source: reg-1169-2011
  - id: colour
    names: { en: [colour, colours, color, colors, colouring], pl: [barwnik, barwniki], de: [farbstoff, farbstoffe] }
