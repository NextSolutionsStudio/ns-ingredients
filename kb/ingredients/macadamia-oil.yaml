summary:
  en: >-
    Vegetable oil pressed from macadamia or Queensland nuts (Macadamia ternifolia). As a product derived from macadamia or Queensland nuts, it falls
    under EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z orzechów makadamia (Macadamia ternifolia). Jako produkt pochodzący z orzechów makadamia podlega
    obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
