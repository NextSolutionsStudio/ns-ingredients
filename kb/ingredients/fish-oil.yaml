summary:
  en: >-
    Oil extracted from fish (tuna, salmon, sardine, anchovy, cod liver and others) when the label names fish oil
    or a fish species without a more specific entry. As a product derived from fish, it falls under EU Annex II
    item 4 fish allergen labelling, which has no exemption for fish oil.
  pl: >-
    Olej pozyskiwany z ryb (tuńczyka, łososia, sardynek, sardeli, wątroby dorsza i innych), gdy etykieta podaje
    olej rybny lub gatunek ryby bez bardziej szczegółowego wpisu. Jako produkt z ryb podlega deklarowaniu alergenu
    z Aneksu II UE (punkt 4), który nie przewiduje wyłączenia dla oleju rybnego.
