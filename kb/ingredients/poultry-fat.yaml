assertions:
  - code: origin.animal
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Rendered fat obtained from slaughtered poultry (Reg (EU) No 1169/2011 Annex VII Part B point 2; Reg (EC) No 853/2004 Annex III)."
      pl: "Wytopiony tłuszcz pozyskiwany z ubojowego drobiu (Rozp. (UE) nr 1169/2011 Załącznik VII część B pkt 2; Rozp. (WE) nr 853/2004 Załącznik III)."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part B, point 2"
      - id: ad-reg-853-2004
        locator: "Annex III"
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full in its list of ingredients."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite) w wykazie składników."
    sources:
      - id: reg-1169-2011
        locator: "Article 9(1)(b) and Article 18 (list of ingredients)"
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation in its list of ingredients."
      pl: "Etykieta deklaruje częściowe utwardzenie w wykazie składników."
    sources:
      - id: reg-1169-2011
        locator: "Article 9(1)(b) and Article 18 (list of ingredients)"
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat, and the cap covers trans fat formed by hydrogenating an animal fat, which is not naturally occurring."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu, obejmujący też tłuszcze trans powstałe przy utwardzaniu tłuszczu zwierzęcego, które nie występują naturalnie."
    sources:
      - id: reg-2019-649
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation in its list of ingredients."
      pl: "Etykieta deklaruje całkowite utwardzenie w wykazie składników."
    sources:
      - id: reg-1169-2011
        locator: "Article 9(1)(b) and Article 18 (list of ingredients)"
