summary:
  en: "The fat fraction of milk, isolated to near-pure fat (anhydrous milk fat/butterfat removes essentially all water and milk solids); one of the EU's fourteen regulated allergens (milk) regardless of how little non-fat milk solid remains."
  pl: "Frakcja tłuszczowa mleka, wyodrębniona do postaci praktycznie czystego tłuszczu (bezwodny tłuszcz mleczny usuwa niemal całą wodę i suchą masę mleka); jeden z czternastu regulowanych alergenów UE (mleko), niezależnie od tego, jak mało beztłuszczowej suchej masy mleka pozostaje."
  de: "Die Fettfraktion der Milch, isoliert zu nahezu reinem Fett (Butterreinfett entfernt praktisch alles Wasser und alle Milchfeststoffe); eines der vierzehn geregelten EU-Allergene (Milch)."
