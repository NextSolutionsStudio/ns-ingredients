id: sodium-carbonates
type: additive
e_number: E500
names:
  en:
    - sodium carbonates
    - sodium carbonate
    - sodium hydrogen carbonate
    - sodium bicarbonate
    - bicarbonate of soda
    - baking soda
    - soda ash
    - sodium sesquicarbonate
  pl:
    - węglany sodu
    - węglan sodu
    - wodorowęglan sodu
    - kwaśny węglan sodu
    - soda oczyszczona
    - soda do pieczenia
    - soda amoniakalna
    - bikarbonat
  de:
    - Natriumcarbonate
    - Natriumcarbonat
    - Natriumhydrogencarbonat
    - Natron
functions:
  - raising-agent
  - acidity-regulator
  - anti-caking-agent
summary:
  en: >-
    Sodium carbonate (soda ash), sodium hydrogen carbonate (baking soda) and sodium sesquicarbonate: the
    alkaline half of most baking powders, releasing carbon dioxide with an acid, and an acidity regulator.
  pl: >-
    Węglan sodu (soda kalcynowana), wodorowęglan sodu (soda oczyszczona) i seskwiwęglan sodu: zasadowy
    składnik większości proszków do pieczenia, uwalniający dwutlenek węgla w reakcji z kwasem, a także
    regulator kwasowości.
assertions:
  - code: origin.chemical_synthesis
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Synthetic soda ash is produced at large global scale via the Solvay ammonia-soda process from
        sodium chloride brine, limestone and ammonia (USGS MCS 2025 reports synthetic production accounts for
        the larger global share, led by China).
      pl: >-
        Syntetyczna soda kalcynowana jest wytwarzana na wielką skalę w procesie Solvaya z solanki, kamienia
        wapiennego i amoniaku (USGS MCS 2025 wskazuje większy udział produkcji syntetycznej na świecie).
    sources:
      - id: usgs-mcs-soda-ash-2025
  - code: origin.mineral
    certainty: yes
    kind: estimate
    grade: B
    note:
      en: >-
        Both commercial routes to soda ash start from mineral raw materials: natural soda ash is refined
        directly from mined trona ore, nahcolite or mineral brines (USGS MCS 2025), while the synthetic
        Solvay route (~75% of global production) reacts sodium chloride brine with calcined limestone
        (CaCO3) (Gutierrez et al. 2025, Section 1 & Table 1).
      pl: >-
        Obie przemysłowe drogi otrzymywania sody opierają się na surowcach mineralnych: soda naturalna jest
        oczyszczana bezpośrednio z wydobywanej trony, nahkolitu lub solanek mineralnych (USGS MCS 2025),
        natomiast synteza Solvaya (ok. 75% światowej produkcji) wykorzystuje solankę (NaCl) i wypalany
        wapień (CaCO3) (Gutierrez i in. 2025, sekcja 1 i tabela 1).
    sources:
      - id: usgs-mcs-soda-ash-2025
      - id: gutierrez-2025-soda-ash
        locator: "Section 1 & Table 1"
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group I additive (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis in most food
        categories.
      pl: >-
        Dodatek grupy I (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis w większości kategorii żywności.
    source: swm-reg-1129-2011
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Identity-only: no EFSA food-additive re-evaluation of E 500 was found (only a 2010 feed opinion) and the
    JECFA database was not reachable, so no assessment or reference value is recorded.
