id: sodium-carbonates
type: additive
e_number: E500
names:
  en:
    - sodium carbonates
    - sodium carbonate
    - sodium hydrogen carbonate
    - sodium bicarbonate
    - bicarbonate of soda
    - baking soda
    - soda ash
    - sodium sesquicarbonate
  pl:
    - węglany sodu
    - węglan sodu
    - wodorowęglan sodu
    - kwaśny węglan sodu
    - soda oczyszczona
    - soda do pieczenia
    - bikarbonat
    - soda amoniakalna
  de:
    - Natriumcarbonate
    - Natriumcarbonat
    - Natriumhydrogencarbonat
    - Natron
functions:
  - raising-agent
  - acidity-regulator
  - anti-caking-agent
summary:
  en: >-
    Sodium carbonate (soda ash), sodium hydrogen carbonate (baking soda) and sodium sesquicarbonate: the
    alkaline half of most baking powders, releasing carbon dioxide with an acid, and an acidity regulator.
  pl: >-
    Węglan sodu (soda kalcynowana), wodorowęglan sodu (soda oczyszczona) i seskwiwęglan sodu: zasadowy
    składnik większości proszków do pieczenia, uwalniający dwutlenek węgla w reakcji z kwasem, a także
    regulator kwasowości.
assertions:
  - code: origin.chemical_synthesis
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Soda ash is either manufactured by chemical synthesis — chiefly the Solvay process from sodium chloride
        brine, calcined limestone (CaCO3) and cyclic ammonia, which accounts for ~75% of world production
        (Gutierrez et al. 2025, Section 1 & Table 1) — or refined from natural mineral deposits (USGS).
      pl: >-
        Soda kalcynowana jest wytwarzana albo w drodze syntezy chemicznej — głównie w procesie Solvaya z
        solanki NaCl, wypalanego wapienia (CaCO3) i zawracanego amoniaku, co stanowi ok. 75% światowej
        produkcji (Gutierrez i in. 2025, sekcja 1 i tabela 1) — albo oczyszczana ze złóż mineralnych (USGS).
    sources:
      - id: usgs-mcs-soda-ash-2025
      - id: gutierrez-2025-soda-ash
        locator: "Section 1 & Table 1"
  - code: origin.mineral
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Natural soda ash is refined from the mineral trona or sodium-carbonate-bearing brines (USGS), whereas
        ~75% of global soda ash output is produced synthetically by the Solvay process from NaCl brine and
        calcined limestone (Gutierrez et al. 2025, Section 1 & Table 1); labels do not state which route was
        used.
      pl: >-
        Naturalna soda kalcynowana jest oczyszczana z minerału trony lub solanek bogatych w węglan sodu
        (USGS), natomiast ok. 75% światowej produkcji powstaje syntetycznie w procesie Solvaya z solanki NaCl
        i wypalanego wapienia (Gutierrez i in. 2025, sekcja 1 i tabela 1); etykiety nie wskazują użytej metody.
    sources:
      - id: usgs-mcs-soda-ash-2025
      - id: gutierrez-2025-soda-ash
        locator: "Section 1 & Table 1"
  - code: diet.vegan
    certainty: 'yes'
    kind: estimate
    grade: B
    note:
      en: >-
        Both commercial routes — refining natural trona or sodium-carbonate brines (USGS) and chemical synthesis
        such as the Solvay process from NaCl brine and calcined limestone (~75% of world output; Gutierrez et al.
        2025, Section 1 & Table 1) — use mineral/inorganic feedstocks with no animal material.
      pl: >-
        Obie drogi przemysłowe — oczyszczanie naturalnej trony lub solanek (USGS) oraz synteza chemiczna, np.
        proces Solvaya z solanki NaCl i wapienia (~75% światowej produkcji; Gutierrez i in. 2025, sekcja 1 i
        tabela 1) — wykorzystują surowce mineralne i nieorganiczne bez udziału materiału zwierzęcego.
    sources:
      - id: usgs-mcs-soda-ash-2025
      - id: gutierrez-2025-soda-ash
        locator: "Section 1 & Table 1"
  - code: diet.vegetarian
    certainty: 'yes'
    kind: estimate
    grade: B
    note:
      en: >-
        Both commercial routes — refining natural trona or sodium-carbonate brines (USGS) and chemical synthesis
        such as the Solvay process from NaCl brine and calcined limestone (~75% of world output; Gutierrez et al.
        2025, Section 1 & Table 1) — use mineral/inorganic feedstocks with no animal material.
      pl: >-
        Obie drogi przemysłowe — oczyszczanie naturalnej trony lub solanek (USGS) oraz synteza chemiczna, np.
        proces Solvaya z solanki NaCl i wapienia (~75% światowej produkcji; Gutierrez i in. 2025, sekcja 1 i
        tabela 1) — wykorzystują surowce mineralne i nieorganiczne bez udziału materiału zwierzęcego.
    sources:
      - id: usgs-mcs-soda-ash-2025
      - id: gutierrez-2025-soda-ash
        locator: "Section 1 & Table 1"
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group I additive (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis in most food
        categories.
      pl: >-
        Dodatek grupy I (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis w większości kategorii żywności.
    source: swm-reg-1129-2011
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Identity-only: no EFSA food-additive re-evaluation of E 500 was found (only a 2010 feed opinion) and the
    JECFA database was not reachable, so no assessment or reference value is recorded.
