id: diphosphates
type: additive
e_number: E450
names:
  en:
    - diphosphates
    - disodium diphosphate
    - tetrasodium diphosphate
    - sodium acid pyrophosphate
    - pyrophosphates
  pl:
    - difosforany
    - difosforan
    - difosforan disodowy
    - difosforan tetrasodowy
    - difosforan sodu
    - pirofosforan sodu
    - kwaśny pirofosforan sodu
  de:
    - Diphosphate
    - Dinatriumdiphosphat
functions:
  - raising-agent
  - emulsifying-salts
  - stabiliser
  - acidity-regulator
summary:
  en: >-
    Sodium, potassium and calcium salts of diphosphoric acid, used as raising-agent acids, emulsifying salts
    and stabilisers. EFSA (2019) set a group ADI of 40 mg/kg body weight a day, expressed as phosphorus, for
    all phosphate additives (E 338–341, E 343, E 450–452), and noted that estimated intake from the whole diet
    exceeded it on average for infants, toddlers and other children.
  pl: >-
    Sole sodowe, potasowe i wapniowe kwasu difosforowego, stosowane jako kwaśne składniki proszków do
    pieczenia, sole emulgujące i stabilizatory. EFSA (2019) ustaliła grupowe ADI 40 mg/kg masy ciała na dzień,
    wyrażone jako fosfor, dla wszystkich fosforanów stosowanych jako dodatki (E 338–341, E 343, E 450–452), i
    zauważyła, że szacowane spożycie z całej diety przekraczało je średnio u niemowląt, małych dzieci i
    starszych dzieci.
assertions:
  - code: origin.mineral
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: >-
        EFSA (2019) Section 3.1.4 documents that phosphoric acid is produced from phosphate rock (via the wet
        process or electrothermal reduction), neutralised with alkalis and thermally condensed/dehydrated to
        manufacture diphosphates (E 450).
      pl: >-
        Sekcja 3.1.4 opinii EFSA (2019) dokumentuje, że kwas fosforowy wytwarza się ze skały fosforytowej
        (metodą mokrą lub redukcją elektrotermiczną), zobojętnia alkaliami i odwadnia termicznie w celu
        otrzymania difosforanów (E 450).
    sources:
      - id: efsa-phosphates-2019
        locator: Section 3.1.4
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Authorised in listed food categories at maximum levels expressed as P2O5, individually or combined
        with the other phosphates.
      pl: >-
        Dopuszczony w wymienionych kategoriach żywności w maksymalnych ilościach wyrażonych jako P2O5,
        pojedynczo lub łącznie z innymi fosforanami.
    source: swm-reg-1129-2011
reference_values:
  - type: group_ADI
    value: 40
    unit: mg/kg bw/day (as phosphorus)
    body: EFSA
    year: 2019
    source: efsa-phosphates-2019
review_status: draft
provenance: ai-drafted
