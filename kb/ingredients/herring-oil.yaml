summary:
  en: >-
    Marine fish oil extracted from herring (Clupea harengus). As a product derived from fish, it falls under EU
    Annex II item 4 fish allergen labelling without an exemption for fish oil.
  pl: >-
    Olej rybny pozyskiwany ze śledzia (Clupea harengus). Jako produkt pochodzący z ryb podlega obowiązkowi
    deklarowania alergenu z Aneksu II UE (punkt 4) i nie jest wyłączony dla oleju rybnego.
