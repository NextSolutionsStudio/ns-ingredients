id: hydrogenated-fat
type: fat
names:
  en: [hydrogenated fat or oil]
  pl: [tłuszcz utwardzony, utwardzony oil, utwardzone oil, uwodorniony oil, uwodornione oil, olej hydrogenated]
summary:
  en: >-
    A fat or oil that the label calls hardened (hydrogenated) without saying whether it is vegetable or animal,
    such as a bare "tłuszcz utwardzony" or "olej częściowo uwodorniony". Hydrogenation can be partial, which
    forms industrial trans fat, or full, which leaves essentially none. In a bracket after a named oil or fat
    ("olej sojowy (częściowo uwodorniony)") the named parent carries the origin.
  pl: >-
    Tłuszcz lub olej, który etykieta nazywa utwardzonym (uwodornionym), nie mówiąc, czy jest roślinny, czy
    zwierzęcy, np. samo "tłuszcz utwardzony" albo "olej częściowo uwodorniony". Utwardzanie może być częściowe,
    co tworzy przemysłowe tłuszcze trans, albo całkowite, praktycznie bez nich. W nawiasie po nazwanym oleju lub
    tłuszczu ("olej sojowy (częściowo uwodorniony)") pochodzenie niesie nazwany składnik nadrzędny.
variants:
  - id: partially-hydrogenated
    names:
      en: [partially hydrogenated fat or oil]
      pl: [tłuszcz częściowo utwardzony, częściowo utwardzony oil, częściowo utwardzone oil, częściowo uwodorniony oil, częściowo uwodornione oil, olej partially hydrogenated]
    process:
      en: "Some but not all double bonds are hydrogenated, leaving a mix of natural cis and industrially formed trans unsaturated fatty acids."
      pl: "Utwardzeniu podlega część, nie wszystkie, wiązania podwójne, co pozostawia mieszankę naturalnych (cis) i powstałych przemysłowo (trans) nienasyconych kwasów tłuszczowych."
    tells: ['(?<!\b(?:nie ?podda\w*|nie|ani|bez|brak|not|non|no|without|ohne|nicht|free from|free of)(?: (?:podda\w*|zosta\w*|byl\w*|jest|sa|procesu|procesowi|procesom|czesciow\w*|calkowit\w*|peln\w*|partial\w*|full\w*|total\w*|subjected|to|been|was|were|is|any|dodatku|dodania|zawartosci|uzycia|zastosowania|udzialu|tluszcz\w*|olej\w*|added|containing|contains|fats?|oils?|zawier\w*|zawiera\w*)){0,3} )czesciowo (?:utwardzon|uwodorn)', '(?<!\b(?:nie ?podda\w*|nie|ani|bez|brak|not|non|no|without|ohne|nicht|free from|free of)(?: (?:podda\w*|zosta\w*|byl\w*|jest|sa|procesu|procesowi|procesom|czesciow\w*|calkowit\w*|peln\w*|partial\w*|full\w*|total\w*|subjected|to|been|was|were|is|any|dodatku|dodania|zawartosci|uzycia|zastosowania|udzialu|tluszcz\w*|olej\w*|added|containing|contains|fats?|oils?|zawier\w*|zawiera\w*)){0,3} )partially hydrogenated', '(?<!\b(?:nie ?podda\w*|nie|ani|bez|brak|not|non|no|without|ohne|nicht|free from|free of)(?: (?:podda\w*|zosta\w*|byl\w*|jest|sa|procesu|procesowi|procesom|czesciow\w*|calkowit\w*|peln\w*|partial\w*|full\w*|total\w*|subjected|to|been|was|were|is|any|dodatku|dodania|zawartosci|uzycia|zastosowania|udzialu|tluszcz\w*|olej\w*|added|containing|contains|fats?|oils?|zawier\w*|zawiera\w*)){0,3} )teilweise gehartet']
  - id: fully-hydrogenated
    names:
      en: [fully hydrogenated fat or oil]
      pl: [tłuszcz całkowicie utwardzony, całkowicie utwardzony oil, całkowicie utwardzone oil, całkowicie uwodorniony oil, całkowicie uwodornione oil, w pełni utwardzony oil, w pełni utwardzone oil, w pełni uwodorniony oil, w pełni uwodornione oil, olej fully hydrogenated, olej totally hydrogenated]
    process:
      en: "All double bonds are hydrogenated; the fat is fully saturated, very hard, and contains essentially no trans fat."
      pl: "Wszystkie wiązania podwójne są utwardzone; tłuszcz jest w pełni nasycony, bardzo twardy i praktycznie nie zawiera tłuszczów trans."
