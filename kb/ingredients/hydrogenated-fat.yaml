summary:
  en: >-
    A fat or oil that the label calls hardened (hydrogenated) without saying whether it is vegetable or animal,
    such as a bare "tłuszcz utwardzony" or "olej częściowo uwodorniony". Hydrogenation can be partial, which
    forms industrial trans fat, or full, which leaves essentially none. In a bracket after a named oil or fat
    ("olej sojowy (częściowo uwodorniony)") the named parent carries the origin.
  pl: >-
    Tłuszcz lub olej, który etykieta nazywa utwardzonym (uwodornionym), nie mówiąc, czy jest roślinny, czy
    zwierzęcy, np. samo "tłuszcz utwardzony" albo "olej częściowo uwodorniony". Utwardzanie może być częściowe,
    co tworzy przemysłowe tłuszcze trans, albo całkowite, praktycznie bez nich. W nawiasie po nazwanym oleju lub
    tłuszczu ("olej sojowy (częściowo uwodorniony)") pochodzenie niesie nazwany składnik nadrzędny.
