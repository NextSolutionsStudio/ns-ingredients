w*|olej\w*|added|containing|contains|fats?|oils?|zawier\w*|zawiera\w*)){0,3} )vollstandig gehartet']
assertions:
  - code: processing.hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares the fat hydrogenated in its list of ingredients, whether partially or fully."
      pl: "Etykieta deklaruje utwardzenie tłuszczu w wykazie składników, częściowe lub całkowite."
    sources: [{ id: reg-1169-2011, locator: "Article 9(1)(b) and Article 18 (list of ingredients)" }]
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat, other than trans fat naturally occurring in animal fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu, poza tłuszczami trans występującymi naturalnie w tłuszczu zwierzęcym."
    sources: [{ id: reg-2019-649 }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "Names of the form \"olej <English qualifier>\" are context-only too: the engine reads an English bracketed qualifier (\"vegetable oil (partially hydrogenated)\") first as \"olej <child>\". The English names are descriptive only, so no bare English alias can outrank a named source (\"non-hydrogenated oil from tuna\")."
  - "Names of the form \"<Polish qualifier> oil\" are context-only: the engine reads a bracketed qualifier after an oil or fat (\"olej sojowy (częściowo uwodorniony)\") as \"<qualifier> oil\". No label prints them, so they cannot outrank a source named in real text."
  - "No origin and no diet on purpose: a bare hardened fat may be vegetable or animal. Named oils and fats carry their own hydrogenation variants (palm, rapeseed, lard, ...)."
