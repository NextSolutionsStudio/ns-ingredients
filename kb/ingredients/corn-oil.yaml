        - vollständig gehärtetes Maisöl
    process:
      en: "Corn oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej kukurydziany ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells:
