        - olej z kukurydzy częściowo uwodorniony
      de:
        - teilweise gehärtetes Maiskeimöl
        - teilweise gehärtetes Maisöl
    process:
      en: "Corn oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej kukurydziany, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - 'czesciowo (?:utwardzon|uwodorn)'
      - '(?<!not )(?<!non )partially hydrogenated'
      - 'teilweise gehartet'
