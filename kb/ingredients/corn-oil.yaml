        - olej z kiełków kukurydzy uwodorniony
        - utwardzony olej z kukurydzy
        - olej z kukurydzy utwardzony
        - uwodorniony olej z kukurydzy
        - olej z kukurydzy uwodorniony
      de:
        - gehärtetes Maiskeimöl
        - gehärtetes Maisöl
    process:
      en: "Corn oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej kukurydziany utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!not )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)'
  - id: partially-hydrogenated
    names:
      en:
        - partially hydrogenated corn oil
        - partially hydrogenated maize oil
      pl:
        - częściowo utwardzony olej kukurydziany
        - olej kukurydziany częściowo utwardzony
