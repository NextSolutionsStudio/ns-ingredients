regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group II colour (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis where colours
        are allowed.
      pl: >-
        Barwnik grupy II (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis tam, gdzie barwniki są dozwolone.
    source: swm-reg-1129-2011
reference_values:
  - type: ADI
    value: not established
    body: EFSA
    year: 2012
    source: efsa-carotenes-2012
  - type: ADI
    value: 5
    unit: mg/kg bw/day
    body: JECFA
    year: 2001
    source: efsa-carotenes-2012
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Reviewer decision: EFSA 2012 established no ADI because rodent data are unsuitable (rodents convert
    beta-carotene to vitamin A far more efficiently than humans), and set an intake condition (≤ 5–10 mg/day
    from colour and supplement use, keeping total supplemental beta-carotene under 15 mg/day).
    health.no_safe_level_established was NOT asserted: EFSA found no safety concern at colour-use levels, so
    it reads as a conditional all-clear rather than 'no safe level'. Revisit if the code's definition is meant
    to cover it.
  - >-
    Variant numbering follows Reg 231/2012 as published (E 160a(i) beta-carotene, (ii) plant carotenes, (iii)
    Blakeslea trispora, (iv) algal); the EFSA 2012 opinion uses the older two-way split (mixed carotenes /
    beta-carotene). No priors: no market-share source was opened.
  - >-
    Not asserted: diet.vegan. All four routes are non-animal, but commercial beta-carotene preparations are
    often formulated with carriers (possibly gelatine) that this specification does not cover.
