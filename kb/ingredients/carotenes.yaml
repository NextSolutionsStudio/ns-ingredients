id: carotenes
type: additive
e_number: E160a
names:
  en:
    - carotenes
    - beta-carotene
    - mixed carotenes
    - plant carotenes
    - algal carotenes
  pl:
    - karoteny
    - karoten
    - beta-karoten
    - karoteny roślinne
    - karoteny z alg
  de:
    - Carotine
    - Beta-Carotin
functions:
  - colour
summary:
  en: >-
    Orange colours from the carotene family. E 160a covers four routes: synthetic beta-carotene, carotenes
    extracted from plants (carrots, vegetable oils, grass, alfalfa, nettle), beta-carotene from fermentation
    of the fungus Blakeslea trispora, and carotenes from the alga Dunaliella salina. A label saying only
    'karoteny' does not tell them apart. EFSA (2012) could not set an ADI from the available data, but found
    no safety concern for use as a colour as long as intake from colours and supplements stays within what
    ordinary food provides (5–10 mg a day).
  pl: >-
    Pomarańczowe barwniki z grupy karotenów. E 160a obejmuje cztery drogi: syntetyczny beta-karoten, karoteny
    ekstrahowane z roślin (marchew, oleje roślinne, trawa, lucerna, pokrzywa), beta-karoten z fermentacji
    grzyba Blakeslea trispora oraz karoteny z alg Dunaliella salina. Etykieta z samym „karoteny” ich nie
    rozróżnia. EFSA (2012) nie mogła ustalić ADI na podstawie dostępnych danych, ale nie widziała zagrożenia
    przy stosowaniu jako barwnik, o ile spożycie z barwników i suplementów nie przekracza ilości dostarczanej
    przez zwykłą żywność (5–10 mg dziennie).
variants:
  - id: synthetic
    names:
      en:
        - synthetic beta-carotene
      pl:
        - syntetyczny beta-karoten
    process:
      en: Beta-carotene made by chemical synthesis (E 160a(i)).
      pl: Beta-karoten otrzymywany syntezą chemiczną (E 160a(i)).
    tells:
      - syntetyczn
      - synthetic
  - id: plant
    names:
      en:
        - plant carotenes
      pl:
        - karoteny roślinne
    process:
      en: 'Solvent extraction of edible plants, carrots, vegetable oils, grass, alfalfa or nettle (E 160a(ii)).'
      pl: >-
        Ekstrakcja rozpuszczalnikiem z roślin jadalnych, marchwi, olejów roślinnych, trawy, lucerny lub
        pokrzywy (E 160a(ii)).
    tells:
      - roslinn
      - z marchwi
      - plant carotenes
  - id: blakeslea
    names:
      en:
        - beta-carotene from Blakeslea trispora
    process:
      en: >-
        Fermentation with the fungus Blakeslea trispora, then solvent extraction and crystallisation (E
        160a(iii)).
      pl: >-
        Fermentacja z udziałem grzyba Blakeslea trispora, następnie ekstrakcja rozpuszczalnikiem i
        krystalizacja (E 160a(iii)).
    tells:
      - blakeslea
  - id: algal
    names:
      en:
        - algal carotenes
      pl:
        - karoteny z alg
    process:
      en: Extracted from the alga Dunaliella salina and suspended in edible oil (E 160a(iv)).
      pl: Ekstrahowane z alg Dunaliella salina i zawieszone w oleju jadalnym (E 160a(iv)).
    tells:
      - z alg
      - algal
      - dunaliella
