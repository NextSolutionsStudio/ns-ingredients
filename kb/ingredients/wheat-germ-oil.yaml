summary:
  en: >-
    Vegetable oil pressed or extracted from wheat germ. As a product derived from wheat, it falls under EU
    Annex II item 1 (cereals containing gluten); the item's exemptions do not include wheat germ oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z kiełków pszenicy. Jako produkt z pszenicy podlega punktowi 1
    Aneksu II UE (zboża zawierające gluten); wyłączenia z tego punktu nie obejmują oleju z kiełków pszenicy.
