id: modified-starch
type: additive
names:
  en:
    - modified starch
    - modified starches
  pl:
    - skrobia modyfikowana
    - skrobie modyfikowane
  de:
    - modifizierte Stärke
functions:
  - modified-starch
  - thickener
summary:
  en: >-
    Starch from maize, potato, tapioca, wheat or another plant, changed chemically (cross-linked, acetylated,
    oxidised, hydroxypropylated…) so it thickens and stays stable through heating, freezing or acid. EU labels
    may say just 'modified starch' without the E-number (E 1404–E 1452), so this entry stands for the whole
    family; a named E-number resolves to its own entry. EFSA (2017) found no safety concern at the reported
    uses and saw no need for a numerical ADI.
  pl: >-
    Skrobia z kukurydzy, ziemniaków, tapioki, pszenicy lub innej rośliny zmieniona chemicznie (sieciowana,
    acetylowana, utleniana, hydroksypropylowana…), aby zagęszczała i zachowywała stabilność przy ogrzewaniu,
    zamrażaniu czy w środowisku kwaśnym. Etykieta w UE może podać samo „skrobia modyfikowana” bez numeru E (E
    1404–E 1452), więc ten wpis obejmuje całą grupę; podany numer E prowadzi do osobnego wpisu. EFSA (2017)
    nie stwierdziła zagrożenia przy zgłoszonych zastosowaniach i nie widziała potrzeby ustalania liczbowego
    ADI.
