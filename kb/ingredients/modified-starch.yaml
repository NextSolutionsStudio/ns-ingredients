review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Generic family entry for the label term 'modified starch' (Reg 1169/2011 Annex VII Part C footnote 19 lets
    labels omit the E-number). Named E 1404–E 1452 still resolve to their own (generated) entries.
  - >-
    Bare 'modified starch' is gluten 'unknown' on purpose, matching METHODOLOGY's treatment of modified
    starches from the identity backbone. Reviewer question: Art. 21 emphasis rules arguably make a silent EU
    label non-wheat; if accepted, the ingredient-wide claim can go.
  - >-
    No processing.ultra_processed_marker claim: the KB applies that code to flavourings and protein isolates
    but not yet to other additive classes (lecithins, E471, carrageenan); kept consistent until that policy is
    decided.
