      pl: Wytwarzana ze skrobi roślinnej.
    sources:
      - id: efsa-modified-starches-2017
      - id: reg-231-2012
        locator: E 1404–E 1452 definitions
  - code: diet.gluten_free
    certainty: unknown
    kind: estimate
    grade: D
    note:
      en: >-
        A bare 'modified starch' does not say which plant it came from, and wheat is one of the possible
        sources.
      pl: >-
        Samo „skrobia modyfikowana” nie mówi, z jakiej rośliny pochodzi, a jednym z możliwych źródeł jest
        pszenica.
    sources:
      - id: reg-1169-2011
        locator: 'Annex VII Part C, ''Modified starch'' and footnote 19'
  - code: allergen.gluten
    variant: wheat
    certainty: 'yes'
    kind: fact
    grade: A
    population:
      - coeliac
    note:
      en: The label names wheat as the source; EU Annex II item 1.
      pl: 'Etykieta podaje pszenicę jako źródło; załącznik II UE, pkt 1.'
    sources:
      - id: reg-1169-2011
        locator: Annex II item 1
  - code: diet.gluten_free
    variant: wheat
    certainty: 'no'
    kind: fact
    grade: A
    note:
