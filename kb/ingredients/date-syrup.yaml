id: date-syrup
type: carbohydrate
names:
  en: ["date syrup","date molasses","date honey","silan"]
  pl: ["syrop daktylowy","syropu daktylowego","syrop z daktyli","melasa daktylowa"]
  de: ["Dattelsirup","Dattelmelasse"]
summary:
  en: "A syrup made by extracting date fruits with water, clarifying the liquid and concentrating it. Evaporation can be used for concentration. The principal sugars are generally glucose and fructose, with sucrose and other soluble date constituents also present."
  pl: "Syrop otrzymywany przez ekstrakcję owoców daktylowca wodą, klarowanie cieczy i jej zagęszczanie. Zagęszczanie może wykorzystywać odparowanie wody. Głównymi cukrami są zwykle glukoza i fruktoza, obecne są też sacharoza i inne rozpuszczalne składniki daktyli."
assertions:
  - code: health.added_sugar
    certainty: yes
    kind: fact
    grade: A
    population: [general]
    note:
      en: "Added as an ingredient, it counts as a free sugar in WHO's sense. WHO strongly recommends keeping free sugars under 10% of energy intake. The ingredient list does not show how much is in the product."
      pl: "Dodany jako składnik, jest cukrem wolnym w rozumieniu WHO. WHO zdecydowanie zaleca, by cukry wolne stanowiły mniej niż 10% energii z diety. Lista składników nie pokazuje, ile go jest w produkcie."
    sources: [{ id: who-free-sugars-2015 }]
  - code: origin.plant
    certainty: yes
    kind: estimate
    grade: D
    note:
      en: "Date fruit is extracted with water, the juice clarified and concentrated, including by vacuum evaporation; processing details vary."
      pl: "Owoce daktylowca ekstrahuje się wodą, sok klaruje i zagęszcza, także przez odparowanie pod próżnią; szczegóły procesu są zmienne."
    sources: [{ id: sug-dates-fao }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "No numerical route priors: the opened sources do not establish probabilities for an undisclosed label. No blanket vegan or gluten-free claim: processing aids and batch certification were not verified."
  - "No palm-sap syrup equivalence was assumed: this entry describes syrup extracted from date fruits."
