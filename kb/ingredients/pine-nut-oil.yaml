  de:
    - Pinienkernöl
    - Zedernussöl
summary:
  en: >-
    Vegetable oil pressed from pine nuts, the edible seeds of pines such as Pinus pinea and Pinus sibirica. Pine nuts
    are not among the tree nuts listed in EU Annex II item 8, so the oil carries no tree-nut allergen declaration.
  pl: >-
    Olej roślinny tłoczony z orzeszków piniowych, jadalnych nasion sosen, np. pinii (Pinus pinea) i sosny syberyjskiej
    (Pinus sibirica). Orzeszki piniowe nie należą do orzechów wymienionych w Aneksie II UE (punkt 8), więc olej nie
    podlega deklaracji alergenu orzechów.
