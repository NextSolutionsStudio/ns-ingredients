summary:
  en: >-
    Vegetable oil pressed from flax seeds (Linum usitatissimum), rich in alpha-linolenic acid (an omega-3
    polyunsaturated fatty acid); used in food chiefly in cold-pressed form.
  pl: >-
    Olej roślinny tłoczony z nasion lnu (siemienia lnianego, Linum usitatissimum), bogaty w kwas
    alfa-linolenowy (wielonienasycony kwas tłuszczowy omega-3); w żywności stosowany głównie jako olej
    tłoczony na zimno.
