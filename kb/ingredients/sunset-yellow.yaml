id: sunset-yellow
type: additive
e_number: E110
ids: { cas: "2783-94-0", wikidata: Q410095, chebi: "CHEBI:82538", pubchem: 17730 }
names:
  en: [sunset yellow FCF, sunset yellow, orange yellow S]
  pl: [żółcień pomarańczowa FCF, żółcień pomarańczowa S]
  de: [Gelborange S, Gelborange]
functions: [colour]
summary:
  en: >-
    A synthetic orange-yellow azo dye made by chemical synthesis, used in drinks, sauces, desserts and
    sweets. It is one of the "Southampton six" colours that must carry the EU label warning about
    activity and attention in children, and is one of the six remaining US-approved synthetic dyes the
    FDA asked industry to phase out from 2025 as part of a move away from petroleum-based colours.
  pl: >-
    Syntetyczny pomarańczowo-żółty barwnik azowy otrzymywany syntezą chemiczną, stosowany w napojach,
    sosach, deserach i słodyczach. Jest jednym z „sześciu z Southampton” barwników, które muszą nosić na
    etykiecie w UE ostrzeżenie o wpływie na aktywność i uwagę dzieci, oraz jednym z sześciu wciąż
    dopuszczonych w USA syntetycznych barwników, których wycofania z rynku FDA zażądała od przemysłu od
    2025 r. w ramach odchodzenia od barwników pochodzenia petrochemicznego.
assertions:
  - code: health.southampton_colour
    certainty: yes
    kind: fact
    grade: A
    population: [children]
    note:
      en: "One of six colours (with E102, E104, E122, E124, E129) that trigger the mandatory EU label statement, following the 2007 McCann RCT that found a mixture of these colours (plus sodium benzoate) increased hyperactive behaviour in young children."
      pl: "Jeden z sześciu barwników (wraz z E102, E104, E122, E124, E129) wymagających obowiązkowego oświadczenia na etykiecie w UE, w związku z badaniem RCT McCann z 2007 r., które wykazało, że mieszanka tych barwników (i benzoesanu sodu) zwiększała nadpobudliwość u małych dzieci."
    sources: [{ id: reg-1333-2008, locator: "Annex V" }, { id: mccann-2007 }]
  - code: regulatory.eu_warning_label
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Label must state '[name/E-number]: may have an adverse effect on activity and attention in children.'"
      pl: "Etykieta musi zawierać zapis: „[nazwa/numer E]: może mieć szkodliwy wpływ na aktywność i skupienie uwagi u dzieci”."
    sources: [{ id: reg-1333-2008, locator: "Annex V" }]
  - code: origin.petrochemical_synthetic
    certainty: yes
    kind: fact
    grade: B
    note:
      en: "An azo dye made by diazo coupling of aromatic-sulfonic-acid intermediates; described directly as 'a petroleum-derived orange azo dye', and named by US HHS/FDA (April 2025) among the 'petroleum-based synthetic dyes' being phased out."
      pl: "Barwnik azowy otrzymywany przez sprzęganie azowe pośrednich kwasów aromatyczno-sulfonowych; opisywany bezpośrednio jako „barwnik azowy pochodzenia petrochemicznego”, wymieniony przez amerykańskie HHS/FDA (kwiecień 2025) wśród „syntetycznych barwników pochodzenia petrochemicznego” wycofywanych z rynku."
    sources: [{ id: col-wikipedia-sunset-yellow }, { id: col-fda-dye-phaseout-2025 }]
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions: { en: "Authorised in specific food categories under Annex II conditions; triggers the Annex V children's attention/activity warning.", pl: "Dopuszczony w określonych kategoriach żywności zgodnie z Załącznikiem II; wymaga ostrzeżenia z Załącznika V o wpływie na aktywność i uwagę dzieci." }
    source: reg-1333-2008
review_status: draft
provenance: ai-drafted
review_notes:
  - "Per-category Annex II maximum levels for E110 not transcribed here (avoid a wrong number)."
  - "US FDA's 2025 phase-out is a voluntary industry request, not a ban — regulatory status there is still 'authorised'; not modelled as a separate `regulatory` row for that reason."
