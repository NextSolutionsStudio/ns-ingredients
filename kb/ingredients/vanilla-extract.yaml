id: vanilla-extract
type: flavouring
names:
  en:
    - vanilla extract
    - pure vanilla extract
    - Bourbon vanilla extract
  pl:
    - ekstrakt z wanilii
    - ekstrakt z wanili
    - ekstrakt waniliowy
    - ekstrakt z laski wanilii
    - ekstrakt z wanilii Bourbon
  de:
    - Vanilleextrakt
    - Bourbon-Vanilleextrakt
summary:
  en: >-
    An aromatic extract made by macerating and percolating cured vanilla pods (Vanilla planifolia / Vanilla
    tahitensis) in an ethanol-water solution. Unlike synthetic vanillin, it contains hundreds of natural
    flavour compounds from the vanilla bean and qualifies as a flavouring preparation of plant origin under
    EU Regulation (EC) No 1334/2008.
  pl: >-
    Aromatyczny ekstrakt otrzymywany przez macerację i perkolację lasek wanilii (Vanilla planifolia / Vanilla
    tahitensis) w roztworze etanolu i wody. W przeciwieństwie do syntetycznej waniliny zawiera setki
    naturalnych związków zapachowych z laski wanilii i kwalifikuje się jako preparat aromatyczny pochodzenia
    roślinnego w rozumieniu Rozporządzenia (WE) nr 1334/2008.
assertions:
  - code: origin.plant
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: >-
        Obtained by extracting vanilla pods (vegetable material) in ethanol and water; a flavouring preparation
        from plant material under Reg 1334/2008 Art. 3(2)(d).
      pl: >-
        Otrzymywany przez ekstrakcję lasek wanilii (materiał roślinny) w etanolu i wodzie; preparat aromatyczny
        z materiału roślinnego w rozumieniu art. 3 ust. 2 lit. d) Rozp. 1334/2008.
    sources:
      - id: wiki-vanilla-extract
      - id: reg-1334-2008
        locator: Article 3(2)(d)
  - code: diet.vegan
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Extracted from vanilla pods in ethanol and water; no animal material.
      pl: Ekstrahowany z lasek wanilii w etanolu i wodzie; brak surowców zwierzęcych.
    sources:
      - id: wiki-vanilla-extract
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Includes the common Polish label misspelling "ekstrakt z wanili" (single 'i') seen in real labels.
  - >-
    No processing.ultra_processed_marker assertion: botanical culinary extract (infusion of vanilla pods),
    consistent with spice-extracts.yaml, rosemary-extract.yaml and paprika-extract.yaml rather than synthetic
    or generic flavouring.yaml.
