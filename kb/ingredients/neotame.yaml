id: neotame
type: additive
e_number: E961
ids:
  cas: 165450-17-9
names:
  en:
  - neotame
  pl:
  - neotam
  de:
  - Neotam
functions:
- sweetener
- flavour-enhancer
summary:
  en: An intense sweetener made by chemical modification of aspartame, used in foods and beverages. The EU
    specification describes reaction with 3,3-dimethylbutyraldehyde under hydrogen with a palladium catalyst,
    followed by purification. E961 is authorised in specified EU categories and in the US under conditions
    of use; EFSA set an ADI of 10 mg/kg body weight/day in 2025.
  pl: Intensywna substancja słodząca otrzymywana przez chemiczną modyfikację aspartamu, stosowana w żywności
    i napojach. Specyfikacja UE opisuje reakcję z aldehydem 3,3-dimetylomasłowym w atmosferze wodoru, z katalizatorem
    palladowym, a następnie oczyszczanie. E961 jest dopuszczony w określonych kategoriach żywności w UE i na
    określonych warunkach w USA; w 2025 r. EFSA ustaliła ADI na 10 mg/kg masy ciała na dobę.
assertions:
- code: origin.chemical_synthesis
  certainty: 'yes'
  kind: fact
  grade: A
  note:
    en: The EU specification describes aspartame and 3,3-dimethylbutyraldehyde reacting in methanol under hydrogen
      with palladium on carbon; filtration, solvent removal and drying follow.
    pl: Specyfikacja UE opisuje reakcję aspartamu z aldehydem 3,3-dimetylomasłowym w metanolu, w atmosferze
      wodoru, z palladem na węglu; kolejne etapy to filtracja, usunięcie rozpuszczalnika i suszenie.
  sources:
  - id: swm-reg-231-2012
- code: processing.non_sugar_sweetener
  certainty: 'yes'
  kind: fact
  grade: A
  note:
    en: 'Named by WHO as a common non-sugar sweetener. WHO''s 2023 guideline conditionally recommends against
      using non-sugar sweeteners for weight control; it does not apply to people with pre-existing diabetes.
      This marks the ingredient''s role, not a safety finding: the authorised use limits are set by the ADI.'
    pl: 'WHO wymienia go wśród typowych substancji słodzących niecukrowych. Wytyczna WHO z 2023 r. warunkowo
      odradza stosowanie substancji słodzących niecukrowych w celu kontroli masy ciała; nie dotyczy osób z
      cukrzycą. Oznacza rolę składnika, nie ocenę bezpieczeństwa: limity stosowania wynikają z ADI.'
  sources:
  - id: who-nss-guideline-2023
regulatory:
- jurisdiction: EU
  status: authorised
  conditions:
    en: Listed in Annex II to Regulation 1333/2008; use is subject to food-category conditions and applicable
      limits.
    pl: Wymieniony w załączniku II do rozporządzenia 1333/2008; stosowanie podlega warunkom i limitom dla kategorii
      żywności.
  source: swm-reg-1129-2011
- jurisdiction: US
  status: authorised
  conditions:
    en: FDA permits general-purpose sweetener and flavour-enhancer uses under specified conditions, except
      in meat and poultry.
    pl: FDA zezwala na stosowanie jako substancji słodzącej i wzmacniacza smaku na określonych warunkach, z
      wyjątkiem mięsa i drobiu.
  source: swm-fda-sweeteners
reference_values:
- type: ADI
  value: 10
  unit: mg/kg bw/day
  body: EFSA
  year: 2025
  source: swm-efsa-neotame-2025
review_status: draft
provenance: ai-drafted
review_notes:
- Individual current food-category maximum levels were not exhaustively checked or transcribed; consult the
  consolidated EU list for a particular product.
- 'No diet, GMO, feedstock-country or general health-benefit assertions: the opened sources do not verify these
  for a particular supplier.'
- The 2007 EFSA ADI of 2 mg/kg body weight/day is superseded by the opened 2025 opinion and is not listed.
- No PKU suitability claim added; chemical derivation from aspartame alone does not establish a labelling requirement.
