summary:
  en: >-
    A fat or oil that the label says is not hydrogenated, without naming whether it is vegetable or animal
    ("non-hydrogenated fat", "olej nieutwardzony"). The label's negation is the whole point: it takes no
    hydrogenation and no trans-fat flag.
  pl: >-
    Tłuszcz lub olej, który według etykiety nie jest utwardzony, bez wskazania, czy jest roślinny, czy zwierzęcy
    ("non-hydrogenated fat", "olej nieutwardzony"). Zaprzeczenie na etykiecie jest tu istotą rzeczy: składnik
    nie dostaje oznaczenia utwardzenia ani tłuszczów trans.
