id: unhydrogenated-fat
type: fat
names:
  en: [non-hydrogenated fat or oil]
  pl: [tłuszcz lub olej nieutwardzony, nie utwardzony oil, nie utwardzone oil, nie uwodorniony oil, nie uwodornione oil, nieutwardzony oil, nieutwardzone oil, nieuwodorniony oil, nieuwodornione oil, olej non-hydrogenated, olej unhydrogenated, olej not hydrogenated, olej not partially hydrogenated, olej not fully hydrogenated]
summary:
  en: >-
    A fat or oil that the label says is not hydrogenated, without naming whether it is vegetable or animal
    ("non-hydrogenated fat", "olej nieutwardzony"). The label's negation is the whole point: it takes no
    hydrogenation and no trans-fat flag.
  pl: >-
    Tłuszcz lub olej, który według etykiety nie jest utwardzony, bez wskazania, czy jest roślinny, czy zwierzęcy
    ("non-hydrogenated fat", "olej nieutwardzony"). Zaprzeczenie na etykiecie jest tu istotą rzeczy: składnik
    nie dostaje oznaczenia utwardzenia ani tłuszczów trans.
assertions: []
review_status: draft
provenance: ai-drafted
review_notes:
  - "Names of the form \"olej <English qualifier>\" are context-only too: the engine reads an English bracketed qualifier (\"vegetable oil (partially hydrogenated)\") first as \"olej <child>\". The English names are descriptive only, so no bare English alias can outrank a named source (\"non-hydrogenated oil from tuna\")."
  - "Names of the form \"<Polish negation> oil\" are context-only, as on hydrogenated-fat: they resolve a bracketed \"(nieutwardzony)\" after an oil or fat."
  - "No origin, no diet and no processing on purpose: the label denies hydrogenation and does not name the source."
