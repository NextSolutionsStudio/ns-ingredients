provenance: ai-drafted
review_notes:
  - "Names of the form \"olej <English qualifier>\" are context-only too: the engine reads an English bracketed qualifier (\"vegetable oil (partially hydrogenated)\") first as \"olej <child>\". The English names are descriptive only, so no bare English alias can outrank a named source (\"non-hydrogenated oil from tuna\")."
  - "Names of the form \"<Polish negation> oil\" are context-only, as on hydrogenated-fat: they resolve a bracketed \"(nieutwardzony)\" after an oil or fat."
  - "No origin, no diet and no processing on purpose: the label denies hydrogenation and does not name the source."
