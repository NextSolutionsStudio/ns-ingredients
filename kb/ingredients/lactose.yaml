id: lactose
type: carbohydrate
names:
  en: [lactose]
  pl: [laktoza]
  de: [Laktose, Milchzucker]
summary:
  en: "Milk sugar (a glucose-galactose disaccharide), extracted mainly from whey; explicitly named within the EU's milk allergen entry regardless of how purified it is."
  pl: "Cukier mleczny (disacharyd glukozy i galaktozy), otrzymywany głównie z serwatki; wymieniony wprost w unijnym wpisie alergenu mlecznego, niezależnie od stopnia oczyszczenia."
  de: "Milchzucker (ein Disaccharid aus Glucose und Galactose), hauptsächlich aus Molke gewonnen; im EU-Allergeneintrag für Milch ausdrücklich genannt."
assertions:
  - code: health.added_sugar
    certainty: yes
    kind: fact
    grade: A
    population: [general]
    note:
      en: "Added as an ingredient, it counts as a free sugar in WHO's sense. WHO strongly recommends keeping free sugars under 10% of energy intake. The ingredient list does not show how much is in the product."
      pl: "Dodany jako składnik, jest cukrem wolnym w rozumieniu WHO. WHO zdecydowanie zaleca, by cukry wolne stanowiły mniej niż 10% energii z diety. Lista składników nie pokazuje, ile go jest w produkcie."
    sources: [{ id: who-free-sugars-2015 }]
  - code: allergen.milk
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Explicitly named in EU Annex II item 7 ('milk and products thereof, including lactose').", pl: "Wymieniona wprost w Aneksie II UE, punkt 7 ('mleko i produkty z mleka, łącznie z laktozą')." }
    sources: [{ id: reg-1169-2011, locator: "Annex II item 7" }]
  - code: origin.dairy
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Extracted from milk/whey.", pl: "Otrzymywana z mleka/serwatki." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.vegan
    certainty: "no"
    kind: fact
    grade: A
    note: { en: "A dairy-derived sugar.", pl: "Cukier pochodzenia mlecznego." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.vegetarian
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Compatible with a lacto-ovo-vegetarian diet.", pl: "Zgodne z dietą laktoowowegetariańską." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.lactose_free
    certainty: "no"
    kind: fact
    grade: A
    note: { en: "Lactose itself.", pl: "Sama laktoza." }
    sources: [{ id: reg-1169-2011 }]
review_status: draft
provenance: ai-drafted
