      pl: "Olej z orzechów włoskich, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - 'czesciowo (?:utwardzon|uwodorn)'
      - 'partially hydrogenated'
