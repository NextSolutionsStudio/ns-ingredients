id: walnut-oil
type: fat
parent: walnuts
names:
  en:
    - walnut oil
    - walnuts oil
  pl:
    - olej z orzechów włoskich
    - olej z orzecha włoskiego
    - olej orzechowy z orzechów włoskich
    - olej roślinny z orzechów włoskich
  de:
    - Walnussöl
summary:
  en: >-
    Vegetable oil pressed from walnuts (Juglans regia). As a product derived from walnuts, it falls under
    EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z orzechów włoskich (Juglans regia). Jako produkt pochodzący z orzechów włoskich
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
assertions:
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: A pressed vegetable oil; EU labelling requires its specific plant origin to be named.
      pl: Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny.
    sources:
      - id: reg-1169-2011
        locator: Annex VII Part A, point 8
  - code: allergen.nuts
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Product derived from walnuts; EU Annex II item 8 (walnuts and products thereof).
      pl: Produkt z orzechów włoskich; Aneks II UE, punkt 8 (orzechy włoskie i produkty z nich).
    sources:
      - id: reg-1169-2011
        locator: Annex II item 8
review_status: draft
provenance: ai-drafted
