id: walnut-oil
type: fat
parent: walnuts
names:
  en:
    - walnut oil
    - walnuts oil
    - non-hydrogenated walnut oil
    - unhydrogenated walnut oil
    - non-hydrogenated walnuts oil
    - unhydrogenated walnuts oil
  pl:
    - olej z orzechów włoskich
    - olej z orzecha włoskiego
    - olej orzechowy z orzechów włoskich
    - olej roślinny z orzechów włoskich
    - olej roślinny z orzecha włoskiego
  de:
    - Walnussöl
summary:
  en: >-
    Vegetable oil pressed from walnuts (Juglans regia). As a product derived from walnuts, it falls under
    EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z orzechów włoskich (Juglans regia). Jako produkt pochodzący z orzechów włoskich
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
variants:
  - id: hydrogenated
    names:
      en:
        - hydrogenated walnut oil
        - hydrogenated walnuts oil
      pl:
        - utwardzony olej z orzechów włoskich
        - olej z orzechów włoskich utwardzony
        - uwodorniony olej z orzechów włoskich
        - olej z orzechów włoskich uwodorniony
        - utwardzony olej z orzecha włoskiego
        - olej z orzecha włoskiego utwardzony
        - uwodorniony olej z orzecha włoskiego
        - olej z orzecha włoskiego uwodorniony
        - utwardzony olej roślinny z orzechów włoskich
        - olej roślinny z orzechów włoskich utwardzony
        - uwodorniony olej roślinny z orzechów włoskich
        - olej roślinny z orzechów włoskich uwodorniony
        - utwardzony olej roślinny z orzecha włoskiego
        - olej roślinny z orzecha włoskiego utwardzony
        - uwodorniony olej roślinny z orzecha włoskiego
        - olej roślinny z orzecha włoskiego uwodorniony
    process:
      en: "Walnut oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej z orzechów włoskich utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)'
