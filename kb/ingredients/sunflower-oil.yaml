id: sunflower-oil
type: fat
names:
  en: [sunflower oil, sunflower seed oil, non-hydrogenated sunflower oil, non hydrogenated sunflower oil, unhydrogenated sunflower oil, non-hydrogenated sunflower seed oil, non hydrogenated sunflower seed oil, unhydrogenated sunflower seed oil]
  pl: [olej słonecznikowy, olej roślinny słonecznikowy, tłuszcz roślinny słonecznikowy, słonecznikowy olej roślinny, tłuszcze roślinne słonecznikowe, oleje roślinne słonecznikowe, oleje roślinne słonecznikowy]
  de: [Sonnenblumenöl, ungehärtetes Sonnenblumenöl, nicht gehärtetes Sonnenblumenöl]
summary:
  en: >-
    Oil pressed from sunflower seeds, mostly unsaturated (linoleic-type, high-oleic cultivars also exist).
    Beyond the liquid oil, a spray-dried "sunflower oil powder" form exists, encapsulating the oil in a
    carbohydrate/protein matrix so it can be added to a dry powder blend without adding a liquid — distinct
    from the multi-oil "vegetable fat powder"/creamer entry in this database.
  pl: >-
    Olej wyciskany z ziaren słonecznika, w większości nienasycony (typ linolowy; istnieją też odmiany
    wysokooleinowe). Poza formą ciekłą istnieje "olej słonecznikowy w proszku" otrzymywany suszeniem
    rozpyłowym — olej otoczony matrycą węglowodanowo-białkową, tak by można go dodać do suchej mieszanki
    bez wprowadzania cieczy. To inny produkt niż wielo-olejowy "tłuszcz roślinny w proszku"/śmietanka
    roślinna opisana w osobnym wpisie tej bazy.
variants:
  - id: powder
    names:
      en: [sunflower oil powder, encapsulated sunflower oil]
      pl: [olej słonecznikowy w proszku, słonecznikowy olej w proszku]
    process:
      en: "Sunflower oil encapsulated/spray-dried into a carbohydrate or protein matrix so it behaves as a dry powder."
      pl: "Olej słonecznikowy otoczony matrycą (enkapsulacja)/suszony rozpyłowo, by zachowywał się jak suchy proszek."
    tells: ['sunflower oil powder', 'encapsulated sunflower', 'olej slonecznikowy w proszku', 'slonecznikowy olej w proszku']
  - id: hydrogenated
    names:
      en: [hydrogenated sunflower oil]
      pl: [utwardzony olej słonecznikowy, olej słonecznikowy utwardzony, uwodorniony olej słonecznikowy, olej słonecznikowy uwodorniony, utwardzony tłuszcz roślinny słonecznikowy, tłuszcz roślinny słonecznikowy utwardzony, utwardzony olej roślinny słonecznikowy, olej roślinny słonecznikowy utwardzony, utwardzone tłuszcze roślinne słonecznikowe, tłuszcze roślinne słonecznikowe utwardzone, utwardzone oleje roślinne słonecznikowe, oleje roślinne słonecznikowe utwardzone]
      de: [gehärtetes Sonnenblumenöl]
    process:
      en: "Sunflower oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej słonecznikowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells: ['(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)']
  - id: partially-hydrogenated
    names:
      en: [partially hydrogenated sunflower oil]
      pl: [częściowo utwardzony olej słonecznikowy, olej słonecznikowy częściowo utwardzony, częściowo uwodorniony olej słonecznikowy, olej słonecznikowy częściowo uwodorniony, częściowo utwardzony tłuszcz roślinny słonecznikowy, tłuszcz roślinny słonecznikowy częściowo utwardzony, częściowo utwardzony olej roślinny słonecznikowy, olej roślinny słonecznikowy częściowo utwardzony, częściowo utwardzone tłuszcze roślinne słonecznikowe, tłuszcze roślinne słonecznikowe częściowo utwardzone, częściowo utwardzone oleje roślinne słonecznikowe, oleje roślinne słonecznikowe częściowo utwardzone]
      de: [teilweise gehärtetes Sonnenblumenöl]
    process:
      en: "Sunflower oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej słonecznikowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells: ['czesciowo (?:utwardzon|uwodorn)', 'partially hydrogenated', 'teilweise gehartet']
  - id: fully-hydrogenated
    names:
      en: [fully hydrogenated sunflower oil, totally hydrogenated sunflower oil]
      pl: [całkowicie utwardzony olej słonecznikowy, olej słonecznikowy całkowicie utwardzony, w pełni utwardzony olej słonecznikowy, olej słonecznikowy w pełni utwardzony, całkowicie uwodorniony olej słonecznikowy, olej słonecznikowy całkowicie uwodorniony, w pełni uwodorniony olej słonecznikowy, olej słonecznikowy w pełni uwodorniony, całkowicie utwardzony tłuszcz roślinny słonecznikowy, tłuszcz roślinny słonecznikowy całkowicie utwardzony, całkowicie utwardzony olej roślinny słonecznikowy, olej roślinny słonecznikowy całkowicie utwardzony, całkowicie utwardzone tłuszcze roślinne słonecznikowe, tłuszcze roślinne słonecznikowe całkowicie utwardzone, całkowicie utwardzone oleje roślinne słonecznikowe, oleje roślinne słonecznikowe całkowicie utwardzone]
      de: [vollständig gehärtetes Sonnenblumenöl]
    process:
      en: "Sunflower oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej słonecznikowy ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells: ['calkowicie (?:utwardzon|uwodorn)', 'w pelni (?:utwardzon|uwodorn)', 'fully hydrogenated', 'totally hydrogenated', 'vollstandig gehartet']
assertions:
  - code: origin.vegetable_oil_derived
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "A pressed vegetable oil; EU labelling requires its specific plant origin to be named. The powder form is still, by mass, the same oil."
      pl: "Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny. Forma w proszku to nadal, wagowo, ten sam olej."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.refined
    certainty: yes
    kind: estimate
    grade: B
    note:
      en: "Food-grade sunflower oil for a neutral-tasting product is refined, bleached and deodorised."
      pl: "Olej słonecznikowy spożywczy o neutralnym smaku jest rafinowany, odbarwiany i dezodoryzowany."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources: [{ id: reg-2019-649 }]
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "Left out a high-oleic vs standard-linoleic variant: it is a real distinction (affects heat stability), but it carries no allergen/ethics/health implication this taxonomy tracks, and adding a second variant axis would need its own prior budget shared with the powder-form variant, which is not a like-for-like axis."
