provenance: ai-drafted
review_notes:
  - "Left out a high-oleic vs standard-linoleic variant: it is a real distinction (affects heat stability), but it carries no allergen/ethics/health implication this taxonomy tracks, and adding a second variant axis would need its own prior budget shared with the powder-form variant, which is not a like-for-like axis."
