summary:
  en: >-
    Vegetable oil pressed or extracted from sesame seeds (Sesamum indicum). As a product derived from them, it
    falls under EU Annex II item 11 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z nasion sezamu (Sesamum indicum). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 11); olej nie jest z niego wyłączony.
