id: sesame-oil
type: fat
parent: sesame
names:
  en:
    - sesame oil
    - sesame seed oil
    - refined sesame oil
    - toasted sesame oil
    - non-hydrogenated sesame oil
    - unhydrogenated sesame oil
    - non-hydrogenated sesame seed oil
    - unhydrogenated sesame seed oil
  pl:
    - olej sezamowy
    - rafinowany olej sezamowy
    - olej roślinny sezamowy
    - tłuszcz roślinny sezamowy
    - sezamowy olej roślinny
    - oleje roślinne sezamowe
    - tłuszcze roślinne sezamowe
    - olej roślinny z sezamu
    - olej z sezamu
    - olej z nasion sezamu
    - olej sezamowy prażony
  de:
    - Sesamöl
summary:
  en: >-
    Vegetable oil pressed or extracted from sesame seeds (Sesamum indicum). As a product derived from them, it
    falls under EU Annex II item 11 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z nasion sezamu (Sesamum indicum). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 11); olej nie jest z niego wyłączony.
variants:
  - id: hydrogenated
    names:
      en:
        - hydrogenated sesame oil
        - hydrogenated sesame seed oil
      pl:
        - utwardzony olej sezamowy
        - olej sezamowy utwardzony
        - uwodorniony olej sezamowy
        - olej sezamowy uwodorniony
        - utwardzony olej roślinny sezamowy
        - olej roślinny sezamowy utwardzony
        - uwodorniony olej roślinny sezamowy
        - olej roślinny sezamowy uwodorniony
        - utwardzony olej roślinny z sezamu
        - olej roślinny z sezamu utwardzony
        - uwodorniony olej roślinny z sezamu
        - olej roślinny z sezamu uwodorniony
        - utwardzony olej z sezamu
        - olej z sezamu utwardzony
        - uwodorniony olej z sezamu
        - olej z sezamu uwodorniony
    process:
      en: "Sesame oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej sezamowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)'
  - id: partially-hydrogenated
    names:
      en:
        - partially hydrogenated sesame oil
        - partially hydrogenated sesame seed oil
      pl:
        - częściowo utwardzony olej sezamowy
        - olej sezamowy częściowo utwardzony
        - częściowo uwodorniony olej sezamowy
        - olej sezamowy częściowo uwodorniony
        - częściowo utwardzony olej roślinny sezamowy
        - olej roślinny sezamowy częściowo utwardzony
        - częściowo uwodorniony olej roślinny sezamowy
        - olej roślinny sezamowy częściowo uwodorniony
        - częściowo utwardzony olej roślinny z sezamu
        - olej roślinny z sezamu częściowo utwardzony
        - częściowo uwodorniony olej roślinny z sezamu
        - olej roślinny z sezamu częściowo uwodorniony
        - częściowo utwardzony olej z sezamu
        - olej z sezamu częściowo utwardzony
        - częściowo uwodorniony olej z sezamu
        - olej z sezamu częściowo uwodorniony
    process:
      en: "Sesame oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej sezamowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - 'czesciowo (?:utwardzon|uwodorn)'
      - 'partially hydrogenated'
      - 'teilweise gehartet'
  - id: fully-hydrogenated
    names:
      en:
        - fully hydrogenated sesame oil
        - totally hydrogenated sesame oil
        - fully hydrogenated sesame seed oil
        - totally hydrogenated sesame seed oil
      pl:
        - całkowicie utwardzony olej sezamowy
        - olej sezamowy całkowicie utwardzony
        - całkowicie uwodorniony olej sezamowy
        - olej sezamowy całkowicie uwodorniony
        - w pełni utwardzony olej sezamowy
        - olej sezamowy w pełni utwardzony
        - w pełni uwodorniony olej sezamowy
        - olej sezamowy w pełni uwodorniony
        - całkowicie utwardzony olej roślinny sezamowy
        - olej roślinny sezamowy całkowicie utwardzony
        - całkowicie uwodorniony olej roślinny sezamowy
        - olej roślinny sezamowy całkowicie uwodorniony
        - w pełni utwardzony olej roślinny sezamowy
        - olej roślinny sezamowy w pełni utwardzony
        - w pełni uwodorniony olej roślinny sezamowy
        - olej roślinny sezamowy w pełni uwodorniony
        - całkowicie utwardzony olej roślinny z sezamu
        - olej roślinny z sezamu całkowicie utwardzony
        - całkowicie uwodorniony olej roślinny z sezamu
        - olej roślinny z sezamu całkowicie uwodorniony
        - w pełni utwardzony olej roślinny z sezamu
        - olej roślinny z sezamu w pełni utwardzony
        - w pełni uwodorniony olej roślinny z sezamu
        - olej roślinny z sezamu w pełni uwodorniony
        - całkowicie utwardzony olej z sezamu
        - olej z sezamu całkowicie utwardzony
        - całkowicie uwodorniony olej z sezamu
        - olej z sezamu całkowicie uwodorniony
        - w pełni utwardzony olej z sezamu
        - olej z sezamu w pełni utwardzony
        - w pełni uwodorniony olej z sezamu
        - olej z sezamu w pełni uwodorniony
    process:
      en: "Sesame oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej sezamowy ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells:
      - 'calkowicie (?:utwardzon|uwodorn)'
      - 'w pelni (?:utwardzon|uwodorn)'
      - 'fully hydrogenated'
      - 'totally hydrogenated'
      - 'vollstandig gehartet'
assertions:
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: A pressed vegetable oil; EU labelling requires its specific plant origin to be named.
      pl: Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny.
    sources:
      - id: reg-1169-2011
        locator: Annex VII Part A, point 8
  - code: allergen.sesame
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Product derived from sesame seeds; EU Annex II item 11, with no exemption for the oil.
      pl: Produkt z nasion sezamu; Aneks II UE, punkt 11, bez wyłączenia dla oleju.
    sources:
      - id: reg-1169-2011
        locator: Annex II item 11
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources:
      - id: reg-2019-649
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Split from the `sesame` entry in batch b2 (Sol 6.1: an oil is a different food from the whole
    seed or nut). Identity-only beyond origin and the allergen; no assessment opened.
