summary:
  en: >-
    Oil pressed from rapeseed, low in saturated fat and (in the modern "canola"/00 cultivars) low in
    erucic acid. One of the most widely used cooking and food-manufacturing oils in Poland and the wider
    EU. Global rapeseed/canola breeding includes a very high share of GM herbicide-tolerant varieties, but
    the crop actually crushed into EU food-grade oil is overwhelmingly non-GM: the EU does not authorise
    commercial cultivation of GM rapeseed, and the GM Canadian canola that dominates world production is
    mostly channelled to feed and biofuel rather than EU food use.
  pl: >-
    Olej wyciskany z rzepaku, niskotłuszczowy w sensie nasyconych kwasów tłuszczowych i (w nowoczesnych
    odmianach "00"/"canola") niskoerukowy. Jeden z najczęściej używanych olejów kuchennych i przemysłowych
    w Polsce i całej UE. Globalna hodowla rzepaku/canoli obejmuje bardzo wysoki udział odmian GMO
    odpornych na herbicydy, ale surowiec faktycznie tłoczony na olej spożywczy w UE jest w większości
    niemodyfikowany: UE nie zezwala na komercyjną uprawę GMO rzepaku, a kanadyjska canola GMO, dominująca
    w produkcji światowej, trafia głównie na pasze i biopaliwa, a nie do żywności w UE.
