summary:
  en: >-
    Vegetable oil pressed from cashew nuts (Anacardium occidentale). As a product derived from cashews, it
    falls under EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z orzechów nerkowca (Anacardium occidentale). Jako produkt pochodzący z orzechów
    nerkowca podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
