summary:
  en: >-
    Vegetable oil extracted from cotton seeds (Gossypium spp.). Cotton seeds naturally contain gossypol, and
    upland cotton is widely cultivated in genetically engineered varieties.
  pl: >-
    Olej roślinny pozyskiwany z nasion bawełny (Gossypium spp.). Nasiona bawełny zawierają naturalnie
    gossypol, a bawełna jest na świecie powszechnie uprawiana w odmianach modyfikowanych genetycznie.
