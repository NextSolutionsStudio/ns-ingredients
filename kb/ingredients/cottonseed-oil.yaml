id: cottonseed-oil
type: fat
names:
  en:
    - cottonseed oil
    - refined cottonseed oil
  pl:
    - olej bawełniany
    - olej z nasion bawełny
    - olej bawełniany rafinowany
    - olej roślinny bawełniany
    - tłuszcz roślinny bawełniany
    - bawełniany olej roślinny
  de:
    - Baumwollsaatöl
    - Baumwollsamenöl
summary:
  en: >-
    Vegetable oil extracted from cotton seeds (Gossypium spp.). Crude cottonseed oil naturally contains
    gossypol, which is removed during alkali refining to produce edible food-grade refined cottonseed oil.
    Upland cotton is also widely genetically engineered.
  pl: >-
    Olej roślinny pozyskiwany z nasion bawełny (Gossypium spp.). Surowy olej zawiera naturalnie gossypol,
    który usuwa się w trakcie rafinacji alkalicznej, uzyskując jadalny olej spożywczy. Bawełna jest również
    na świecie powszechnie modyfikowana genetycznie.
variants:
  - id: hydrogenated
    names:
      en:
        - hydrogenated cottonseed oil
      pl:
        - utwardzony olej bawełniany
        - olej bawełniany utwardzony
        - uwodorniony olej bawełniany
        - olej bawełniany uwodorniony
      de:
        - gehärtetes Baumwollsaatöl
    process:
      en: "Cottonseed oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej bawełniany utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)'
  - id: partially-hydrogenated
    names:
      en:
        - partially hydrogenated cottonseed oil
      pl:
        - częściowo utwardzony olej bawełniany
        - olej bawełniany częściowo utwardzony
        - częściowo uwodorniony olej bawełniany
        - olej bawełniany częściowo uwodorniony
      de:
        - teilweise gehärtetes Baumwollsaatöl
    process:
      en: "Cottonseed oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej bawełniany, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - 'czesciowo (?:utwardzon|uwodorn)'
      - 'partially hydrogenated'
      - 'teilweise gehartet'
  - id: fully-hydrogenated
    names:
      en:
        - fully hydrogenated cottonseed oil
        - totally hydrogenated cottonseed oil
      pl:
        - całkowicie utwardzony olej bawełniany
        - olej bawełniany całkowicie utwardzony
        - w pełni utwardzony olej bawełniany
        - olej bawełniany w pełni utwardzony
        - całkowicie uwodorniony olej bawełniany
        - olej bawełniany całkowicie uwodorniony
        - w pełni uwodorniony olej bawełniany
        - olej bawełniany w pełni uwodorniony
      de:
        - vollständig gehärtetes Baumwollsaatöl
    process:
      en: "Cottonseed oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej bawełniany ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells:
      - 'calkowicie (?:utwardzon|uwodorn)'
      - 'w pelni (?:utwardzon|uwodorn)'
      - 'fully hydrogenated'
      - 'totally hydrogenated'
      - 'vollstandig gehartet'
assertions:
  - code: origin.plant
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Obtained from cotton seeds (Reg (EU) No 1169/2011 Annex VII Part A point 8; Gadelha et al. 2014)."
      pl: "Pozyskiwany z nasion bawełny (Rozp. (UE) nr 1169/2011 Załącznik VII część A pkt 8; Gadelha i in. 2014)."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, point 8"
      - id: gadelha-2014-gossypol-pmc4033412
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Extracted and alkali-refined vegetable seed oil (to remove gossypol for edible use)."
      pl: "Ekstrahowany i rafinowany alkalicznie olej z nasion roślinnych (w celu usunięcia gossypolu)."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, point 8"
      - id: gadelha-2014-gossypol-pmc4033412
  - code: origin.gmo_derived
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: "USDA ERS reports 93% herbicide-tolerant GE adoption on US upland cotton acreage; EU GM labelling applies where applicable."
      pl: "USDA ERS podaje 93% udziału odmian HT w uprawach bawełny w USA; w UE obowiązują przepisy dotyczące znakowania GM."
    sources:
      - id: usda-ers-ge-2025
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources:
      - id: reg-2019-649
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
review_status: draft
provenance: ai-drafted
