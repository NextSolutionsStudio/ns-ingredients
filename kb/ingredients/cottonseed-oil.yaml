assertions:
  - code: origin.plant
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Obtained from cotton seeds (Reg (EU) No 1169/2011 Annex VII Part A point 8; Gadelha et al. 2014)."
      pl: "Pozyskiwany z nasion bawełny (Rozp. (UE) nr 1169/2011 Załącznik VII część A pkt 8; Gadelha i in. 2014)."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, point 8"
      - id: gadelha-2014-gossypol-pmc4033412
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Vegetable oil extracted from cotton seeds (Reg (EU) No 1169/2011 Annex VII Part A point 8)."
      pl: "Olej roślinny pozyskiwany z nasion bawełny (Rozp. (UE) nr 1169/2011 Załącznik VII część A pkt 8)."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, point 8"
  - code: origin.gmo_derived
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Upland cotton is tracked in the USDA ERS series 'Adoption of Genetically Engineered Crops in the United
        States' (herbicide-tolerant and insect-resistant varieties); non-GM supplies also exist and an
        ingredient list does not show origin.
      pl: >-
        Bawełna jest ujęta w serii USDA ERS „Adoption of Genetically Engineered Crops in the United States”
        (odmiany odporne na herbicydy i owady); istnieją też surowce non-GM, a wykaz składników nie wskazuje
        pochodzenia.
    sources:
      - id: usda-ers-ge-2025
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources:
      - id: reg-2019-649
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
