        - olej roślinny arachidowy w pełni utwardzony
        - w pełni uwodorniony olej roślinny arachidowy
        - olej roślinny arachidowy w pełni uwodorniony
        - całkowicie utwardzony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych całkowicie utwardzony
        - całkowicie uwodorniony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych całkowicie uwodorniony
        - w pełni utwardzony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych w pełni utwardzony
