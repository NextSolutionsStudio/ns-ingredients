        - olej roślinny z orzeszków ziemnych w pełni uwodorniony
    process:
      en: "Peanut oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej arachidowy ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells:
