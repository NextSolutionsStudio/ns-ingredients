id: peanut-oil
type: fat
parent: peanuts
names:
  en:
    - peanut oil
    - groundnut oil
    - arachis oil
    - peanuts oil
    - non-hydrogenated peanut oil
    - unhydrogenated peanut oil
    - non-hydrogenated groundnut oil
    - unhydrogenated groundnut oil
  pl:
    - olej arachidowy
    - olej z orzeszków ziemnych
    - olej roślinny arachidowy
    - tłuszcz roślinny arachidowy
    - arachidowy olej roślinny
    - oleje roślinne arachidowe
    - tłuszcze roślinne arachidowe
    - olej roślinny z orzeszków ziemnych
  de:
    - Erdnussöl
summary:
  en: >-
    Vegetable oil pressed or extracted from peanuts (Arachis hypogaea). As a product derived from them, it
    falls under EU Annex II item 5 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z orzeszków ziemnych (Arachis hypogaea). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 5); olej nie jest z niego wyłączony.
variants:
  - id: hydrogenated
    names:
      en:
        - hydrogenated peanut oil
        - hydrogenated groundnut oil
      pl:
        - utwardzony olej arachidowy
        - olej arachidowy utwardzony
        - uwodorniony olej arachidowy
        - olej arachidowy uwodorniony
        - utwardzony olej z orzeszków ziemnych
        - olej z orzeszków ziemnych utwardzony
        - uwodorniony olej z orzeszków ziemnych
        - olej z orzeszków ziemnych uwodorniony
        - utwardzony olej roślinny arachidowy
        - olej roślinny arachidowy utwardzony
        - uwodorniony olej roślinny arachidowy
        - olej roślinny arachidowy uwodorniony
        - utwardzony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych utwardzony
        - uwodorniony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych uwodorniony
    process:
      en: "Peanut oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej arachidowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)'
  - id: partially-hydrogenated
    names:
      en:
        - partially hydrogenated peanut oil
        - partially hydrogenated groundnut oil
      pl:
        - częściowo utwardzony olej arachidowy
        - olej arachidowy częściowo utwardzony
        - częściowo uwodorniony olej arachidowy
        - olej arachidowy częściowo uwodorniony
        - częściowo utwardzony olej z orzeszków ziemnych
        - olej z orzeszków ziemnych częściowo utwardzony
        - częściowo uwodorniony olej z orzeszków ziemnych
        - olej z orzeszków ziemnych częściowo uwodorniony
        - częściowo utwardzony olej roślinny arachidowy
        - olej roślinny arachidowy częściowo utwardzony
        - częściowo uwodorniony olej roślinny arachidowy
        - olej roślinny arachidowy częściowo uwodorniony
        - częściowo utwardzony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych częściowo utwardzony
        - częściowo uwodorniony olej roślinny z orzeszków ziemnych
        - olej roślinny z orzeszków ziemnych częściowo uwodorniony
    process:
      en: "Peanut oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej arachidowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - 'czesciowo (?:utwardzon|uwodorn)'
      - 'partially hydrogenated'
      - 'teilweise gehartet'
