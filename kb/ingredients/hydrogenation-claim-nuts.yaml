summary:
  en: >-
    A label claim that excludes hydrogenation on a fat or oil from nuts ("without hydrogenated
    soybean oil", "free from fully hydrogenated almond oil"). It excludes a process, not the food: a label
    that names the oil this way often contains the plain oil, so the allergen stays possible. The claim
    asserts nothing else: no hydrogenation, no origin, no diet.
  pl: >-
    Deklaracja na etykiecie, która wyklucza utwardzenie tłuszczu lub oleju z: orzechy ("bez utwardzonego
    oleju sojowego"). Wyklucza proces, nie składnik: etykieta, która tak wymienia olej, często zawiera
    zwykły olej, więc alergen pozostaje możliwy. Deklaracja nie stwierdza nic więcej: ani utwardzenia,
    ani pochodzenia, ani wpływu na dietę.
assertions:
  - code: allergen.nuts
    certainty: maybe
    kind: estimate
    grade: C
    note:
      en: The claim names a nuts oil or fat; the plain one is often present. EU Annex II item 8.
      pl: Deklaracja wymienia olej lub tłuszcz (orzechy); zwykły często jest obecny. Aneks II UE, punkt 8.
    sources:
      - id: reg-1169-2011
        locator: Annex II item 8
review_status: draft
provenance: ai-drafted
review_notes:
  - "b2 round 29z: the presence claims of almond-oil, brazil-nut-oil, cashew-oil, hazelnut-oil, macadamia-oil, pecan-oil, pistachio-oil, walnut-oil. Policy B (pc-opus): an exclusion of a process on an allergen food keeps the allergen at maybe and asserts nothing else."
