id: hydrogenation-claim-gluten
type: fat
names:
  en: [hydrogenation claim naming cereals containing gluten]
  pl: [deklaracja o utwardzeniu z nazwą zboża zawierające gluten]
exact_names:
  en: [no hydrogenated wheat germ oil, no partially hydrogenated wheat germ oil, no fully hydrogenated wheat germ oil, no totally hydrogenated wheat germ oil, without hydrogenated wheat germ oil, without partially hydrogenated wheat germ oil, without fully hydrogenated wheat germ oil, without totally hydrogenated wheat germ oil, free from hydrogenated wheat germ oil, free from partially hydrogenated wheat germ oil, free from fully hydrogenated wheat germ oil, free from totally hydrogenated wheat germ oil, free of hydrogenated wheat germ oil, free of partially hydrogenated wheat germ oil, free of fully hydrogenated wheat germ oil, free of totally hydrogenated wheat germ oil, no hydrogenated wheatgerm oil, no partially hydrogenated wheatgerm oil, no fully hydrogenated wheatgerm oil, no totally hydrogenated wheatgerm oil, without hydrogenated wheatgerm oil, without partially hydrogenated wheatgerm oil, without fully hydrogenated wheatgerm oil, without totally hydrogenated wheatgerm oil, free from hydrogenated wheatgerm oil, free from partially hydrogenated wheatgerm oil, free from fully hydrogenated wheatgerm oil, free from totally hydrogenated wheatgerm oil, free of hydrogenated wheatgerm oil, free of partially hydrogenated wheatgerm oil, free of fully hydrogenated wheatgerm oil, free of totally hydrogenated wheatgerm oil]
summary:
  en: >-
    A label claim that excludes hydrogenation on a fat or oil from cereals containing gluten ("without
    hydrogenated wheat germ oil"). It excludes a process, not the food: a label that names the oil this way
    often contains the plain oil, so the allergen stays possible. The claim asserts nothing else: no
    hydrogenation, no origin, no diet.
  pl: >-
    Deklaracja na etykiecie, która wyklucza utwardzenie tłuszczu lub oleju ze zbóż zawierających gluten.
    Wyklucza proces, nie składnik: etykieta, która tak wymienia olej, często zawiera zwykły olej, więc alergen
    pozostaje możliwy. Deklaracja nie stwierdza nic więcej: ani utwardzenia, ani pochodzenia, ani wpływu na
    dietę.
assertions:
  - code: allergen.gluten
    certainty: maybe
    kind: estimate
    grade: C
    note:
      en: The claim names a cereals containing gluten oil or fat; the plain one is often present. EU Annex II item 1.
      pl: Deklaracja wymienia olej lub tłuszcz (zboża zawierające gluten); zwykły często jest obecny. Aneks II UE, punkt 1.
    sources:
      - id: reg-1169-2011
        locator: Annex II item 1
review_status: draft
provenance: ai-drafted
review_notes:
  - "b2 round 29z: the presence claims of wheat-germ-oil. Policy B (pc-opus): an exclusion of a process on an allergen food keeps the allergen at maybe and asserts nothing else."
