id: sodium-ascorbate
type: additive
e_number: E301
names:
  en:
    - sodium ascorbate
    - sodium L-ascorbate
  pl:
    - askorbinian sodu
    - L-askorbinian sodu
  de:
    - Natriumascorbat
functions:
  - antioxidant
summary:
  en: 'The sodium salt of ascorbic acid (vitamin C), used as an antioxidant, for example in cured meats.'
  pl: 'Sól sodowa kwasu askorbinowego (witaminy C), stosowana jako przeciwutleniacz, np. w peklowanych wędlinach.'
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group I additive (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis in most food
        categories.
      pl: >-
        Dodatek grupy I (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis w większości kategorii żywności.
    source: swm-reg-1129-2011
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Identity-only: EFSA's 2015 re-evaluation of E 300–302 was not opened this session (Wiley 403, not in
    Europe PMC). See kb/ingredients/ascorbic-acid.yaml for the parent acid's production-route claims, which
    were not copied here without a source that covers the salt.
