id: sodium-ascorbate
type: additive
e_number: E301
names:
  en:
    - sodium ascorbate
    - sodium L-ascorbate
  pl:
    - askorbinian sodu
    - L-askorbinian sodu
  de:
    - Natriumascorbat
functions:
  - antioxidant
summary:
  en: 'The sodium salt of ascorbic acid (vitamin C), used as an antioxidant, for example in cured meats.'
  pl: 'Sól sodowa kwasu askorbinowego (witaminy C), stosowana jako przeciwutleniacz, np. w peklowanych wędlinach.'
assertions:
  - code: origin.microbial_fermentation
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        E 301 is the monosodium salt of L-ascorbic acid (Reg (EU) No 231/2012 E 301). Parent L-ascorbic acid
        is manufactured industrially via the Reichstein process (six chemical steps and one microbial
        fermentation step from D-glucose/sorbitol) or via two-step bacterial fermentation routes (Wang et al.
        2021), so a label cannot show which route or degree of fermentation was used.
      pl: >-
        E 301 to sól monosodowa kwasu L-askorbinowego (Rozp. (UE) nr 231/2012 E 301). Wyjściowy kwas
        L-askorbinowy wytwarza się przemysłowo metodą Reichsteina (sześć etapów chemicznych i jeden etap
        fermentacji mikrobiologicznej z D-glukozy/sorbitolu) lub w dwuetapowych procesach fermentacji
        bakteryjnej (Wang i in. 2021), więc etykieta nie wskazuje użytej metody ani udziału fermentacji.
    sources:
      - id: reg-231-2012
        locator: "E 301"
      - id: wang-2021-vitamins-pmc8247775
        locator: "Water-Soluble Vitamins - Vitamin C & Figure 2"
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group I additive (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis in most food
        categories.
      pl: >-
        Dodatek grupy I (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis w większości kategorii żywności.
    source: swm-reg-1129-2011
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    EFSA 2015 opinion (doi:10.2903/j.efsa.2015.4087) returned a Wiley cookie wall and could not be opened;
    left out origin.chemical_synthesis and kept origin.microbial_fermentation: maybe aligned with parent
    ascorbic-acid.
