id: citric-acid
type: additive
e_number: E330
ids: { cas: "77-92-9", wikidata: Q159683, chebi: "CHEBI:30769", pubchem: 311 }
names:
  en: [citric acid, anhydrous citric acid]
  pl: [kwas cytrynowy, kwasek cytrynowy]
  de: [Citronensäure, Zitronensäure]
functions: [acid, acidity-regulator]
summary:
  en: >-
    A fruit acid (the sour taste of citrus) used across drinks, sweets, jams, dairy and as a general
    acidity regulator and chelating agent. Despite the name, almost none of the citric acid sold today is
    squeezed from lemons: since around 1919, essentially the whole world supply has been made by fermenting
    a sugar feedstock (molasses, glucose syrup or sucrose) with the mould Aspergillus niger, which is
    cheaper and more consistent than fruit extraction. A small, uncontrolled case series has speculated
    that residual mould antigens in this fermentation-derived citric acid could provoke inflammatory
    symptoms in sensitised people; this is a hypothesis, not a regulatory finding, and is not the same as
    an EU-declared allergen.
  pl: >-
    Kwas owocowy (kwaśny smak owoców cytrusowych) stosowany w napojach, słodyczach, dżemach, produktach
    mlecznych oraz jako ogólny regulator kwasowości i czynnik chelatujący. Wbrew nazwie, praktycznie żaden
    kwas cytrynowy sprzedawany obecnie nie jest wyciskany z cytryn: od około 1919 r. praktycznie cała
    światowa produkcja powstaje przez fermentację surowca cukrowego (melasy, syropu glukozowego lub
    sacharozy) z udziałem pleśni Aspergillus niger, co jest tańsze i bardziej powtarzalne niż ekstrakcja z
    owoców. Niewielka, niekontrolowana seria przypadków wysunęła hipotezę, że resztkowe antygeny pleśni w
    tak wytwarzanym kwasie cytrynowym mogą wywoływać objawy zapalne u osób uczulonych; to hipoteza, a nie
    ustalenie regulatorowe, i nie jest to samo co zadeklarowany w UE alergen.
assertions:
  - code: origin.microbial_fermentation
    certainty: yes
    kind: estimate
    grade: B
    note:
      en: "Reg (EU) No 231/2012 defines E 330 as produced from lemon or pineapple juice or by fermentation of carbohydrate solutions using Candida spp. or non-toxicogenic Aspergillus niger; the 2025 peer-reviewed review reports that commercial supply has long come almost entirely from Aspergillus niger fermentation rather than fruit extraction."
      pl: "Rozporządzenie (UE) nr 231/2012 definiuje E 330 jako wytwarzany z soku z cytryny lub ananasa albo przez fermentację roztworów węglowodanów przy użyciu Candida spp. lub nietoksykogennych szczepów Aspergillus niger; przegląd z 2025 r. wskazuje, że podaż handlowa od dawna pochodzi niemal wyłącznie z fermentacji Aspergillus niger, a nie z ekstrakcji z owoców."
    sources:
      - { id: reg-231-2012, locator: "E 330 (Definition)" }
      - { id: col-latif-2025-citric-acid }
  - code: origin.plant
    certainty: maybe
    kind: fact
    grade: A
    note:
      en: "Reg (EU) No 231/2012 permits production from lemon or pineapple juice, although fruit extraction represents a negligible share of commercial supply compared with microbial fermentation."
      pl: "Rozporządzenie (UE) nr 231/2012 dopuszcza wytwarzanie z soku z cytryny lub ananasa, choć ekstrakcja z owoców stanowi znikomy ułamek podaży handlowej względem fermentacji mikrobiologicznej."
    sources: [{ id: reg-231-2012, locator: "E 330 (Definition)" }]
  - code: health.sensitivity_reported
    certainty: maybe
    kind: opinion
    grade: D
    population: [general]
    note:
      en: "A series of four uncontrolled case reports hypothesised that residual Aspergillus niger antigens in manufactured (fermentation-derived) citric acid could trigger inflammatory symptoms (respiratory, joint, gut) in sensitised individuals. Mechanism not established or endorsed by any regulator; weakest evidence tier."
      pl: "Seria czterech niekontrolowanych opisów przypadków wysunęła hipotezę, że resztkowe antygeny Aspergillus niger w wytwarzanym fermentacyjnie kwasie cytrynowym mogą wywoływać objawy zapalne (oddechowe, stawowe, jelitowe) u osób uczulonych. Mechanizm nieustalony i niepotwierdzony przez żadnego regulatora; najsłabszy poziom dowodów."
    sources: [{ id: col-sweis-2018-citric-acid }]
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions: { en: "Group I additive: quantum satis in most food categories.", pl: "Dodatek grupy I: quantum satis w większości kategorii żywności." }
    source: reg-1333-2008
review_status: draft
provenance: ai-drafted
review_notes:
  - "Reg (EU) No 231/2012 E 330 Definition opened in sources-pack/reg-231-2012-specs.txt; microbial fermentation kept as estimate (grade B) because Reg 231/2012 also lists lemon/pineapple juice."
