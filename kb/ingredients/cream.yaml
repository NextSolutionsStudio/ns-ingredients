  pl: [śmietanka, śmietana, śmietanka pasteryzowana, śmietana pasteryzowana, śmietanka w proszku, śmietana w proszku, śmietanka z mleka]
  de: [Sahne, Rahm]
summary:
  en: "The higher-fat layer separated from milk; one of the EU's fourteen regulated allergens (milk), used in dairy desserts, sauces and coffee products."
  pl: "Tłustsza warstwa oddzielana z mleka; jeden z czternastu regulowanych alergenów UE (mleko), stosowana w deserach mlecznych, sosach i produktach do kawy."
  de: "Die fettreichere, von der Milch abgetrennte Schicht; eines der vierzehn geregelten EU-Allergene (Milch)."
assertions:
  - code: allergen.milk
    certainty: yes
    kind: fact
    grade: A
    note: { en: "A milk product; EU Annex II item 7.", pl: "Produkt mleczny; Aneks II UE, punkt 7." }
    sources: [{ id: reg-1169-2011, locator: "Annex II item 7" }]
  - code: origin.dairy
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Separated from milk.", pl: "Oddzielana z mleka." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.vegan
    certainty: "no"
    kind: fact
    grade: A
    note: { en: "An animal (dairy) product.", pl: "Produkt zwierzęcy (mleczny)." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.vegetarian
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Compatible with a lacto-ovo-vegetarian diet.", pl: "Zgodne z dietą laktoowowegetariańską." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.lactose_free
    certainty: "no"
    kind: fact
    grade: A
    note: { en: "Contains lactose by definition, unless separately labelled lactose-free.", pl: "Z definicji zawiera laktozę, o ile nie oznaczono odrębnie jako bez laktozy." }
    sources: [{ id: reg-1169-2011 }]
