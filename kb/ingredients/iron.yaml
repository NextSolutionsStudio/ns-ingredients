id: iron
type: nutrient
names:
  en:
    - iron
    - ferrous sulfate
    - ferrous sulphate
    - ferrous fumarate
    - ferrous bisglycinate
    - ferric pyrophosphate
    - ferric diphosphate
  pl:
    - żelazo
    - siarczan żelaza
    - siarczan żelaza(II)
    - fumaran żelaza
    - fumaran żelaza(II)
    - diglicynian żelaza
    - pirofosforan żelaza
    - pirofosforan żelaza(III)
  de:
    - Eisen
    - Eisensulfat
    - Eisenfumarat
summary:
  en: >-
    Essential mineral added to fortified foods (such as breakfast cereals) and supplements using EU-permitted
    iron compounds including ferrous sulfate, ferrous fumarate, ferric pyrophosphate and elemental iron. In
    2024 EFSA concluded no tolerable upper intake level could be established, and set a conservative safe level
    of intake of 40 mg/day for adults (10-35 mg/day for children and adolescents) based on avoiding black
    stools from unabsorbed iron.
  pl: >-
    Niezbędny składnik mineralny dodawany do żywności wzbogacanej (np. płatków śniadaniowych) oraz suplementów
    diety w postaci dopuszczonych w UE związków żelaza, takich jak siarczan żelaza(II), fumaran żelaza(II),
    pirofosforan żelaza(III) czy żelazo elementarne. W 2024 r. EFSA uznała, że nie można ustalić górnego
    tolerowanego poziomu spożycia (UL), i wyznaczyła zachowawczy bezpieczny poziom spożycia 40 mg/dobę dla
    dorosłych (10-35 mg/dobę dla dzieci i młodzieży) w oparciu o brak czarnych stolców z niewchłoniętego
    żelaza.
assertions:
  - code: origin.mineral
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Mineral nutrient added as EU-permitted inorganic or organic iron salts or elemental iron.
      pl: Składnik mineralny dodawany jako dopuszczone w UE nieorganiczne lub organiczne sole żelaza albo żelazo elementarne.
    sources:
      - id: reg-1925-2006
        locator: Annex I & Annex II
  - code: diet.vegan
    certainty: 'yes'
    kind: estimate
    grade: C
    note:
      en: >-
        Permitted iron fortification compounds under Reg 1925/2006 (sulfate, fumarate, pyrophosphate, elemental
        iron, bisglycinate, etc.) are mineral/synthetic salts, not animal-derived (specialist heme-iron
        supplements would be animal-derived if declared as such).
      pl: >-
        Dopuszczone związki żelaza w Rozp. 1925/2006 (siarczan, fumaran, pirofosforan, żelazo elementarne,
        diglicynian itd.) to sole mineralne/syntetyczne, niepochodzące od zwierząt (ewentualne specjalistyczne
        suplementy żelaza hemowego byłyby pochodzenia zwierzęcego, jeśli tak zadeklarowane).
    sources:
      - id: reg-1925-2006
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Permitted mineral in fortified foods (Reg 1925/2006 Annex I & II) and food supplements (Dir 2002/46/EC
        Annex II) via listed iron salts and elemental iron.
      pl: >-
        Składnik mineralny dopuszczony do wzbogacania żywności (Rozp. 1925/2006 Załącznik I i II) oraz
        suplementów diety (Dyr. 2002/46/WE Załącznik II) w postaci wymienionych soli żelaza i żelaza
        elementarnego.
    source: reg-1925-2006
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    No health.high_dose_supplement_nutrient assertion or UL reference_values entry: EFSA (2024,
    10.2903/j.efsa.2024.8819) explicitly concluded no UL could be set because the threshold where systemic
    iron-overload risk begins is undefined; instead it set a safe level of intake of 40 mg/day for adults
    (10-35 mg/day for children/adolescents, 5 mg/day supplemental for infants 4-11 months).
  - >-
    Ferrous gluconate (E579) and ferrous lactate (E585) remain under their generated additive entries to avoid
    name collisions.
