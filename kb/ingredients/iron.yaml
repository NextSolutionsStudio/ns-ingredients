assertions:
  - code: origin.mineral
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Mineral nutrient added as EU-permitted inorganic or organic iron salts or elemental iron.
      pl: Składnik mineralny dodawany jako dopuszczone w UE nieorganiczne lub organiczne sole żelaza albo żelazo elementarne.
    sources:
      - id: reg-1925-2006
        locator: Annex I & Annex II
  - code: diet.vegan
    certainty: maybe
    kind: estimate
    grade: C
    note:
      en: >-
        Most permitted iron fortification compounds under Reg (EC) No 1925/2006 Annex II (sulfate, fumarate,
        pyrophosphate, elemental iron, bisglycinate, etc.) are mineral/synthetic forms without animal
        material, but consolidated Annex II also permits iron milk caseinate (dairy-derived), so a bare "iron"
        declaration on a label cannot rule out an animal-derived form.
      pl: >-
        Większość dopuszczonych związków żelaza w załączniku II do Rozp. (WE) nr 1925/2006 (siarczan, fumaran,
        pirofosforan, żelazo elementarne, diglicynian itd.) to formy mineralne/syntetyczne bez surowców
        zwierzęcych, ale tekst skonsolidowany dopuszcza także kazeinian żelaza z mleka (pochodzenia
        mlecznego), więc sama deklaracja „żelazo” na etykiecie nie wyklucza formy odzwierzęcej.
    sources:
      - id: reg-1925-2006
        locator: Annex I & Annex II
  - code: diet.vegan
    variant: mineral-form
    certainty: 'yes'
    kind: estimate
    grade: C
    note:
      en: >-
        Declared as a non-dairy mineral/synthetic iron salt (sulfate, fumarate, pyrophosphate, bisglycinate)
        or elemental iron permitted under Reg (EC) No 1925/2006 Annex II.
      pl: >-
        Zadeklarowana niemleczna, mineralna lub syntetyczna sól żelaza (siarczan, fumaran, pirofosforan,
        diglicynian) albo żelazo elementarne dopuszczone w załączniku II do Rozp. (WE) nr 1925/2006.
    sources:
      - id: reg-1925-2006
        locator: Annex I & Annex II
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Permitted mineral in fortified foods (Reg (EC) No 1925/2006 Annex I & II) via listed iron salts
        (including ferrous bisglycinate, ferrous fumarate, ferrous sulphate, ferric diphosphate) and elemental
        iron.
      pl: >-
        Składnik mineralny dopuszczony do wzbogacania żywności (Rozp. (WE) nr 1925/2006 Załącznik I i II) w
        postaci wymienionych soli żelaza (w tym diglicynianu żelaza, fumaranu żelaza, siarczanu żelaza,
        difosforanu żelaza) i żelaza elementarnego.
    source: reg-1925-2006
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    No health.high_dose_supplement_nutrient assertion or UL reference_values entry: EFSA (2024,
    10.2903/j.efsa.2024.8819) explicitly concluded no UL could be set because the threshold where systemic
    iron-overload risk begins is undefined; instead it set a safe level of intake of 40 mg/day for adults
    (10-35 mg/day for children/adolescents, and 5 mg/day supplemental iron from fortified foods and food
    supplements, excluding infant and follow-on formulae, for infants 4-11 months).
  - >-
    Ferrous gluconate (E579) and ferrous lactate (E585) remain under their generated additive entries to avoid
    name collisions.
