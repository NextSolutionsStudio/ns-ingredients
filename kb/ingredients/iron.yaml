        - Eisensulfat
        - Eisenfumarat
    process:
      en: >-
        Inorganic or organic mineral iron salts (such as ferrous sulfate, ferrous fumarate, ferrous
        bisglycinate, ferric pyrophosphate) or elemental iron, without dairy carriers.
      pl: >-
        Nieorganiczne lub organiczne mineralne sole żelaza (takie jak siarczan żelaza(II), fumaran żelaza(II),
        diglicynian żelaza, pirofosforan żelaza(III)) lub żelazo elementarne, bez nośników mlecznych.
