id: iron
type: nutrient
names:
  en:
    - iron
  pl:
    - żelazo
  de:
    - Eisen
summary:
  en: >-
    Essential mineral added to fortified foods (such as breakfast cereals) and supplements using EU-permitted
    iron compounds including mineral/organic salts (ferrous sulfate, ferrous fumarate, ferric pyrophosphate,
    ferrous bisglycinate), elemental iron and—in consolidated Annex II—iron milk caseinate (covered under its
    own dairy-allergen entry). In 2024 EFSA concluded no tolerable upper intake level could be established
    because the threshold for systemic iron-overload risk is undefined, and set a conservative safe level of
    intake of 40 mg/day for adults (10-35 mg/day for children and adolescents, and 5 mg/day supplemental iron
    from fortified foods and food supplements, excluding infant and follow-on formulae, for infants 4-11
    months).
  pl: >-
    Niezbędny składnik mineralny dodawany do żywności wzbogacanej (np. płatków śniadaniowych) oraz suplementów
    diety w postaci dopuszczonych w UE związków żelaza, takich jak sole mineralne lub organiczne (siarczan
    żelaza(II), fumaran żelaza(II), pirofosforan żelaza(III), diglicynian żelaza), żelazo elementarne oraz — w
    tekście skonsolidowanym załącznika II — kazeinian żelaza z mleka (ujęty w osobnym wpisie z alergenem
    mlecznym). W 2024 r. EFSA uznała, że nie można ustalić górnego tolerowanego poziomu spożycia (UL), ponieważ
    próg ryzyka ogólnoustrojowego przeciążenia żelazem nie został określony, i wyznaczyła zachowawczy
    bezpieczny poziom spożycia wynoszący 40 mg/dobę dla dorosłych (10-35 mg/dobę dla dzieci i młodzieży oraz 5
    mg/dobę dodatkowego żelaza z żywności wzbogacanej i suplementów diety, z wyłączeniem preparatów do
    początkowego i dalszego żywienia niemowląt, dla niemowląt w wieku 4-11 miesięcy).
variants:
