      pl: "Domyślny wybór po 2021 r. dla masowego 'w pełni utwardzonego' tłuszczu, zwykle mieszanego lub estryfikowanego z olejem ciekłym w celu uzyskania odpowiedniej konsystencji."
assertions:
  - code: origin.plant
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Derived from refined oils and fats of vegetable origin (Reg (EU) No 1169/2011 Annex VII Part A points 8-9)."
      pl: "Pochodzi z rafinowanych olejów i tłuszczów pochodzenia roślinnego (rozporządzenie (UE) nr 1169/2011, załącznik VII część A pkt 8-9)."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8-9" }]
  - code: origin.vegetable_oil_derived
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Manufactured by catalytic hydrogenation of refined vegetable oils or fats."
      pl: "Wytwarzany przez katalityczne uwodornienie rafinowanych olejów lub tłuszczów roślinnych."
    sources:
      - { id: reg-1169-2011, locator: "Annex VII Part A, points 8-9" }
      - { id: reg-2019-649 }
  - code: processing.hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Hydrogenated by definition, whether partial or full."
      pl: "Z definicji utwardzony, częściowo lub całkowicie."
    sources: [{ id: reg-2019-649 }]
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources: [{ id: reg-2019-649 }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "No source-oil variant (palm/rapeseed/soy) was added on top of the hydrogenation-degree axis, to keep the single prior budget on the axis that carries the health-relevant distinction; named single-oil hydrogenated forms (e.g. 'utwardzony olej rzepakowy') are handled on their respective oil entries."
