utwardzone, w pełni utwardzone tłuszcze, oleje w pełni uwodornione, w pełni uwodornione oleje, tłuszcze w pełni uwodornione, w pełni uwodornione tłuszcze, olej całkowicie utwardzone, tłuszcz całkowicie utwardzone, olej całkowicie uwodornione, tłuszcz całkowicie uwodornione, olej w pełni utwardzone, tłuszcz w pełni utwardzone, olej w pełni uwodornione, tłuszcz w pełni uwodornione]
      de: [vollständig gehärtetes Pflanzenöl, vollständig gehärtetes Pflanzenfett]
    process:
      en: "All double bonds are hydrogenated; the fat is fully saturated, very hard, and contains essentially no trans fat."
      pl: "Wszystkie wiązania podwójne są utwardzone; tłuszcz jest w pełni nasycony, bardzo twardy i praktycznie nie zawiera tłuszczów trans."
    tells: ['calkowicie (?:utwardzon|uwodorn)', '(?<!not )(?<!non )fully hydrogenated', '(?<!not )(?<!non )totally hydrogenated', 'w pelni (?:utwardzon|uwodorn)', 'vollstandig gehartet']
