id: calcium
type: nutrient
names:
  en:
    - calcium
  pl:
    - wapń
  de:
    - Calcium
summary:
  en: >-
    Essential mineral added to fortified foods (such as plant-based drinks and breakfast cereals) and
    supplements using EU-permitted calcium salts including calcium carbonate, calcium citrates, calcium
    phosphates and calcium lactate. EFSA (2012) confirmed an adult tolerable upper intake level of 2,500
    mg/day from diet and supplements combined.
  pl: >-
    Niezbędny składnik mineralny dodawany do żywności wzbogacanej (np. napojów roślinnych i płatków
    śniadaniowych) oraz suplementów diety w postaci dopuszczonych w UE soli wapnia, takich jak węglan
    wapnia, cytryniany wapnia, fosforany wapnia czy mleczan wapnia. EFSA (2012) potwierdziła górny
    tolerowany poziom spożycia (UL) dla dorosłych wynoszący 2500 mg/dobę łącznie z diety i suplementów.
assertions:
  - code: origin.mineral
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Mineral nutrient added as EU-permitted inorganic or organic calcium salts.
      pl: Składnik mineralny dodawany w postaci dopuszczonych w UE nieorganicznych lub organicznych soli wapnia.
    sources:
      - id: reg-1925-2006
        locator: Annex I & Annex II
  - code: diet.vegan
    certainty: maybe
    kind: estimate
    grade: C
    note:
      en: >-
        Permitted calcium fortification salts (carbonate, citrate, phosphate, lactate, etc.) are typically of
        mineral or microbial-fermentation origin; a label declaring only "calcium" does not exclude biogenic
        sources such as coral or shell calcium in specialist supplements, though ordinary EU fortified foods
        use mineral salts.
      pl: >-
        Dopuszczone sole wapnia (węglan, cytrynian, fosforan, mleczan itd.) mają zwykle pochodzenie
        mineralne lub fermentacyjne; sama deklaracja „wapń” nie wyklucza w specjalistycznych suplementach
        źródeł pochodzenia zwierzęcego (np. muszle, koral), choć zwykła żywność wzbogacana w UE stosuje sole
        mineralne.
    sources:
      - id: reg-1925-2006
  - code: health.high_dose_supplement_nutrient
    certainty: 'yes'
    kind: fact
    grade: A
    population: [general, pregnancy]
    note:
      en: >-
        EFSA (2012) confirmed a tolerable upper intake level of 2,500 mg/day for adults (including pregnant and
        lactating women) from diet and supplements combined; available data did not allow setting a numeric UL
        for children or adolescents.
      pl: >-
        EFSA (2012) potwierdziła górny tolerowany poziom spożycia 2500 mg/dobę dla dorosłych (w tym kobiet w
        ciąży i karmiących) łącznie z diety i suplementów; dostępne dane nie pozwoliły ustalić liczbowego UL
        dla dzieci i młodzieży.
    sources:
      - id: efsa-calcium-ul-2012
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Permitted mineral in fortified foods (Reg (EC) No 1925/2006 Annex I & II) via listed calcium salts.
      pl: >-
        Składnik mineralny dopuszczony do wzbogacania żywności (Rozp. (WE) nr 1925/2006 Załącznik I i II) w
        postaci wymienionych soli wapnia.
    source: reg-1925-2006
reference_values:
  - type: UL
    value: 2500
    unit: mg/day
    body: EFSA
    year: 2012
    source: efsa-calcium-ul-2012
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Specific calcium salts that also have food-additive E-numbers (e.g. calcium carbonate E170, calcium
    lactate E327, calcium citrates E333, calcium phosphates E341) remain under their additive entries to avoid
    name collisions.
