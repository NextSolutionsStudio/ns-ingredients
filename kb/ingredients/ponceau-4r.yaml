id: ponceau-4r
type: additive
e_number: E124
ids: { cas: "2611-82-7", wikidata: Q384709, pubchem: 17466 }
names:
  en: [ponceau 4R, cochineal red A, new coccine]
  pl: [czerwień koszenilowa A, ponceau 4R]
  de: [Ponceau 4R, Cochenillerot A]
functions: [colour]
summary:
  en: >-
    A synthetic strawberry-red azo dye used in sweets, desserts, sausages and drinks. Despite the name
    "cochineal red A" it has nothing to do with cochineal insects (that is carmine, E120). It is one of the
    "Southampton six" colours that must carry the EU label warning about activity and attention in
    children, and in 2009 EFSA lowered its acceptable daily intake, which led the EU to cut its permitted
    use levels. It is not approved for food in the US.
  pl: >-
    Syntetyczny truskawkowoczerwony barwnik azowy stosowany w słodyczach, deserach, kiełbasach i napojach.
    Mimo nazwy „czerwień koszenilowa A” nie ma nic wspólnego z owadami koszenili (to karmin, E120). Należy do
    „sześciu z Southampton” barwników, które w UE muszą nosić na etykiecie ostrzeżenie o wpływie na
    aktywność i uwagę dzieci; w 2009 r. EFSA obniżyła jego dopuszczalne dzienne spożycie, co skłoniło UE do
    zmniejszenia dozwolonych poziomów stosowania. W USA nie jest dopuszczony do żywności.
assertions:
  - code: health.southampton_colour
    certainty: yes
    kind: fact
    grade: A
    population: [children]
    note:
      en: "One of six colours (with E102, E104, E110, E122, E129) that trigger the mandatory EU label statement, following the 2007 McCann RCT that found a mixture of these colours (plus sodium benzoate) increased hyperactive behaviour in young children."
      pl: "Jeden z sześciu barwników (wraz z E102, E104, E110, E122, E129) wymagających obowiązkowego oświadczenia na etykiecie w UE, w związku z badaniem RCT McCann z 2007 r., które wykazało, że mieszanka tych barwników (i benzoesanu sodu) zwiększała nadpobudliwość u małych dzieci."
    sources: [{ id: reg-1333-2008, locator: "Annex V" }, { id: mccann-2007 }]
  - code: regulatory.eu_warning_label
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Label must state '[name/E-number]: may have an adverse effect on activity and attention in children.'"
      pl: "Etykieta musi zawierać zapis: „[nazwa/numer E]: może mieć szkodliwy wpływ na aktywność i skupienie uwagi u dzieci”."
    sources: [{ id: reg-1333-2008, locator: "Annex V" }]
  - code: regulatory.eu_restricted
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "After EFSA lowered the ADI from 4 to 0.7 mg/kg bw/day (2009), Reg 232/2012 reduced the permitted use levels."
      pl: "Po obniżeniu przez EFSA ADI z 4 do 0,7 mg/kg mc./dzień (2009) rozporządzenie 232/2012 zmniejszyło dozwolone poziomy stosowania."
    sources: [{ id: csh-reg-232-2012, locator: "recital 5" }]
  - code: origin.petrochemical_synthetic
    certainty: yes
    kind: estimate
    grade: B
    note:
      en: "An azo dye made from naphthalene-sulfonic-acid intermediates (its JECFA specification limits five of them, and unsulfonated aromatic amines), usually synthesised from aromatic hydrocarbons. Those come from fossil feedstocks (petroleum or coal tar); no source names the feedstock, hence estimate. How it is made says nothing about safety by itself."
      pl: "Barwnik azowy otrzymywany z półproduktów – kwasów naftalenosulfonowych (specyfikacja JECFA ogranicza pięć z nich oraz niesulfonowane aminy aromatyczne), zwykle syntetyzowany z węglowodorów aromatycznych. Te pochodzą z surowców kopalnych (ropy naftowej lub smoły węglowej); żadne źródło nie wskazuje surowca, stąd szacunek. Sposób produkcji sam w sobie nie mówi nic o bezpieczeństwie."
    sources: [{ id: csh-jecfa-ponceau-4r-1984, locator: "Definition; Purity" }, { id: csh-wikipedia-ponceau-4r }]
regulatory:
  - jurisdiction: EU
    status: restricted
    conditions: { en: "Authorised in specific food categories at reduced use levels since Reg 232/2012; triggers the Annex V children's activity and attention warning.", pl: "Dopuszczony w określonych kategoriach żywności na obniżonych poziomach od rozp. 232/2012; wymaga ostrzeżenia z Załącznika V o wpływie na aktywność i uwagę dzieci." }
    since: "2012"
    source: csh-reg-232-2012
  - jurisdiction: US
    status: not_authorised
    conditions: { en: "Not approved by the FDA for human consumption.", pl: "Niedopuszczony przez FDA do spożycia przez ludzi." }
    source: csh-wikipedia-ponceau-4r
reference_values:
  - type: ADI
    value: 0.7
    unit: "mg/kg bw/day"
    body: EFSA
    year: 2009
    source: csh-reg-232-2012
review_status: draft
provenance: ai-drafted
review_notes:
  - "EFSA's 2009 opinion was not opened; the EFSA ADI is taken from Reg 232/2012, which states it. The current JECFA ADI was not checked (the 1984 specification records 0-4 mg/kg bw from 1983)."
  - "Per-category Annex II maximum levels not transcribed (avoid a wrong number)."
