id: tree-nuts
type: ingredient
names:
  en: [nuts, tree nuts, other nuts, other tree nuts]
  pl: [orzechy, inne orzechy, orzechy łupinowe, orzechów]
  de: [Schalenfrüchte, andere Schalenfrüchte, Schalenfrüchten, Nüsse, Nüssen]
summary:
  en: >-
    The generic allergen-category term for tree nuts (almonds, hazelnuts, walnuts, cashews, pecans, Brazil
    nuts, pistachios and macadamia/Queensland nuts) and products thereof, as it appears on labels without
    naming a specific nut, e.g. in "may contain" statements. Peanuts are a separate legume and a distinct
    EU allergen (Annex II item 5), not part of this tree-nut category.
  pl: >-
    Ogólny, kategorialny termin alergenowy oznaczający orzechy łupinowe (migdały, orzechy laskowe,
    włoskie, nerkowca, pekan, brazylijskie, pistacje i orzechy makadamia/Queensland) oraz produkty z nich,
    używany na etykietach bez wskazania konkretnego orzecha, np. w informacjach "może zawierać". Orzeszki
    ziemne (arachidowe) to odrębna roślina strączkowa i odrębny alergen UE (Aneks II, punkt 5), nienależący
    do tej kategorii orzechów łupinowych.
  de: >-
    Der allgemeine Allergen-Sammelbegriff für Schalenfrüchte (Mandeln, Haselnüsse, Walnüsse, Cashewnüsse,
    Pekannüsse, Paranüsse, Pistazien und Macadamianüsse) und daraus gewonnene Erzeugnisse, wie er auf
    Etiketten ohne Nennung einer bestimmten Nuss erscheint. Erdnüsse sind eine eigene Hülsenfrucht und ein
    eigenes EU-Allergen (Anhang II Nr. 5), nicht Teil dieser Kategorie.
