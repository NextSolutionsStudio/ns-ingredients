id: fatty-acid-esters-of-ascorbic-acid
type: additive
e_number: E304
names:
  en:
    - fatty acid esters of ascorbic acid
  pl:
    - estry kwasów tłuszczowych i kwasu askorbinowego
  de:
    - Fettsäureester der Ascorbinsäure
functions:
  - antioxidant
summary:
  en: >-
    Fat-soluble antioxidants consisting of esters of L-ascorbic acid (vitamin C) with palmitic acid (E 304(i),
    ascorbyl palmitate) or stearic acid (E 304(ii), ascorbyl stearate). Used in oils, margarines and infant
    formulae to prevent fat rancidity. EU specifications define E 304(i)-(ii) chemically without naming
    whether the fatty acids derive from vegetable oils or animal fats.
  pl: >-
    Przeciwutleniacze rozpuszczalne w tłuszczach: estry kwasu L-askorbinowego (witaminy C) z kwasem
    palmitynowym (E 304(i), palmitynian askorbylu) lub kwasem stearynowym (E 304(ii), stearynian askorbylu).
    Stosowane m.in. w olejach i margarynach; specyfikacje UE definiują E 304(i)-(ii) bez wskazania, czy kwasy
    tłuszczowe pochodzą z olejów roślinnych czy tłuszczów zwierzęcych.
variants:
  - id: ascorbyl-palmitate
    names:
      en:
        - ascorbyl palmitate
        - L-ascorbyl palmitate
        - L-ascorbic acid 6-hexadecanoate
        - E304(i)
      pl:
        - palmitynian askorbylu
        - palmitynian L-askorbylu
        - E304(i)
      de:
        - Ascorbylpalmitat
        - Palmitinsäureascorbylester
    process:
      en: "Esterification of L-ascorbic acid with palmitic acid (E 304(i))."
      pl: "Estryfikacja kwasu L-askorbinowego kwasem palmitynowym (E 304(i))."
    tells:
      - 'palmitynian\w*\s+(?:l\s+)?askorbyl'
      - 'ascorbyl\s*palmitat'
      - 'ascorbic acid 6 hexadecanoate'
      - 'palmitinsaureascorbylester'
      - 'e\s*304\s*i\b'
  - id: ascorbyl-stearate
    names:
      en:
        - ascorbyl stearate
        - L-ascorbyl stearate
        - E304(ii)
      pl:
        - stearynian askorbylu
        - stearynian L-askorbylu
        - E304(ii)
      de:
        - Ascorbylstearat
    process:
      en: "Esterification of L-ascorbic acid with stearic acid (E 304(ii))."
      pl: "Estryfikacja kwasu L-askorbinowego kwasem stearynowym (E 304(ii))."
    tells:
      - 'stearynian\w*\s+(?:l\s+)?askorbyl'
      - 'ascorbyl\s*stearat'
      - 'e\s*304\s*ii\b'
assertions:
  - code: origin.vegetable_oil_derived
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Reg (EU) No 231/2012 specifies E 304(i) (ascorbyl palmitate) and E 304(ii) (ascorbyl stearate) by
        chemical identity without naming the fat source of the palmitic or stearic acid moiety; vegetable oils
        are a plausible source, which food labels do not disclose.
      pl: >-
        Rozporządzenie (UE) nr 231/2012 definiuje E 304(i) (palmitynian askorbylu) i E 304(ii) (stearynian
        askorbylu) wyłącznie przez tożsamość chemiczną, nigdy nie podając źródła tłuszczu dla reszty kwasu
        palmitynowego lub stearynowego; oleje roślinne są jednym z możliwych źródeł, czego etykieta nie ujawnia.
    sources:
      - id: reg-231-2012
        locator: E 304(i)-(ii)
  - code: origin.animal
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Reg (EU) No 231/2012 specifies E 304(i)-(ii) by chemical identity without naming or excluding an animal
        fat source for the palmitic or stearic acid moiety, and food labels do not disclose the fat source.
      pl: >-
        Rozporządzenie (UE) nr 231/2012 definiuje E 304(i)-(ii) wyłącznie przez tożsamość chemiczną, nigdy nie
        podając ani nie wykluczając źródła zwierzęcego dla reszty kwasu palmitynowego lub stearynowego, a
        etykieta nie ujawnia pochodzenia tłuszczu.
    sources:
      - id: reg-231-2012
        locator: E 304(i)-(ii)
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: "Group I additive (Reg (EC) No 1333/2008 Annex II Part C): quantum satis in most food categories."
      pl: "Dodatek grupy I (Rozp. (WE) nr 1333/2008 Załącznik II część C): quantum satis w większości kategorii żywności."
    source: reg-1333-2008
review_status: draft
provenance: ai-drafted
review_notes:
  - "Covers EU additive group E 304 (sub-items E 304(i) ascorbyl palmitate and E 304(ii) ascorbyl stearate); generated Wikidata divides these across e304 and e305."
  - "EFSA 2015 re-evaluation (doi:10.2903/j.efsa.2015.4289, PMID 42169855, abstract only in sources-pack/efsa-e304-ascorbyl-palmitate.txt) discusses pre-systemic hydrolysis and safety (no ADI established, no safety concern) without describing esterification manufacture; Reg (EU) No 231/2012 E 304(i)-(ii) states chemical identity only, so origin.chemical_synthesis was omitted."
