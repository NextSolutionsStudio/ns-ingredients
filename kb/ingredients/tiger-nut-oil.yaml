summary:
  en: >-
    Vegetable oil pressed from tiger nuts (earth almonds), the tubers of Cyperus esculentus. Despite the names, tiger
    nuts are neither almonds nor peanuts nor any tree nut listed in EU Annex II item 8, so the oil carries no nut or
    peanut allergen declaration.
  pl: >-
    Olej roślinny tłoczony z migdałów ziemnych (orzechów tygrysich), bulw cibory jadalnej (Cyperus esculentus). Mimo
    nazwy migdały ziemne nie są migdałami, orzeszkami ziemnymi ani żadnym orzechem z Aneksu II UE (punkt 8), więc olej
    nie podlega deklaracji alergenu orzechów ani orzeszków ziemnych.
