id: bht
type: additive
e_number: E321
ids: { cas: "128-37-0", wikidata: Q221945, chebi: "CHEBI:34247", pubchem: 31404 }
names:
  en: [butylated hydroxytoluene, BHT]
  pl: [butylowany hydroksytoluen]
  de: [Butylhydroxytoluol]
functions: [antioxidant]
summary:
  en: >-
    A synthetic antioxidant, often used together with BHA, to keep fats, oils and packaging from going
    rancid. Made by reacting p-cresol with isobutylene under acid catalysis — a chemical-synthesis route,
    not extracted from a natural source. EFSA's 2012 re-evaluation raised its ADI (versus the 1987 SCF
    figure) after concluding BHT is not a genotoxicity concern and that any carcinogenicity seen in
    long-term rodent studies is a threshold effect, not a mutagenic one.
  pl: >-
    Syntetyczny przeciwutleniacz, często stosowany razem z BHA, aby zapobiec jełczeniu tłuszczów, olejów
    i materiałów opakowaniowych. Wytwarzany w reakcji p-krezolu z izobutylenem w obecności katalizatora
    kwasowego — metodą syntezy chemicznej, a nie ekstrahowany z naturalnego źródła. Reocena EFSA z 2012 r.
    podniosła jego ADI (względem wartości SCF z 1987 r.) po uznaniu, że BHT nie stanowi zagrożenia
    genotoksycznego i że ewentualna rakotwórczość obserwowana w długoterminowych badaniach na gryzoniach
    jest efektem progowym, a nie mutagennym.
assertions:
