    certainty: yes
    kind: fact
    grade: B
    note:
      en: "Made industrially by reacting p-cresol (4-methylphenol) with isobutylene, catalysed by sulfuric acid; not extracted from a plant, animal or microbial source."
      pl: "Wytwarzany przemysłowo w reakcji p-krezolu (4-metylofenolu) z izobutylenem, katalizowanej kwasem siarkowym; nie jest ekstrahowany z surowca roślinnego, zwierzęcego czy mikrobiologicznego."
