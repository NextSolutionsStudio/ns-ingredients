id: apple-juice
type: carbohydrate
names:
  en:
    - apple juice
  pl:
    - sok jabłkowy
    - sok z jabłek
    - soku jabłkowego
  de:
    - Apfelsaft
summary:
  en: >-
    Juice obtained from apples (Malus domestica) as defined in Directive 2001/112/EC. Under WHO's 2015
    sugars guideline, sugars naturally present in fruit juices count as free sugars; concentrated apple juice
    and juice from concentrate are covered separately under fruit-juice-concentrate.
  pl: >-
    Sok otrzymywany z jabłek (Malus domestica) zgodnie z dyrektywą 2001/112/WE. Według wytycznych WHO z
    2015 r. cukry naturalnie obecne w sokach owocowych liczą się jako cukry wolne; zagęszczony sok jabłkowy
    i sok z zagęszczonego soku opisano w osobnym wpisie (koncentraty soków owocowych).
assertions:
  - code: health.added_sugar
    certainty: 'yes'
    kind: fact
    grade: A
    population: [general]
    note:
      en: >-
        Added as an ingredient, fruit juice counts as a free sugar in WHO's sense. WHO strongly recommends
        keeping free sugars under 10% of energy intake. The ingredient list does not show how much is in the
        product.
      pl: >-
        Dodany jako składnik, sok owocowy jest cukrem wolnym w rozumieniu WHO. WHO zdecydowanie zaleca, by
        cukry wolne stanowiły mniej niż 10% energii z diety. Lista składników nie pokazuje, ile go jest w
        produkcie.
    sources:
      - id: who-free-sugars-2015
  - code: origin.plant
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Pressed from apples.
      pl: Wyciskany z jabłek.
    sources:
      - id: sug-juice-directive
      - id: reg-1169-2011
        locator: 'Art. 18 and Annex VII: the ingredient as declared by its name'
glycemic:
  - range: [37, 67]
    fraction: sugars
    method: iso
    note:
      en: Apple juices, including reconstituted juice.
      pl: Soki jabłkowe, także odtworzone.
    source: gi-atkinson-2021
    locator: Supplemental Table 1, foods 1180-1184
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Policy call: counts as health.added_sugar (WHO 2015 free-sugar definition includes sugars naturally
    present in fruit juices, matching kb/ingredients/fruit-juice-concentrate.yaml).
  - >-
    No blanket vegan claim: clarification/fining processing aids (e.g. gelatine) were not verified for a
    given batch.
