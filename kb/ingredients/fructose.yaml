id: fructose
type: carbohydrate
names:
  en: ["fructose","crystalline fructose"]
  pl: ["fruktoza","fruktoza krystaliczna","fruktozy"]
  de: ["Fruktose","Fructose","Fruchtzucker"]
summary:
  en: "Purified crystalline D-fructose, a single sugar. It can be separated from hydrolysed sucrose or produced from starch through glucose isomerisation, then purified and crystallised."
  pl: "Oczyszczona krystaliczna D-fruktoza, cukier prosty. Może być wydzielana ze zhydrolizowanej sacharozy lub wytwarzana ze skrobi przez izomeryzację glukozy, a następnie oczyszczana i krystalizowana."
assertions:
  - code: health.added_sugar
    certainty: yes
    kind: fact
    grade: A
    population: [general]
    note:
      en: "Added as an ingredient, it counts as a free sugar in WHO's sense. WHO strongly recommends keeping free sugars under 10% of energy intake. The ingredient list does not show how much is in the product."
      pl: "Dodany jako składnik, jest cukrem wolnym w rozumieniu WHO. WHO zdecydowanie zaleca, by cukry wolne stanowiły mniej niż 10% energii z diety. Lista składników nie pokazuje, ile go jest w produkcie."
    sources: [{ id: who-free-sugars-2015 }]
  - code: origin.plant
    certainty: yes
    kind: estimate
    grade: D
    note:
      en: "Plant feedstock varies: starch, sucrose or inulin. Starch is hydrolysed to glucose before enzymatic isomerisation; sucrose and inulin are hydrolysed to release fructose."
      pl: "Surowiec roślinny jest zmienny: skrobia, sacharoza lub inulina. Skrobia jest hydrolizowana do glukozy przed izomeryzacją enzymatyczną; hydroliza sacharozy i inuliny uwalnia fruktozę."
    sources: [{ id: sug-fructose }, { id: sug-sugars-directive }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "No numerical route priors: the opened sources do not establish probabilities for an undisclosed label. No blanket vegan or gluten-free claim: processing aids and batch certification were not verified."
  - "No automatic wheat-glucose-syrup exemption was assigned to all crystalline fructose: the crop and downstream processing were not verified."
