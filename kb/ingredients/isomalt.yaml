id: isomalt
type: additive
e_number: E953
ids:
  cas: 64519-82-0
names:
  en:
  - isomalt
  - hydrogenated isomaltulose
  pl:
  - izomalt
  - uwodorniona izomaltuloza
  de:
  - Isomalt
functions:
- sweetener
- bulking-agent
- glazing-agent
summary:
  en: A bulk sweetener containing a mixture of sugar alcohols, used in products such as sugar-free confectionery.
    It is made by enzymatically converting sucrose into isomaltulose and then catalytically hydrogenating it.
    E953 is authorised subject to EU category conditions, and the EU laxative statement applies to foods with
    more than 10% added polyols.
  pl: Substancja słodząca nadająca objętość, zawierająca mieszaninę alkoholi cukrowych, stosowana między innymi
    w wyrobach cukierniczych bez cukru. Otrzymuje się ją przez enzymatyczne przekształcenie sacharozy w izomaltulozę,
    a następnie katalityczne uwodornienie. E953 jest dopuszczony na warunkach dla kategorii żywności w UE,
    a informacja o działaniu przeczyszczającym jest wymagana dla żywności zawierającej ponad 10% dodanych polioli.
assertions:
- code: origin.chemical_synthesis
  certainty: 'yes'
  kind: fact
  grade: A
  note:
    en: The EU specification describes enzymatic conversion of sucrose using non-viable Protaminobacter rubrum
      cells, followed by catalytic hydrogenation; the product mainly contains glucosyl-sorbitol and glucosyl-mannitol.
    pl: Specyfikacja UE opisuje enzymatyczne przekształcenie sacharozy z użyciem nieżywotnych komórek Protaminobacter
      rubrum, a następnie katalityczne uwodornienie; produkt zawiera głównie glukozylo-sorbitol i glukozylo-mannitol.
  sources:
  - id: swm-reg-231-2012
- code: health.laxative_polyol
  certainty: 'yes'
  kind: fact
  grade: A
  note:
    en: Food containing more than 10% added polyols must carry the statement 'excessive consumption may produce
      laxative effects'.
    pl: Żywność zawierająca ponad 10% dodanych polioli musi zawierać informację 'nadmierne spożycie może mieć
      efekt przeczyszczający'.
  sources:
  - id: swm-reg-1169-2011
    locator: Annex III, point 2.4
- code: regulatory.eu_warning_label
  certainty: 'yes'
  kind: fact
  grade: A
  note:
    en: The laxative statement above is a mandatory label statement under Annex III of Reg 1169/2011.
    pl: Powyższa informacja o działaniu przeczyszczającym jest obowiązkową informacją na etykiecie na podstawie
      załącznika III rozporządzenia 1169/2011.
  sources:
  - id: swm-reg-1169-2011
    locator: Annex III, point 2.4
regulatory:
- jurisdiction: EU
  status: authorised
  conditions:
    en: Listed in Annex II to Regulation 1333/2008; use is subject to food-category conditions and applicable
      limits.
    pl: Wymieniony w załączniku II do rozporządzenia 1333/2008; stosowanie podlega warunkom i limitom dla kategorii
      żywności.
  source: swm-reg-1129-2011
reference_values:
- type: ADI
  value: not specified
  body: JECFA
  year: 1985
  source: swm-jecfa-isomalt
glycemic:
  - range: [2, 12]
    fraction: polyols
    method: non_iso
    note: { en: "Study-level relative glucose responses.", pl: "Względne odpowiedzi glikemiczne z poszczególnych badań." }
    source: gi-livesey-2003
    locator: "Table 4, isomalt"
review_status: draft
provenance: ai-drafted
review_notes:
- Individual current food-category maximum levels were not exhaustively checked or transcribed; consult the
  consolidated EU list for a particular product.
- 'No diet, GMO, feedstock-country or general health-benefit assertions: the opened sources do not verify these
  for a particular supplier.'
- US status not verified from an opened authoritative source; no US row.
- No specific sugar-beet or sugar-cane origin asserted; the specification identifies sucrose, not a universal
  crop source.
- JECFA's ADI not specified does not remove the mandatory polyol statement.
