        - w pełni uwodorniony olej roślinny gorczycowy
        - olej roślinny gorczycowy w pełni uwodorniony
        - całkowicie utwardzony olej roślinny musztardowy
        - olej roślinny musztardowy całkowicie utwardzony
        - całkowicie uwodorniony olej roślinny musztardowy
        - olej roślinny musztardowy całkowicie uwodorniony
        - w pełni utwardzony olej roślinny musztardowy
