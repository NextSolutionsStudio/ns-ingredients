summary:
  en: >-
    Vegetable oil pressed or extracted from mustard seeds (Brassica / Sinapis spp.). As a product derived from them, it
    falls under EU Annex II item 10 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z nasion gorczycy (Brassica / Sinapis spp.). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 10); olej nie jest z niego wyłączony.
