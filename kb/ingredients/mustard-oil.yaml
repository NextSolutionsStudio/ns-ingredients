        - częściowo uwodorniony olej roślinny musztardowy
        - olej roślinny musztardowy częściowo uwodorniony
    process:
      en: "Mustard oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej gorczycowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - 'czesciowo (?:utwardzon|uwodorn)'
      - 'partially hydrogenated'
      - 'teilweise gehartet'
