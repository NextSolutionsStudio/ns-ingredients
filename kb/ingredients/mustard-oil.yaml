id: mustard-oil
type: fat
parent: mustard
names:
  en:
    - mustard oil
    - mustard seed oil
    - non-hydrogenated mustard oil
    - unhydrogenated mustard oil
    - non-hydrogenated mustard seed oil
    - unhydrogenated mustard seed oil
  pl:
    - olej gorczycowy
    - olej musztardowy
    - olej roślinny gorczycowy
    - olej roślinny musztardowy
    - olej z gorczycy
    - musztardowy olej roślinny
    - gorczycowy olej roślinny
    - oleje roślinne musztardowe
    - oleje roślinne gorczycowe
    - olej z nasion gorczycy
    - olej roślinny z gorczycy
    - olej roślinny z nasion gorczycy
  de:
    - Senföl
summary:
  en: >-
    Vegetable oil pressed or extracted from mustard seeds (Brassica / Sinapis spp.). As a product derived from them, it
    falls under EU Annex II item 10 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z nasion gorczycy (Brassica / Sinapis spp.). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 10); olej nie jest z niego wyłączony.
variants:
  - id: hydrogenated
    names:
      en:
        - hydrogenated mustard oil
        - hydrogenated mustard seed oil
      pl:
        - utwardzony olej gorczycowy
        - olej gorczycowy utwardzony
        - uwodorniony olej gorczycowy
        - olej gorczycowy uwodorniony
        - utwardzony olej musztardowy
        - olej musztardowy utwardzony
        - uwodorniony olej musztardowy
        - olej musztardowy uwodorniony
        - utwardzony olej roślinny gorczycowy
        - olej roślinny gorczycowy utwardzony
        - uwodorniony olej roślinny gorczycowy
        - olej roślinny gorczycowy uwodorniony
        - utwardzony olej roślinny musztardowy
        - olej roślinny musztardowy utwardzony
        - uwodorniony olej roślinny musztardowy
        - olej roślinny musztardowy uwodorniony
    process:
      en: "Mustard oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej gorczycowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)'
  - id: partially-hydrogenated
    names:
      en:
        - partially hydrogenated mustard oil
        - partially hydrogenated mustard seed oil
      pl:
        - częściowo utwardzony olej gorczycowy
        - olej gorczycowy częściowo utwardzony
        - częściowo uwodorniony olej gorczycowy
        - olej gorczycowy częściowo uwodorniony
