id: mustard-oil
type: fat
parent: mustard
names:
  en:
    - mustard oil
    - mustard seed oil
  pl:
    - olej gorczycowy
    - olej musztardowy
    - olej roślinny gorczycowy
    - olej roślinny musztardowy
    - olej z gorczycy
    - musztardowy olej roślinny
    - gorczycowy olej roślinny
    - oleje roślinne musztardowe
    - oleje roślinne gorczycowe
    - olej z nasion gorczycy
    - olej roślinny z gorczycy
    - olej roślinny z nasion gorczycy
  de:
    - Senföl
summary:
  en: >-
    Vegetable oil pressed or extracted from mustard seeds (Brassica / Sinapis spp.). As a product derived from them, it
    falls under EU Annex II item 10 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z nasion gorczycy (Brassica / Sinapis spp.). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 10); olej nie jest z niego wyłączony.
assertions:
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: A pressed vegetable oil; EU labelling requires its specific plant origin to be named.
      pl: Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny.
    sources:
      - id: reg-1169-2011
        locator: Annex VII Part A, point 8
  - code: allergen.mustard
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: Product derived from mustard seeds; EU Annex II item 10, with no exemption for the oil.
      pl: Produkt z nasion gorczycy; Aneks II UE, punkt 10, bez wyłączenia dla oleju.
    sources:
      - id: reg-1169-2011
        locator: Annex II item 10
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Split from the `mustard` entry in batch b2 (Sol 6.1: an oil is a different food from the whole
    seed or nut). Identity-only beyond origin and the allergen; no assessment opened.
