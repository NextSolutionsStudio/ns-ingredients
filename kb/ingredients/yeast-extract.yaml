id: yeast-extract
type: ingredient
names:
  en:
    - yeast extract
    - yeast extracts
  pl:
    - ekstrakt drożdżowy
    - ekstrakty drożdżowe
    - ekstrakt z drożdży
    - ekstrakt drożdży
    - ekstrakt drożdżowy suszony
  de:
    - Hefeextrakt
summary:
  en: 'The soluble contents of yeast cells after their walls are broken down, used for a savoury taste.'
  pl: 'Rozpuszczalna zawartość komórek drożdży po rozłożeniu ścian komórkowych, stosowana dla wytrawnego smaku.'
assertions:
  - code: origin.microbial_fermentation
    certainty: 'yes'
    kind: estimate
    grade: B
    note:
      en: >-
        Prepared mainly from waste brewer's yeast (fermentation-derived Saccharomyces cerevisiae, alongside
        baker's yeast), predominantly by autolysis (as well as plasmolysis, enzymatic lysis or physical
        disruption) to release soluble cellular contents.
      pl: >-
        Wytwarzany głównie z odpadowych drożdży browarniczych (Saccharomyces cerevisiae z fermentacji, obok
        drożdży piekarskich), przede wszystkim przez autolizę (a także plazmolizę, lizę enzymatyczną lub
        rozbijanie fizyczne) w celu uwolnienia rozpuszczalnej zawartości komórek.
    sources:
      - id: tao-yeast-extract-pmc9998214
        locator: "Abstract & Yeast Extract Production Technology"
review_status: draft
provenance: ai-drafted
review_notes:
  - 'Candidate later: free glutamate content and NOVA processing treatment.'
