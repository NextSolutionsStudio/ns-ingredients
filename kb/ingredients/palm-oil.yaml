id: palm-oil
type: fat
names:
  en: [palm oil, non-hydrogenated palm oil, non-hydrogenated palm fat]
  pl: [olej palmowy, tłuszcz palmowy, nieutwardzony tłuszcz palmowy, tłuszcz palmowy nieutwardzony, nieutwardzony olej palmowy, tłuszcz roślinny palmowy, olej roślinny palmowy, palmowy olej roślinny]
  de: [Palmöl, Palmfett]
summary:
  en: >-
    Oil pressed from the fruit (mesocarp) of the oil palm (Elaeis guineensis). High in saturated fat, solid
    at room temperature without hydrogenation, cheap and versatile, so it appears widely in baked goods,
    spreads, instant noodles and confectionery. EU labelling rules require the specific plant to be named
    ("palm oil"), which is why it is visible on ingredient lists rather than hidden inside "vegetable oil".
    Its main documented concern is not food safety but land use: palm cultivation is one of the commodities
    the EU treats as a deforestation risk.
  pl: >-
    Olej wyciskany z owocu (miąższu) palmy olejowej (Elaeis guineensis). Bogaty w tłuszcze nasycone, stały
    w temperaturze pokojowej bez utwardzania, tani i wszechstronny — stąd jego obecność w wyrobach
    piekarniczych, margarynach, zupach instant i słodyczach. Przepisy UE o etykietowaniu wymagają podania
    konkretnej rośliny ("olej palmowy"), dlatego widać go na liście składników, a nie krył się pod "olejem
    roślinnym". Głównym udokumentowanym zastrzeżeniem wobec niego nie jest bezpieczeństwo żywności, lecz
    użytkowanie gruntów: uprawa palmy jest jednym z surowców, które UE traktuje jako ryzyko wylesiania.
variants:
  - id: refined
    names:
      en: [refined palm oil, RBD palm oil]
      pl: [olej palmowy rafinowany, rafinowany olej palmowy]
    process:
      en: "Refined, bleached and deodorised (RBD) — the standard food-industry form, pale and near-flavourless."
      pl: "Rafinowany, odbarwiany i dezodoryzowany (RBD) — standardowa forma przemysłowa, blada i praktycznie bez smaku/zapachu."
    tells: ['rafinowan.*palmow', 'palmow.*rafinowan', 'refined palm oil', 'rbd palm oil']
    prior: 0.9
    prior_rationale:
      en: "Almost all palm oil in manufactured food is RBD; unrefined/red palm oil is a small specialty niche always marketed as such."
      pl: "Niemal cały olej palmowy w żywności przetworzonej to RBD; nierafinowany/czerwony olej palmowy to niewielka niszowa specjalność, zawsze tak oznaczana."
  - id: red
    names:
      en: [red palm oil, virgin palm oil]
      pl: [czerwony olej palmowy, olej palmowy nierafinowany]
    process:
      en: "Unrefined or minimally refined; keeps the carotenoids that give it a red-orange colour and a stronger flavour."
      pl: "Nierafinowany lub minimalnie rafinowany; zachowuje karotenoidy dające czerwono-pomarańczowy kolor i wyraźniejszy smak."
    tells: ['czerwony olej palmowy', 'red palm oil', 'virgin palm oil', 'olej palmowy nierafinowany']
    prior: 0.1
    prior_rationale:
      en: "A specialty product always sold on its colour/flavour, so it is named when present."
      pl: "Produkt specjalny, sprzedawany właśnie ze względu na kolor/smak, więc gdy jest obecny — jest nazwany."
  - id: hydrogenated
    names:
      en: [hydrogenated palm oil, hydrogenated palm fat]
      pl: [utwardzony olej palmowy, olej palmowy utwardzony, uwodorniony olej palmowy, olej palmowy uwodorniony, utwardzony tłuszcz palmowy, tłuszcz palmowy utwardzony, uwodorniony tłuszcz palmowy, tłuszcz palmowy uwodorniony]
      de: [gehärtetes Palmöl, gehärtetes Palmfett]
    process:
      en: "Palm oil or palm fat hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej lub tłuszcz palmowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells: ['(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)']
  - id: partially-hydrogenated
    names:
      en: [partially hydrogenated palm oil, partially hydrogenated palm fat]
      pl: [olej palmowy częściowo utwardzony, częściowo utwardzony olej palmowy, tłuszcz palmowy częściowo utwardzony, częściowo utwardzony tłuszcz palmowy, olej palmowy częściowo uwodorniony, częściowo uwodorniony olej palmowy, tłuszcz palmowy częściowo uwodorniony, częściowo uwodorniony tłuszcz palmowy]
      de: [teilweise gehärtetes Palmöl, teilweise gehärtetes Palmfett]
    process:
      en: "Palm oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej palmowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells: ['czesciowo (?:utwardzon|uwodorn)', 'partially hydrogenated', 'teilweise gehartet']
  - id: fully-hydrogenated
    names:
      en: [fully hydrogenated palm oil, totally hydrogenated palm oil, fully hydrogenated palm fat]
      pl: [olej palmowy całkowicie utwardzony, całkowicie utwardzony olej palmowy, tłuszcz palmowy całkowicie utwardzony, całkowicie utwardzony tłuszcz palmowy, olej palmowy w pełni utwardzony, w pełni utwardzony olej palmowy, tłuszcz palmowy w pełni utwardzony, w pełni utwardzony tłuszcz palmowy, olej palmowy całkowicie uwodorniony, całkowicie uwodorniony olej palmowy, tłuszcz palmowy całkowicie uwodorniony, całkowicie uwodorniony tłuszcz palmowy, olej palmowy w pełni uwodorniony, w pełni uwodorniony olej palmowy, tłuszcz palmowy w pełni uwodorniony, w pełni uwodorniony tłuszcz palmowy]
      de: [vollständig gehärtetes Palmöl, vollständig gehärtetes Palmfett]
    process:
      en: "Palm oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej palmowy ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells: ['calkowicie (?:utwardzon|uwodorn)', 'w pelni (?:utwardzon|uwodorn)', 'fully hydrogenated', 'totally hydrogenated', 'vollstandig gehartet']
assertions:
  - code: ethics.palm_oil
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Palm oil is one of the seven commodities the EU deforestation regulation requires traders to show is not linked to post-2020 deforestation."
      pl: "Olej palmowy jest jednym z siedmiu surowców, dla których unijne rozporządzenie o wylesianiu wymaga od podmiotów wykazania braku związku z wylesianiem po 2020 r."
    sources: [{ id: reg-2023-1115 }]
  - code: origin.vegetable_oil_derived
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "A pressed vegetable oil; EU labelling requires its specific plant origin to be named."
      pl: "Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.refined
    variant: refined
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Refined, bleached and deodorised before food use."
      pl: "Rafinowany, odbarwiany i dezodoryzowany przed użyciem w żywności."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources: [{ id: reg-2019-649 }]
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "Left out RSPO/certification status as a per-batch fact: whether a given palm oil is RSPO-certified is not something an ingredient list can show, and belongs to product-level sourcing data rather than this ingredient entry."
