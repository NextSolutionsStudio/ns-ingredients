review_status: draft
provenance: ai-drafted
review_notes:
  - "Erythritol has separately been the subject of observational studies linking higher blood erythritol levels to cardiovascular events (2023-2024); not asserted here because this session did not open a primary study, and EFSA's 2023 re-evaluation (the source used) addressed laxative/GI risk, not the cardiovascular signal. Worth a follow-up batch once a primary source is opened."
