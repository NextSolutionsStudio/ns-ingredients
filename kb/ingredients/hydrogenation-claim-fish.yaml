summary:
  en: >-
    A label claim that excludes hydrogenation on a fat or oil from fish ("without hydrogenated anchovy oil").
    It excludes a process, not the food: a label that names the oil this way often contains the plain oil, so
    the allergen stays possible. The claim asserts nothing else: no hydrogenation, no origin, no diet.
  pl: >-
    Deklaracja na etykiecie, która wyklucza utwardzenie tłuszczu lub oleju z ryb. Wyklucza proces, nie
    składnik: etykieta, która tak wymienia olej, często zawiera zwykły olej, więc alergen pozostaje możliwy.
    Deklaracja nie stwierdza nic więcej: ani utwardzenia, ani pochodzenia, ani wpływu na dietę.
