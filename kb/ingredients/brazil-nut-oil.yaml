summary:
  en: >-
    Vegetable oil pressed from Brazil nuts (Bertholletia excelsa). As a product derived from Brazil nuts, it falls
    under EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z orzechów brazylijskich (Bertholletia excelsa). Jako produkt pochodzący z orzechów brazylijskich podlega
    obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
