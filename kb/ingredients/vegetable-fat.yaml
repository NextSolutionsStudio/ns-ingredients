review_notes:
  - "No ethics.palm_oil assertion placed on the generic wrapper: EU Reg 1169/2011 Annex VII Part A points 8-9 mandates specific species disclosure in parentheses, so palm-containing mixes are flagged directly on child palm-oil / palm-kernel-oil matches."
