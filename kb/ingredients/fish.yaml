id: fish
type: ingredient
names:
  en: [fish]
  pl: [ryby]
  de: [Fisch]
summary:
  en: "Fish and their products; one of the EU's fourteen regulated allergens, with a narrow exemption for fish gelatine used as a carrier for vitamin/carotenoid preparations or as a fining agent."
  pl: "Ryby i ich produkty; jeden z czternastu regulowanych alergenów UE, z wąskim wyłączeniem dla żelatyny rybnej stosowanej jako nośnik preparatów witaminowych/karotenoidowych lub środek klarujący."
assertions:
  - code: allergen.fish
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Declared ingredient; EU Annex II item 4.", pl: "Zadeklarowany składnik; Aneks II UE, punkt 4." }
    sources: [{ id: reg-1169-2011, locator: "Annex II item 4" }]
  - code: origin.fish
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Fish are by definition of fish origin.", pl: "Ryby są z definicji pochodzenia rybnego." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.vegan
    certainty: "no"
    kind: fact
    grade: A
    note: { en: "An animal product.", pl: "Produkt zwierzęcy." }
    sources: [{ id: reg-1169-2011 }]
  - code: diet.vegetarian
    certainty: "no"
    kind: fact
    grade: A
    note: { en: "Fish flesh is not compatible with a vegetarian diet.", pl: "Mięso rybne nie jest zgodne z dietą wegetariańską." }
    sources: [{ id: reg-1169-2011 }]
