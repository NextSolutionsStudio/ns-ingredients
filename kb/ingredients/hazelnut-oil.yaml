summary:
  en: >-
    Vegetable oil pressed or extracted from hazelnuts (Corylus avellana). As a product derived from them, it
    falls under EU Annex II item 8 allergen labelling, with no Annex II exemption for the oil.
  pl: >-
    Olej roślinny tłoczony lub ekstrahowany z orzechów laskowych (Corylus avellana). Jako produkt z nich pochodzący
    podlega obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8); olej nie jest z niego wyłączony.
