summary:
  en: "Fat churned and separated from cream or milk; one of the EU's fourteen regulated allergens (milk), used across baking, confectionery and cooking."
  pl: "Tłuszcz uzyskiwany przez ubijanie i oddzielanie ze śmietanki lub mleka; jeden z czternastu regulowanych alergenów UE (mleko), stosowany w piekarstwie, cukiernictwie i kuchni."
  de: "Aus Sahne oder Milch gebuttertes und abgetrenntes Fett; eines der vierzehn geregelten EU-Allergene (Milch)."
