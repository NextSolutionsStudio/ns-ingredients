id: acesulfame-k
type: additive
e_number: E950
ids: { cas: "55589-62-3", wikidata: Q132037, chebi: "CHEBI:184415", pubchem: 11074431 }
names:
  en: [acesulfame potassium, acesulfame K, Ace K]
  pl: [acesulfam K]
  de: [Acesulfam]
functions: [sweetener]
summary:
  en: >-
    A heat-stable intense sweetener (about 200x as sweet as sucrose), often blended with other
    sweeteners because its own aftertaste is more noticeable alone. Made entirely by chemical
    synthesis: an amide salt is cyclised and hydrolysed to acesulfame acid, then neutralised with
    potassium hydroxide and purified by crystallisation. EFSA's 2025 re-evaluation raised the ADI
    from 9 to 15 mg/kg bw/day (based on a rat NOAEL of 1500 mg/kg bw/day) while tightening the
    specification limit on a manufacturing impurity, 5-chloro-acesulfame, to 0.1 mg/kg over a
    genotoxicity concern flagged by computational (QSAR) screening.
  pl: >-
    Stabilny termicznie, intensywny słodzik (ok. 200 razy słodszy od sacharozy), często łączony z
    innymi słodzikami, ponieważ jego posmak jest wyraźniejszy, gdy stosowany samodzielnie. Otrzymywany
    w całości w procesie syntezy chemicznej: sól amidowa jest cyklizowana i hydrolizowana do kwasu
    acesulfamowego, a następnie neutralizowana wodorotlenkiem potasu i oczyszczana przez krystalizację.
    Reocena EFSA z 2025 r. podniosła ADI z 9 do 15 mg/kg m.c./dobę (na podstawie NOAEL 1500 mg/kg m.c.
    u szczurów), jednocześnie zaostrzając limit specyfikacji zanieczyszczenia produkcyjnego,
    5-chloroacesulfamu, do 0,1 mg/kg z powodu obaw o genotoksyczność zidentyfikowanych metodą
    obliczeniową (QSAR).
assertions:
  - code: origin.chemical_synthesis
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Synthesised from an acetoacetamide-N-sulfonate salt via cyclisation/hydrolysis to acesulfame acid, then neutralised with KOH; dichloromethane is used as solvent through the reaction steps."
      pl: "Syntetyzowany z soli acetoacetamido-N-sulfonianowej poprzez cyklizację/hydrolizę do kwasu acesulfamowego, a następnie neutralizację KOH; dichlorometan jest stosowany jako rozpuszczalnik na etapach reakcji."
    sources: [{ id: swt-efsa-acesulfame-2025 }]
  - code: diet.vegan
    certainty: yes
    kind: fact
    grade: A
    note: { en: "Produced entirely by chemical synthesis; no animal-derived inputs in the described route.", pl: "Otrzymywany wyłącznie w procesie syntezy chemicznej; opisany proces nie wykorzystuje surowców zwierzęcych." }
    sources: [{ id: swt-efsa-acesulfame-2025 }]
regulatory:
