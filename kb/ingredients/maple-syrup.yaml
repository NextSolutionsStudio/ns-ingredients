id: maple-syrup
type: carbohydrate
names:
  en: ["maple syrup","pure maple syrup"]
  pl: ["syrop klonowy","syropu klonowego"]
  de: ["Ahornsirup"]
summary:
  en: "A syrup made by concentrating sap collected from maple trees. Water is removed, commonly by boiling. It consists mainly of sucrose and water, with glucose and fructose also present."
  pl: "Syrop otrzymywany przez zagęszczanie soku zbieranego z klonów. Wodę usuwa się zwykle przez gotowanie. Składa się głównie z sacharozy i wody, zawiera też glukozę i fruktozę."
assertions:
  - code: health.added_sugar
    certainty: yes
    kind: fact
    grade: A
    population: [general]
    note:
      en: "Added as an ingredient, it counts as a free sugar in WHO's sense. WHO strongly recommends keeping free sugars under 10% of energy intake. The ingredient list does not show how much is in the product."
      pl: "Dodany jako składnik, jest cukrem wolnym w rozumieniu WHO. WHO zdecydowanie zaleca, by cukry wolne stanowiły mniej niż 10% energii z diety. Lista składników nie pokazuje, ile go jest w produkcie."
    sources: [{ id: who-free-sugars-2015 }]
  - code: origin.plant
    certainty: yes
    kind: estimate
    grade: D
    note:
      en: "Maple sap is collected from tapped trees and concentrated by water removal, including evaporation during boiling."
      pl: "Sok klonowy zbiera się z nawierconych drzew i zagęszcza przez usuwanie wody, w tym odparowanie podczas gotowania."
    sources: [{ id: sug-maple }]
glycemic:
  - range: [54, 54]
    fraction: sugars
    method: iso
    note: { en: "Pure Canadian maple syrup.", pl: "Czysty kanadyjski syrop klonowy." }
    source: gi-atkinson-2021
    locator: "Supplemental Table 1, food 1785"
review_status: draft
provenance: ai-drafted
review_notes:
  - "No numerical route priors: the opened sources do not establish probabilities for an undisclosed label. No blanket vegan or gluten-free claim: processing aids and batch certification were not verified."
