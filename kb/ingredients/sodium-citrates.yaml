id: sodium-citrates
type: additive
e_number: E331
names:
  en:
    - sodium citrates
    - sodium citrate
    - trisodium citrate
    - disodium citrate
    - monosodium citrate
  pl:
    - cytryniany sodu
    - cytrynian sodu
    - cytrynian trisodowy
    - cytrynian trisodu
    - cytrynian disodowy
    - cytrynian disodu
    - cytrynian monosodowy
    - cytrynian monosodu
  de:
    - Natriumcitrate
    - Natriumcitrat
    - Trinatriumcitrat
functions:
  - acidity-regulator
  - emulsifying-salts
  - sequestrant
summary:
  en: >-
    Mono-, di- and trisodium salts of citric acid (E 331(i)–(iii)), used as acidity regulators and as
    emulsifying salts in processed cheese.
  pl: >-
    Mono-, di- i trisodowe sole kwasu cytrynowego (E 331(i)–(iii)), stosowane jako regulatory kwasowości i
    jako sole emulgujące w serach topionych.
assertions:
  - code: origin.microbial_fermentation
    certainty: yes
    kind: estimate
    grade: B
    note:
      en: "Reg (EU) No 231/2012 defines E 331 as sodium salts of citric acid (E 330), and defines E 330 as produced from lemon/pineapple juice or Candida / Aspergillus niger fermentation; commercial citric acid is overwhelmingly fermentation-derived."
      pl: "Rozporządzenie (UE) nr 231/2012 definiuje E 331 jako sole sodowe kwasu cytrynowego (E 330), a E 330 jako wytwarzany z soku z cytryny/ananasa lub przez fermentację Candida / Aspergillus niger; handlowy kwas cytrynowy pochodzi niemal wyłącznie z fermentacji."
    sources:
      - { id: reg-231-2012, locator: "E 331 / E 330 (Definition)" }
      - { id: col-latif-2025-citric-acid }
  - code: origin.plant
    certainty: maybe
    kind: fact
    grade: A
    note:
      en: "Reg (EU) No 231/2012 permits parent citric acid (E 330) to be obtained from lemon or pineapple juice, though this route is commercially minor."
      pl: "Rozporządzenie (UE) nr 231/2012 dopuszcza pozyskiwanie wyjściowego kwasu cytrynowego (E 330) z soku z cytryny lub ananasa, choć ta ścieżka ma marginalne znaczenie handlowe."
    sources: [{ id: reg-231-2012, locator: "E 331 / E 330 (Definition)" }]
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group I additive (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis in most food
        categories.
      pl: >-
        Dodatek grupy I (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis w większości kategorii żywności.
    source: swm-reg-1129-2011
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Identity-only: no EFSA re-evaluation of E 331 was found, so no assessment is recorded. The parent acid is
    kb/ingredients/citric-acid.yaml.
