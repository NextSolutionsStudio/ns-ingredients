summary:
  en: >-
    Fat pressed from the nuts of the shea tree (Vitellaria paradoxa), used in chocolate fillings and as a
    cocoa butter equivalent. Not a tree nut under EU Annex II.
  pl: >-
    Tłuszcz wyciskany z orzechów masłosza (Vitellaria paradoxa), stosowany w nadzieniach czekoladowych i jako
    ekwiwalent masła kakaowego. Nie jest orzechem w rozumieniu załącznika II UE.
