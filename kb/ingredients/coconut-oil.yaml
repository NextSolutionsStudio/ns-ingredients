id: coconut-oil
type: fat
names:
  en: [coconut oil, non-hydrogenated coconut oil, non hydrogenated coconut oil, unhydrogenated coconut oil, non-hydrogenated coconut fat, non hydrogenated coconut fat, unhydrogenated coconut fat]
  pl: [olej kokosowy, tłuszcz kokosowy, olej roślinny kokosowy, tłuszcz roślinny kokosowy, kokosowy olej roślinny, oleje roślinne kokosowe, oleje roślinne kokosowy, tłuszcze roślinne kokosowe, tłuszcze roślinne kokosowy]
  de: [Kokosöl, ungehärtetes Kokosöl, ungehärtetes Kokosfett, nicht gehärtetes Kokosöl, nicht gehärtetes Kokosfett]
summary:
  en: >-
    Oil pressed from the flesh (kernel) of the coconut, rich in lauric acid and solid below about 24°C.
    Despite the name, the coconut is a drupe, not a tree nut, and it is not on the EU's Annex II list of
    the fourteen regulated allergens (almonds, hazelnuts, walnuts, cashews, pecans, Brazil nuts, pistachios
    and macadamia nuts) — a coincidental naming, not a legal exemption from something it was ever in.
  pl: >-
    Olej wyciskany z miąższu (jądra) orzecha kokosowego, bogaty w kwas laurynowy, stały poniżej ok. 24°C.
    Wbrew nazwie kokos botanicznie to pestkowiec, nie orzech drzewny, i nie znajduje się na unijnej liście
    czternastu regulowanych alergenów z Załącznika II (migdały, orzechy laskowe, włoskie, nerkowca, pekan,
    brazylijskie, pistacje i makadamia) — to zbieżność nazwy, a nie prawne wyłączenie z czegoś, do czego
    nigdy nie należał.
variants:
  - id: virgin
    names:
      en: [virgin coconut oil, cold-pressed coconut oil]
      pl: [olej kokosowy virgin, nierafinowany olej kokosowy, olej kokosowy tłoczony na zimno]
    process:
      en: "Pressed from fresh (not dried/copra) coconut meat and minimally processed; keeps coconut aroma and flavour."
      pl: "Wyciskany ze świeżego (nie suszonego/kopry) miąższu kokosa i minimalnie przetwarzany; zachowuje aromat i smak kokosa."
    tells: ['virgin coconut', 'kokos.*virgin', 'cold.?pressed coconut', 'nierafinowan.*kokos', 'tloczony na zimno.*kokos', 'kokos.*tloczony na zimno']
    prior: 0.35
    prior_rationale:
      en: "A quality/flavour feature manufacturers name when they pay for it."
      pl: "Cecha jakości/smaku, którą producenci nazywają, gdy za nią płacą."
  - id: refined
    names:
      en: [refined coconut oil, RBD coconut oil]
      pl: [olej kokosowy rafinowany, rafinowany olej kokosowy]
    process:
      en: "Pressed from dried coconut meat (copra) then refined, bleached and deodorised to a neutral, near-flavourless oil."
      pl: "Wyciskany z suszonego miąższu kokosa (kopry), następnie rafinowany, odbarwiany i dezodoryzowany do neutralnego, praktycznie bezsmakowego oleju."
    tells: ['refined coconut', 'rbd coconut', 'rafinowan.*kokos', 'kokos.*rafinowan']
    prior: 0.65
    prior_rationale:
      en: "The default for food manufacturing, which usually wants a neutral fat rather than coconut flavour."
      pl: "Standard w produkcji spożywczej, która zwykle potrzebuje neutralnego tłuszczu, a nie smaku kokosa."
  - id: hydrogenated
    names:
      en: [hydrogenated coconut oil, hydrogenated coconut fat]
      pl: [utwardzony olej kokosowy, olej kokosowy utwardzony, uwodorniony olej kokosowy, olej kokosowy uwodorniony, utwardzony tłuszcz kokosowy, tłuszcz kokosowy utwardzony, uwodorniony tłuszcz kokosowy, tłuszcz kokosowy uwodorniony]
      de: [gehärtetes Kokosöl, gehärtetes Kokosfett]
    process:
      en: "Coconut oil or fat hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej lub tłuszcz kokosowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells: ['(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)']
  - id: partially-hydrogenated
    names:
      en: [partially hydrogenated coconut oil, partially hydrogenated coconut fat]
      pl: [częściowo utwardzony olej kokosowy, olej kokosowy częściowo utwardzony, częściowo uwodorniony olej kokosowy, olej kokosowy częściowo uwodorniony, częściowo utwardzony tłuszcz kokosowy, tłuszcz kokosowy częściowo utwardzony, częściowo uwodorniony tłuszcz kokosowy, tłuszcz kokosowy częściowo uwodorniony]
      de: [teilweise gehärtetes Kokosöl, teilweise gehärtetes Kokosfett]
    process:
      en: "Coconut oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej kokosowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells: ['czesciowo (?:utwardzon|uwodorn)', 'partially hydrogenated', 'teilweise gehartet']
  - id: fully-hydrogenated
    names:
      en: [fully hydrogenated coconut oil, totally hydrogenated coconut oil, fully hydrogenated coconut fat]
      pl: [całkowicie utwardzony olej kokosowy, olej kokosowy całkowicie utwardzony, w pełni utwardzony olej kokosowy, olej kokosowy w pełni utwardzony, całkowicie uwodorniony olej kokosowy, olej kokosowy całkowicie uwodorniony, w pełni uwodorniony olej kokosowy, olej kokosowy w pełni uwodorniony, całkowicie utwardzony tłuszcz kokosowy, tłuszcz kokosowy całkowicie utwardzony, w pełni utwardzony tłuszcz kokosowy, tłuszcz kokosowy w pełni utwardzony, całkowicie uwodorniony tłuszcz kokosowy, tłuszcz kokosowy całkowicie uwodorniony, w pełni uwodorniony tłuszcz kokosowy, tłuszcz kokosowy w pełni uwodorniony]
      de: [vollständig gehärtetes Kokosöl, vollständig gehärtetes Kokosfett]
    process:
      en: "Coconut oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej kokosowy ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells: ['calkowicie (?:utwardzon|uwodorn)', 'w pelni (?:utwardzon|uwodorn)', 'fully hydrogenated', 'totally hydrogenated', 'vollstandig gehartet']
assertions:
  - code: origin.vegetable_oil_derived
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "A pressed vegetable oil; EU labelling requires its specific plant origin to be named."
      pl: "Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.refined
    variant: refined
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Refined, bleached and deodorised to remove coconut aroma/flavour."
      pl: "Rafinowany, odbarwiany i dezodoryzowany w celu usunięcia aromatu/smaku kokosa."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources: [{ id: reg-2019-649 }]
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
