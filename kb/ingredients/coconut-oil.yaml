summary:
  en: >-
    Oil pressed from the flesh (kernel) of the coconut, rich in lauric acid and solid below about 24°C.
    Despite the name, the coconut is a drupe, not a tree nut, and it is not on the EU's Annex II list of
    the fourteen regulated allergens (almonds, hazelnuts, walnuts, cashews, pecans, Brazil nuts, pistachios
    and macadamia nuts) — a coincidental naming, not a legal exemption from something it was ever in.
  pl: >-
    Olej wyciskany z miąższu (jądra) orzecha kokosowego, bogaty w kwas laurynowy, stały poniżej ok. 24°C.
    Wbrew nazwie kokos botanicznie to pestkowiec, nie orzech drzewny, i nie znajduje się na unijnej liście
    czternastu regulowanych alergenów z Załącznika II (migdały, orzechy laskowe, włoskie, nerkowca, pekan,
    brazylijskie, pistacje i makadamia) — to zbieżność nazwy, a nie prawne wyłączenie z czegoś, do czego
    nigdy nie należał.
