id: niacin
type: nutrient
names:
  en:
    - niacin
    - vitamin b3
    - niacinamide
  pl:
    - niacyna
    - witamina B3
    - witamina PP
  de:
    - Niacin
    - Vitamin B3
summary:
  en: >-
    Water-soluble vitamin B3, permitted for EU food fortification and food supplements in the forms of
    nicotinamide (niacinamide) and nicotinic acid. EFSA (2026) cites an upper level (UL) of 900 mg/day for
    nicotinamide.
  pl: >-
    Rozpuszczalna w wodzie witamina B3, dopuszczona w UE do wzbogacania żywności i suplementów diety w
    formach amidu kwasu nikotynowego (nikotynamidu) oraz kwasu nikotynowego. EFSA (2026) przywołuje górny
    tolerowany poziom spożycia (UL) wynoszący 900 mg/dobę dla nikotynamidu.
variants:
  - id: nicotinamide
    names:
      en:
        - nicotinamide
      pl:
        - amid kwasu nikotynowego
        - nikotynamid
      de:
        - Nicotinamid
    process:
      en: >-
        The amide form of vitamin B3 (niacinamide), permitted for EU food fortification and food supplements;
        EFSA (2026) cites an upper level (UL) of 900 mg/day for nicotinamide.
      pl: >-
        Forma amidowa witaminy B3 (nikotynamid), dopuszczona do wzbogacania żywności i suplementów diety w
        UE; EFSA (2026) przywołuje górny tolerowany poziom spożycia (UL) wynoszący 900 mg/dobę dla
        nikotynamidu.
    tells:
      - 'nicotinamid'
      - 'nikotynamid'
      - 'amid kwasu nikotynowego'
  - id: nicotinic-acid
    names:
      en:
        - nicotinic acid
      pl:
        - kwas nikotynowy
      de:
        - Nicotinsäure
    process:
      en: >-
        The free acid form of vitamin B3, permitted for EU food fortification and food supplements.
      pl: >-
        Forma wolnego kwasu witaminy B3, dopuszczona do wzbogacania żywności i suplementów diety w UE.
    tells:
      - 'nicotinic acid'
      - 'kwas nikotynow'
      - 'nicotinsaure'
assertions:
  - code: diet.vegan
    certainty: 'yes'
    kind: estimate
    grade: C
    note:
      en: >-
        Chemically defined vitamin B3 forms (nicotinic acid, nicotinamide) permitted in EU food fortification
        and supplements; no animal material in the synthetic forms.
      pl: >-
        Chemicznie zdefiniowane formy witaminy B3 (kwas nikotynowy, nikotynamid) dopuszczone do wzbogacania
        żywności i suplementów w UE; w formach syntetycznych nie wykorzystuje się surowców zwierzęcych.
    sources:
      - id: reg-1925-2006
      - id: dir-2002-46-annex2
  - code: health.high_dose_supplement_nutrient
    certainty: 'yes'
    kind: fact
    grade: A
    population: [general]
    note:
      en: >-
        EFSA (2026) cites an upper level (UL) of 900 mg/day for nicotinamide.
      pl: >-
        EFSA (2026) przywołuje górny tolerowany poziom spożycia (UL) wynoszący 900 mg/dobę dla nikotynamidu.
    sources:
      - id: efsa-nmn-2026
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Permitted vitamin in fortified foods (Reg 1925/2006 Annex I & II) and food supplements (Dir 2002/46/EC
        Annex II): nicotinic acid, nicotinamide (plus inositol hexanicotinate in supplements).
      pl: >-
        Witamina dopuszczona do wzbogacania żywności (Rozp. 1925/2006 Załącznik I i II) oraz suplementów diety
        (Dyr. 2002/46/WE Załącznik II): kwas nikotynowy, amid kwasu nikotynowego (w suplementach także
        heksanikotynian inozytolu).
    source: reg-1925-2006
reference_values:
  - type: UL
    value: 900
    unit: mg/day (nicotinamide)
    body: EFSA
    year: 2026
    source: efsa-nmn-2026
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    Only Europe PMC abstracts were opened for efsa-nmn-2026 (PMID 42125559) and nnr-niacin-2023 (PMID
    38187785), because the standalone SCF 2002 PDF returned HTTP 429 from food.ec.europa.eu. Accordingly only
    the 900 mg/day nicotinamide UL cited in the efsa-nmn-2026 abstract is recorded; the nicotinic-acid UL,
    flushing thresholds and body-weight-scaled qualifiers are omitted until the full primary text is opened.
  - >-
    No numerical priors assigned between nicotinamide and nicotinic acid: no market-share study was opened
    this session, though nicotinamide is standard in food fortification to avoid flushing.
