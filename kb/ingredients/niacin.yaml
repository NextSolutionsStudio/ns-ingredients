id: niacin
type: nutrient
names:
  en:
    - niacin
    - vitamin b3
    - niacinamide
  pl:
    - niacyna
    - witamina B3
    - witamina PP
  de:
    - Niacin
    - Vitamin B3
summary:
  en: >-
    Water-soluble vitamin B3, permitted for EU food fortification and supplements in the forms of
    nicotinamide (niacinamide) and nicotinic acid. While chemically related, the two forms differ sharply in
    their EU tolerable upper intake levels: the Scientific Committee on Food (2002) set 900 mg/day for
    nicotinamide and 10 mg/day for nicotinic acid because free nicotinic acid causes skin flushing at doses
    from 30 mg/day.
  pl: >-
    Rozpuszczalna w wodzie witamina B3, dopuszczona w UE do wzbogacania żywności i suplementów diety w
    formach amidu kwasu nikotynowego (nikotynamidu) oraz kwasu nikotynowego. Choć oba związki są pokrewne,
    różnią się znacznie górnymi tolerowanymi poziomami spożycia: Komitet Naukowy ds. Żywności (SCF, 2002)
    ustalił UL 900 mg/dobę dla nikotynamidu i 10 mg/dobę dla kwasu nikotynowego, ponieważ wolny kwas
    nikotynowy wywołuje zaczerwienienie skóry (flushing) już od dawek ok. 30 mg/dobę.
variants:
  - id: nicotinamide
    names:
      en:
        - nicotinamide
      pl:
        - amid kwasu nikotynowego
        - nikotynamid
      de:
        - Nicotinamid
    process:
      en: >-
        The amide form of vitamin B3 used in most fortified foods and multivitamins; does not produce the
        vasodilatory flushing caused by free nicotinic acid.
      pl: >-
        Forma amidowa witaminy B3 stosowana w większości żywności wzbogacanej i preparatów wielowitaminowych;
        nie wywołuje rozszerzenia naczyń (flushingu) typowego dla wolnego kwasu nikotynowego.
    tells:
      - 'nicotinamid'
      - 'nikotynamid'
      - 'amid kwasu nikotynowego'
  - id: nicotinic-acid
    names:
      en:
        - nicotinic acid
      pl:
        - kwas nikotynowy
      de:
        - Nicotinsäure
    process:
      en: >-
        The free acid form of vitamin B3; higher supplemental doses (30-1000 mg/day) can trigger skin
        flushing.
      pl: >-
        Forma wolnego kwasu witaminy B3; wyższe dawki suplementowe (30-1000 mg/dobę) mogą powodować
        zaczerwienienie skóry (flushing).
    tells:
      - 'nicotinic acid'
      - 'kwas nikotynow'
      - 'nicotinsaure'
assertions:
  - code: diet.vegan
    certainty: 'yes'
    kind: estimate
    grade: C
    note:
      en: >-
        Chemically defined vitamin B3 forms (nicotinic acid, nicotinamide) permitted in EU food fortification
        and supplements; no animal material in the synthetic forms.
      pl: >-
        Chemicznie zdefiniowane formy witaminy B3 (kwas nikotynowy, nikotynamid) dopuszczone do wzbogacania
        żywności i suplementów w UE; w formach syntetycznych nie wykorzystuje się surowców zwierzęcych.
    sources:
      - id: reg-1925-2006
      - id: dir-2002-46-annex2
  - code: health.high_dose_supplement_nutrient
    certainty: 'yes'
    kind: fact
    grade: A
    population: [general]
    note:
      en: >-
        The EU Scientific Committee on Food (2002) set separate adult tolerable upper intake levels: 900 mg/day
        (12.5 mg/kg bw/day, excluding pregnancy/lactation) for nicotinamide and 10 mg/day for free nicotinic
        acid (based on skin flushing observed from 30 mg/day).
      pl: >-
        Komitet Naukowy ds. Żywności UE (SCF, 2002) ustalił odrębne górne tolerowane poziomy spożycia dla
        dorosłych: 900 mg/dobę (12,5 mg/kg m.c./dobę, z wyłączeniem ciąży i laktacji) dla nikotynamidu oraz
        10 mg/dobę dla wolnego kwasu nikotynowego (na podstawie zaczerwienienia skóry od 30 mg/dobę).
    sources:
      - id: efsa-nmn-2026
        locator: Section 1.2
      - id: nnr-niacin-2023
        locator: Upper intake levels and toxicity
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Permitted vitamin in fortified foods (Reg 1925/2006 Annex I & II) and food supplements (Dir 2002/46/EC
        Annex II): nicotinic acid, nicotinamide (plus inositol hexanicotinate in supplements).
      pl: >-
        Witamina dopuszczona do wzbogacania żywności (Rozp. 1925/2006 Załącznik I i II) oraz suplementów diety
        (Dyr. 2002/46/WE Załącznik II): kwas nikotynowy, amid kwasu nikotynowego (w suplementach także
        heksanikotynian inozytolu).
    source: reg-1925-2006
reference_values:
  - type: UL
    value: 900
    unit: mg/day (nicotinamide)
    body: SCF
    year: 2002
    source: efsa-nmn-2026
  - type: UL
    value: 10
    unit: mg/day (nicotinic acid)
    body: SCF
    year: 2002
    source: nnr-niacin-2023
review_status: draft
provenance: ai-drafted
review_notes:
  - >-
    SCF (2002) figures are cited through EFSA (2026, PMC13158811) and the NNR 2023 scoping review
    (PMC10770643), both opened in full, because the standalone SCF 2002 PDF returned HTTP 429 from
    food.ec.europa.eu.
  - >-
    No numerical priors assigned between nicotinamide and nicotinic acid: no market-share study was opened
    this session, though nicotinamide is standard in food fortification to avoid flushing.
