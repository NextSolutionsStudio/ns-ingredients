summary:
  en: >-
    Oil pressed from the kernel (seed) inside the fruit of the oil palm — a different product from palm
    oil (which comes from the fruit's fleshy mesocarp), sharing the same tree and the same land-use
    footprint. Its fatty-acid profile is closer to coconut oil than to palm oil: rich in lauric and myristic
    acid, so it is solid at room temperature and is a common feedstock for cocoa-butter substitutes and for
    fractionated MCT oil.
  pl: >-
    Olej wyciskany z jądra (pestki) znajdującego się wewnątrz owocu palmy olejowej — inny produkt niż olej
    palmowy (który powstaje z miękkiego miąższu owocu), pochodzący z tego samego drzewa i wiążący się z tym
    samym śladem gruntowym. Profil kwasów tłuszczowych jest bliższy olejowi kokosowemu niż olejowi
    palmowemu: bogaty w kwas laurynowy i mirystynowy, stąd stały w temperaturze pokojowej i częsty surowiec
    do zamienników masła kakaowego oraz do frakcjonowanego oleju MCT.
