id: palm-kernel-oil
type: fat
names:
  en: [palm kernel oil]
  pl: [olej z ziaren palmowych, tłuszcz z ziaren palmowych, olej z nasion palmowych, olej palmowy z ziaren]
  de: [Palmkernöl]
summary:
  en: >-
    Oil pressed from the kernel (seed) inside the fruit of the oil palm — a different product from palm
    oil (which comes from the fruit's fleshy mesocarp), sharing the same tree and the same land-use
    footprint. Its fatty-acid profile is closer to coconut oil than to palm oil: rich in lauric and myristic
    acid, so it is solid at room temperature and is a common feedstock for cocoa-butter substitutes and for
    fractionated MCT oil.
  pl: >-
    Olej wyciskany z jądra (pestki) znajdującego się wewnątrz owocu palmy olejowej — inny produkt niż olej
    palmowy (który powstaje z miękkiego miąższu owocu), pochodzący z tego samego drzewa i wiążący się z tym
    samym śladem gruntowym. Profil kwasów tłuszczowych jest bliższy olejowi kokosowemu niż olejowi
    palmowemu: bogaty w kwas laurynowy i mirystynowy, stąd stały w temperaturze pokojowej i częsty surowiec
    do zamienników masła kakaowego oraz do frakcjonowanego oleju MCT.
variants:
  - id: hydrogenated
    names:
      en: [hydrogenated palm kernel oil, hydrogenated palm kernel fat]
      pl: [utwardzony olej z ziaren palmowych, olej z ziaren palmowych utwardzony, uwodorniony olej z ziaren palmowych, olej z ziaren palmowych uwodorniony, utwardzony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych utwardzony, uwodorniony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych uwodorniony, utwardzony olej z nasion palmowych, olej z nasion palmowych utwardzony, uwodorniony olej z nasion palmowych, olej z nasion palmowych uwodorniony, utwardzony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych utwardzony, uwodorniony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych uwodorniony]
      de: [gehärtetes Palmkernöl, gehärtetes Palmkernfett]
    process:
      en: "Palm kernel oil or fat hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej lub tłuszcz z ziaren palmowych utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells: ['(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!nie )(?<!partially )(?<!fully )(?<!totally )(?<!non )(?<!teilweise )(?<!vollstandig )(?<!nicht )\b(?:utwardzon|uwodorn|hydrogenated|gehartet)']
  - id: partially-hydrogenated
    names:
      en: [partially hydrogenated palm kernel oil, partially hydrogenated palm kernel fat]
      pl: [częściowo utwardzony olej z ziaren palmowych, olej z ziaren palmowych częściowo utwardzony, częściowo uwodorniony olej z ziaren palmowych, olej z ziaren palmowych częściowo uwodorniony, częściowo utwardzony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych częściowo utwardzony, częściowo uwodorniony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych częściowo uwodorniony, częściowo utwardzony olej z nasion palmowych, olej z nasion palmowych częściowo utwardzony, częściowo uwodorniony olej z nasion palmowych, olej z nasion palmowych częściowo uwodorniony, częściowo utwardzony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych częściowo utwardzony, częściowo uwodorniony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych częściowo uwodorniony]
      de: [teilweise gehärtetes Palmkernöl, teilweise gehärtetes Palmkernfett]
    process:
      en: "Palm kernel oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej z ziaren palmowych, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells: ['czesciowo (?:utwardzon|uwodorn)', 'partially hydrogenated', 'teilweise gehartet']
  - id: fully-hydrogenated
    names:
      en: [fully hydrogenated palm kernel oil, totally hydrogenated palm kernel oil, fully hydrogenated palm kernel fat]
      pl: [całkowicie utwardzony olej z ziaren palmowych, olej z ziaren palmowych całkowicie utwardzony, w pełni utwardzony olej z ziaren palmowych, olej z ziaren palmowych w pełni utwardzony, całkowicie uwodorniony olej z ziaren palmowych, olej z ziaren palmowych całkowicie uwodorniony, w pełni uwodorniony olej z ziaren palmowych, olej z ziaren palmowych w pełni uwodorniony, całkowicie utwardzony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych całkowicie utwardzony, w pełni utwardzony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych w pełni utwardzony, całkowicie uwodorniony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych całkowicie uwodorniony, w pełni uwodorniony tłuszcz z ziaren palmowych, tłuszcz z ziaren palmowych w pełni uwodorniony, całkowicie utwardzony olej z nasion palmowych, olej z nasion palmowych całkowicie utwardzony, w pełni utwardzony olej z nasion palmowych, olej z nasion palmowych w pełni utwardzony, całkowicie uwodorniony olej z nasion palmowych, olej z nasion palmowych całkowicie uwodorniony, w pełni uwodorniony olej z nasion palmowych, olej z nasion palmowych w pełni uwodorniony, całkowicie utwardzony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych całkowicie utwardzony, w pełni utwardzony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych w pełni utwardzony, całkowicie uwodorniony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych całkowicie uwodorniony, w pełni uwodorniony tłuszcz z nasion palmowych, tłuszcz z nasion palmowych w pełni uwodorniony]
      de: [vollständig gehärtetes Palmkernöl, vollständig gehärtetes Palmkernfett]
    process:
      en: "Palm kernel oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej z ziaren palmowych ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells: ['calkowicie (?:utwardzon|uwodorn)', 'w pelni (?:utwardzon|uwodorn)', 'fully hydrogenated', 'totally hydrogenated', 'vollstandig gehartet']
assertions:
  - code: ethics.palm_oil
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "A palm derivative in scope of the EU deforestation regulation, on the same footing as palm oil itself."
      pl: "Derywat palmowy objęty unijnym rozporządzeniem o wylesianiu, na tych samych zasadach co sam olej palmowy."
    sources: [{ id: reg-2023-1115 }]
  - code: origin.vegetable_oil_derived
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "A pressed vegetable oil; EU labelling requires its specific plant origin to be named."
      pl: "Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, point 8" }]
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources: [{ id: reg-2019-649 }]
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: yes
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources: [{ id: reg-1169-2011, locator: "Annex VII Part A, points 8 and 9" }]
review_status: draft
provenance: ai-drafted
review_notes:
  - "Kept this entry simple (no refined/unrefined variant, unlike palm-oil and coconut-oil) since food-grade palm kernel oil is almost always sold refined/fractionated; a variant can be added if a real label shows otherwise."
