summary:
  en: >-
    Vegetable oil pressed from pecan nuts (Carya illinoinensis). As a product derived from pecan nuts, it falls
    under EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z orzechów pekan (Carya illinoinensis). Jako produkt pochodzący z orzechów pekan podlega
    obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
