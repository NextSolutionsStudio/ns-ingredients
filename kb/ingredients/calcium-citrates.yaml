id: calcium-citrates
type: additive
e_number: E333
names:
  en:
    - calcium citrates
    - calcium citrate
    - tricalcium citrate
    - monocalcium citrate
  pl:
    - cytryniany wapnia
    - cytrynian wapnia
    - cytrynian triwapniowy
    - cytrynian monowapniowy
  de:
    - Calciumcitrate
    - Calciumcitrat
    - Tricalciumcitrat
functions:
  - acidity-regulator
  - firming-agent
  - sequestrant
summary:
  en: >-
    Mono-, di- and tricalcium salts of citric acid (E 333(i)–(iii)), used as acidity regulators and firming
    agents, and as a calcium source.
  pl: >-
    Mono-, di- i triwapniowe sole kwasu cytrynowego (E 333(i)–(iii)), stosowane jako regulatory kwasowości i
    substancje wiążące oraz jako źródło wapnia.
assertions:
  - code: origin.microbial_fermentation
    certainty: yes
    kind: estimate
    grade: B
    note:
      en: "Reg (EU) No 231/2012 defines E 333 as calcium salts of citric acid (E 330), and defines E 330 as produced from lemon/pineapple juice or Candida / Aspergillus niger fermentation; commercial citric acid is overwhelmingly fermentation-derived."
      pl: "Rozporządzenie (UE) nr 231/2012 definiuje E 333 jako sole wapniowe kwasu cytrynowego (E 330), a E 330 jako wytwarzany z soku z cytryny/ananasa lub przez fermentację Candida / Aspergillus niger; handlowy kwas cytrynowy pochodzi niemal wyłącznie z fermentacji."
    sources:
      - { id: reg-231-2012, locator: "E 333 / E 330 (Definition)" }
      - { id: col-latif-2025-citric-acid }
  - code: origin.plant
    certainty: maybe
    kind: fact
    grade: A
    note:
      en: "Reg (EU) No 231/2012 permits parent citric acid (E 330) to be obtained from lemon or pineapple juice, though this route is commercially minor."
      pl: "Rozporządzenie (UE) nr 231/2012 dopuszcza pozyskiwanie wyjściowego kwasu cytrynowego (E 330) z soku z cytryny lub ananasa, choć ta ścieżka ma marginalne znaczenie handlowe."
    sources: [{ id: reg-231-2012, locator: "E 333 / E 330 (Definition)" }]
regulatory:
  - jurisdiction: EU
    status: authorised
    conditions:
      en: >-
        Group I additive (Reg 1333/2008 Annex II Part C, as set by Reg 1129/2011): quantum satis in most food
        categories.
      pl: >-
        Dodatek grupy I (rozporządzenie 1333/2008, załącznik II część C, w brzmieniu rozporządzenia
        1129/2011): quantum satis w większości kategorii żywności.
    source: swm-reg-1129-2011
review_status: draft
provenance: ai-drafted
review_notes:
  - 'Identity-only: no EFSA re-evaluation of E 333 was found.'
