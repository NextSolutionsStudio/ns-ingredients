assertions:
  - code: origin.plant
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Obtained from soybean seeds (Reg (EU) No 1169/2011 Annex VII Part A point 8)."
      pl: "Pozyskiwany z nasion soi (Rozp. (UE) nr 1169/2011 Załącznik VII część A pkt 8)."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, point 8"
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Plant seed oil pressed or extracted from soybeans."
      pl: "Olej z nasion roślinnych wytłaczany lub ekstrahowany z soi."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, point 8"
  - code: origin.gmo_derived
    certainty: maybe
    kind: estimate
    grade: B
    note:
      en: >-
        Soybean is tracked in the USDA ERS series 'Adoption of Genetically Engineered Crops in the United
        States' (herbicide-tolerant and insect-resistant varieties); non-GM supplies also exist and an
        ingredient list does not show origin.
      pl: >-
        Soja jest ujęta w serii USDA ERS „Adoption of Genetically Engineered Crops in the United States”
        (odmiany odporne na herbicydy i owady); istnieją też surowce non-GM, a wykaz składników nie wskazuje
        pochodzenia.
    sources:
      - id: usda-ers-ge-2025
  - code: allergen.soybeans
    variant: unrefined
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: >-
        Unrefined or cold-pressed soybean oil is not exempted under Reg (EU) No 1169/2011 Annex II point 6(a)
        and can retain allergenic soy proteins.
      pl: >-
        Nierafinowany lub tłoczony na zimno olej sojowy nie jest wyłączony na mocy Rozp. (UE) nr 1169/2011
        Załącznik II pkt 6(a) i może zawierać alergenne białka soi.
    sources:
      - id: reg-1169-2011
        locator: "Annex II, point 6(a)"
  - code: allergen.soybeans
    variant: fully-refined
    certainty: 'no'
    kind: fact
    grade: A
    note:
      en: "Fully refined soybean oil and fat are explicitly exempted from soy allergen declaration under Reg (EU) No 1169/2011 Annex II point 6(a)."
      pl: "W pełni rafinowany olej i tłuszcz sojowy są wprost wyłączone z deklaracji alergenu soi na mocy Rozp. (UE) nr 1169/2011 Załącznik II pkt 6(a)."
    sources:
      - id: reg-1169-2011
        locator: "Annex II, point 6(a)"
  - code: allergen.soybeans
    variant: hydrogenated
    certainty: maybe
    kind: fact
    grade: A
    note:
      en: "Hydrogenation does not show full refining under Reg (EU) No 1169/2011 Annex II point 6(a), so soy allergen presence remains possible."
      pl: "Utwardzanie nie wykazuje pełnej rafinacji w rozumieniu Rozp. (UE) nr 1169/2011 Załącznik II pkt 6(a), więc obecność alergenu soi pozostaje możliwa."
    sources:
      - id: reg-1169-2011
        locator: "Annex II, point 6(a)"
  - code: allergen.soybeans
