        - kaltgepresstes Sojaöl
    process:
      en: "Unrefined, crude or cold-pressed soybean oil that has not undergone full RBD refining and can retain allergenic soy proteins."
      pl: "Nierafinowany, surowy lub tłoczony na zimno olej sojowy, który nie przeszedł pełnej rafinacji (RBD) i może zawierać alergenne białka soi."
    tells:
      - '\bnierafinowan'
      - 'tloczon\w*\s+na\s+zimno'
      - '\bzimnotloczon'
      - '\bsurow\w*\s+olej\s+sojow'
      - '\bunrefined\b'
      - '\bcold\s+pressed'
      - '\bvirgin\b'
      - '\bcrude\s+soy'
      - '\bunraffiniert'
      - '\bkaltgepresst'
    prior: 0.5
    prior_rationale:
      en: "Conservative safety prior when the label omits refining status: Reg (EU) No 1169/2011 Annex II point 6(a) exempts only fully refined soybean oil, so an unlabelled 'soybean oil' cannot be assumed protein-free."
      pl: "Ostrożnościowy priorytet bezpieczeństwa, gdy etykieta nie podaje stopnia rafinacji: Rozp. (UE) nr 1169/2011 Załącznik II pkt 6(a) zwalnia wyłącznie w pełni rafinowany olej sojowy, więc przy samym zapisie 'olej sojowy' nie można wykluczyć białek soi."
  - id: fully-refined
    process:
      en: "Fully refined (degummed, neutralised, bleached and deodorised), removing soybean proteins."
      pl: "W pełni rafinowany (odgumowany, odkwaszony, odbarwiany i dezodoryzowany), co usuwa białka soi."
    tells:
