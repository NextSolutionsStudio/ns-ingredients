review_notes:
  - "Allergen scoped to variants (option a): unrefined carries allergen.soybeans: yes with prior 0.5 (conservative safety prior, downgraded to maybe for silent labels like 'olej sojowy'), fully-refined carries allergen.soybeans: no with prior 0.45 so explicit refined labels resolve without a soy allergen flag, and hydrogenated / partially-hydrogenated / fully-hydrogenated carry allergen.soybeans: maybe because hydrogenation does not establish full refining under Reg (EU) No 1169/2011 Annex II point 6(a)."
  - "Policy (B), 2026-11-17 (pc-opus, Sol 6.1 on #10 at f1a6e25): a name that states full refining with hydrogenation, in either word order, sits on a *-fully-refined variant with allergen.soybeans: no (Annex II point 6(a)) and the same hydrogenation assertions; plain 'refined' stays on the hydrogenation variants, soy maybe."
