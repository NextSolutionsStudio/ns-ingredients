      - '^(?:(?:nie ?utwardzony|nie ?uwodorniony) )?(?:olej|tluszcz)(?: roslinny)? (?:sojowy|z soi|z ziaren soi|z nasion soi|z ziarna soi|z fasoli sojowej)(?: (?:nie ?utwardzony|nie ?uwodorniony))? (?:(?:w pelni|calkowicie) )?rafinowany(?: (?:nie ?utwardzony|nie ?uwodorniony|nie (?:czesciowo|calkowicie|w pelni) (?:utwardzony|uwodorniony)|bez gmo|wolny od gmo|nie zawiera gmo|niemodyfikowany genetycznie))*$'
      - '^(?:(?:non hydrogenated|unhydrogenated|not hydrogenated) )?(?:(?:fully|totally) )?refined (?:(?:non hydrogenated|unhydrogenated|not hydrogenated) )?soy(?:bean|a)? oil(?: (?:(?:not|non) (?:partially |fully |totally )?hydrogenated|unhydrogenated|non gmo|gmo free|not genetically modified|without gmo|free from gmo))*$'
      - '^soy(?:bean|a)? oil (?:(?:fully|totally) )?refined(?: (?:(?:not|non) (?:partially |fully |totally )?hydrogenated|unhydrogenated|non gmo|gmo free|not genetically modified|without gmo|free from gmo))*$'
      - '^(?:voll)?raffiniertes? soja ?ol(?: (?:nicht gehartet|ungehartet|ohne gentechnik|gentechnikfrei))*$'
