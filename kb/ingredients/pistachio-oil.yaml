summary:
  en: >-
    Vegetable oil pressed from pistachio nuts (Pistacia vera). As a product derived from pistachio nuts, it falls
    under EU Annex II item 8 tree-nut allergen labelling without an Annex II exemption.
  pl: >-
    Olej roślinny tłoczony z pistacji (Pistacia vera). Jako produkt pochodzący z pistacji podlega
    obowiązkowi deklarowania alergenu z Aneksu II UE (punkt 8) i nie jest z niego wyłączony.
