summary:
  en: >-
    A label term for oil from nuts that does not name the nut. In Polish, "olej orzechowy" is used both for
    peanut oil and for oil from tree nuts such as walnuts, so the name alone does not show which Annex II
    allergen applies.
  pl: >-
    Określenie z etykiety oznaczające olej z orzechów bez wskazania, z jakich. Po polsku "olej orzechowy" bywa
    nazwą oleju arachidowego i oleju z orzechów (np. włoskich), więc sama nazwa nie pokazuje, który alergen z
    Aneksu II UE dotyczy produktu.
variants:
  - id: source-not-named
    process:
      en: "A nut oil whose label names no nut: peanut or a tree nut are both possible. A named nut outside Annex II (pine nut, coconut) is not this variant."
      pl: "Olej orzechowy, którego etykieta nie podaje orzecha: możliwe są zarówno orzeszki ziemne, jak i orzechy. Orzech spoza Aneksu II (piniowy, kokosowy) to nie ten wariant."
    tells: ['^(?!.*(?:piniow|\bpinii|cedrow|\bpine\b|\bcedar\b|pinien|zirbel|zeder|kokos|kasztan|tygrys|\bshea\b|coconut|chestnut|tiger ?nut|kastanie|erdmandel|migdal\w* ziemn|earth almond|\bchufa|\bcibor|tigernus|\bcyperus|\bpinus|\bcocos\b|\bpinon|\bpignol|muszkat|nutmeg|muskat|\bkola\b|hickory|\bcarya\b|\bjuglans\b|\bcorylus\b|\bpistacia\b|\banacardium\b|\bpili\b|canarium|kukui|candlenut|aleurites|baobab|argan|moringa|sacha inchi|plukenetia|marula|sclerocarya|mongongo|babassu|ginkgo|areca|\bbetel|beech ?nut|bukiew|\bbukow|bucheckern|eichel|zoladz|zoledz|acorn|butternut|heartnut))(?!.*(?:orzech\w* (?:wlosk|lasko|nerkow|brazylij|pekan|makadami|queensland)|\bmigdal(?!\w* ziemn)|\bpistacj|\bmakadami|\bpekan|\bnerkow|\blaskow|\bwlosk|\bbrazylij|\bwalnut|\bhazelnut|\bfilbert|(?<!earth )\balmond|\bcashew|\bpistachio|\bmacadamia|\bpecan|\bbrazil nut|\bqueensland|\bmandel|haselnus|walnus|paranus|pistazi|\bcobnut|juglans regia|corylus avellana|\bamygdal|prunus dulcis|anacardium occidentale|carya illino|\bbertholletia|pistacia vera))(?!.*(?:orzeszk\w* ziemn|orzech\w* ziemn|(?<!migdal\w* )\bziemn(?:e|ych|y|a|ymi)\b|\barachid|\barachis|\bpeanut|\bground ?nut|\bmonkey ?nut|fistaszk|erdnus)).+']
  - id: tree-nut-named
    process:
      en: "A nut oil whose label names a tree nut as its source (in the name or in brackets)."
      pl: "Olej orzechowy, którego etykieta podaje orzech jako źródło (w nazwie lub w nawiasie)."
    tells: ['(?:orzech\w* (?:wlosk|lasko|nerkow|brazylij|pekan|makadami|queensland)|\bmigdal(?!\w* ziemn)|\bpistacj|\bmakadami|\bpekan|\bnerkow|\blaskow|\bwlosk|\bbrazylij|\bwalnut|\bhazelnut|\bfilbert|(?<!earth )\balmond|\bcashew|\bpistachio|\bmacadamia|\bpecan|\bbrazil nut|\bqueensland|\bmandel|haselnus|walnus|paranus|pistazi|\bcobnut|juglans regia|corylus avellana|\bamygdal|prunus dulcis|anacardium occidentale|carya illino|\bbertholletia|pistacia vera)']
  - id: peanut-named
    process:
      en: "A nut oil whose label names peanuts as its source (in the name or in brackets)."
      pl: "Olej orzechowy, którego etykieta podaje orzeszki ziemne jako źródło (w nazwie lub w nawiasie)."
    tells: ['(?:orzeszk\w* ziemn|orzech\w* ziemn|(?<!migdal\w* )\bziemn(?:e|ych|y|a|ymi)\b|\barachid|\barachis|\bpeanut|\bground ?nut|\bmonkey ?nut|fistaszk|erdnus)']
  - id: hydrogenated
    process:
      en: "Nut oil hardened by hydrogenation; the label does not specify partial or full hydrogenation."
      pl: "Olej orzechowy utwardzony przez uwodornienie; etykieta nie precyzuje, czy utwardzenie jest częściowe czy całkowite."
    tells:
      - '(?<!czesciowo )(?<!calkowicie )(?<!w pelni )(?<!partially )(?<!fully )(?<!totally )(?<!teilweise )(?<!vollstandig )(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )\b(?:utwardzon|uwodornion|utwardzan[yea]\b|uwodornian[yea]\b|hydrogenated|gehartet)|(?<!\b(?:nie|ani|bez|brak|not|no|without|ohne|nicht|free)(?: (?:jest|sa|byl\w*|zosta\w*))? )\b(?:po|podda\w*|podlega\w*)(?: (?!(?:nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b)\S+){0,3}? (?:uwodornieni|uwodornian|utwardzeni|utwardzan)'
  - id: partially-hydrogenated
    process:
      en: "Nut oil in which some, not all, double bonds have been hydrogenated, which forms industrial trans fatty acids."
      pl: "Olej orzechowy, w którym utwardzono część, nie wszystkie, wiązania podwójne, co tworzy przemysłowe kwasy tłuszczowe trans."
    tells:
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )czesciowo (?:utwardzon|uwodorn)'
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )partially hydrogenated'
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )teilweise gehartet'
  - id: fully-hydrogenated
    process:
      en: "Nut oil with all double bonds hydrogenated: fully saturated, with essentially no trans fat."
      pl: "Olej orzechowy ze wszystkimi wiązaniami podwójnymi utwardzonymi: w pełni nasycony, praktycznie bez tłuszczów trans."
    tells:
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )calkowicie (?:utwardzon|uwodorn)'
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )w pelni (?:utwardzon|uwodorn)'
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )fully hydrogenated'
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )totally hydrogenated'
      - '(?<!\b(?:niepodda\w*|niepodleg\w*|nie|ani|bez|brak|not|no|without|ohne|nicht|free)\b(?! (?:z |ze |od )?(?:gmo|gm|genetycz\w*|modyfik\w*)\b)(?: \S+)* )(?<!\bnon )vollstandig gehartet'
assertions:
  - code: origin.vegetable_oil_derived
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: A pressed vegetable oil; EU labelling requires its specific plant origin to be named.
      pl: Wyciskany olej roślinny; przepisy UE o etykietowaniu wymagają podania jego konkretnego pochodzenia rośliny.
    sources:
      - id: reg-1169-2011
        locator: Annex VII Part A, point 8
  - code: processing.hydrogenated
    variant: hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares hydrogenation without specifying partial or full, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje utwardzenie (bez wskazania, czy częściowe, czy całkowite), czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: processing.hydrogenated
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares partial hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje częściowe utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: health.trans_fat_source
    variant: partially-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "Partial hydrogenation is the main industrial source of trans fat; EU food sold to consumers is capped at 2 g trans fat per 100 g of fat."
      pl: "Częściowe utwardzanie jest głównym przemysłowym źródłem tłuszczów trans; żywność sprzedawana konsumentom w UE ma limit 2 g tłuszczów trans na 100 g tłuszczu."
    sources:
      - id: reg-2019-649
  - code: processing.hydrogenated
    variant: fully-hydrogenated
    certainty: 'yes'
    kind: fact
    grade: A
    note:
      en: "The label declares full hydrogenation, as EU law requires for a hydrogenated oil or fat."
      pl: "Etykieta deklaruje całkowite utwardzenie, czego prawo UE wymaga dla utwardzonego oleju lub tłuszczu."
    sources:
      - id: reg-1169-2011
        locator: "Annex VII Part A, points 8 and 9"
  - code: allergen.peanuts
    variant: source-not-named
    certainty: maybe
    kind: estimate
    grade: C
    note:
      en: "The Food-Info Polish allergy dictionary lists 'olej orzechowy' as peanut oil; the same name is also used for tree-nut oil, so peanut is possible but not shown (Annex II item 5)."
      pl: "Słownik alergenów Food-Info podaje 'olej orzechowy' jako olej arachidowy; ta sama nazwa bywa używana dla oleju z orzechów, więc orzeszki ziemne są możliwe, ale nie wykazane (Aneks II, punkt 5)."
