    licence: "CC BY-SA 4.0"
    accessed: 2026-09-27
    note: "States virtually all of the world's sorbic acid (from which potassium sorbate is made by neutralisation with potassium hydroxide) is manufactured synthetically, via condensation of crotonaldehyde and ketene, rather than extracted from rowan berries."
  - id: col-fda-cfr-73-575-tio2
    type: regulation
    title: "21 CFR 73.575 — Titanium dioxide"
    publisher: "U.S. Food and Drug Administration — Code of Federal Regulations"
    url: https://www.law.cornell.edu/cfr/text/21/73.575
    licence: "U.S. Government work — public domain"
    accessed: 2026-09-27
    note: "Lists titanium dioxide as a colour additive exempt from certification for food use in the US, capped at not more than 1% by weight of the food; remains authorised there, unlike the EU (Reg 2022/63)."
