      1420), acetylated distarch adipate (E 1422), hydroxypropyl starch (E 1440), hydroxypropyl distarch
      phosphate (E 1442), starch sodium octenyl succinate (E 1450), acetylated oxidised starch (E 1451) and
      starch aluminium octenyl succinate (E 1452) as food additives
    publisher: European Food Safety Authority
    year: 2017
    url: 'https://doi.org/10.2903/j.efsa.2017.4911'
    doi: 10.2903/j.efsa.2017.4911
    pmid: '32625282'
    licence: 'EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)'
    accessed: '2026-11-15'
    note: Abstract opened via Europe PMC. No safety concern at reported uses; no need for a numerical ADI.
  - id: wikipedia-vinegar
    type: reference
    title: Vinegar
    publisher: Wikipedia
    url: 'https://en.wikipedia.org/wiki/Vinegar'
    licence: CC BY-SA 4.0
    accessed: '2026-11-15'
    note: >-
      Production: ethanol converted to acetic acid by acetic acid bacteria; cider vinegar from cider or apple
