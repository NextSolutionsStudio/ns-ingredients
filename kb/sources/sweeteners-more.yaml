- id: swm-reg-231-2012
  type: regulation
  title: Regulation (EU) No 231/2012 — additive specifications
  publisher: European Union
  year: 2012
  url: https://eur-lex.europa.eu/eli/reg/2012/231/oj
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: 'Annex: manufacturing definitions for E421(i)/(ii), E953, E957, E959, E961, E962 and E966. Opened copy:
    https://www.legislation.gov.uk/eur/2012/231/pdfs/eur_20120231_adopted_en.pdf'
- id: swm-reg-1169-2011
  type: regulation
  title: Regulation (EU) No 1169/2011 — Annex III labelling
  publisher: European Union
  year: 2011
  url: https://eur-lex.europa.eu/eli/reg/2011/1169/oj
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: 'Annex III 2.3 expressly includes aspartame-acesulfame salt; 2.4 concerns foods with more than 10%
    added polyols. Opened copy: https://www.legislation.gov.uk/eur/2011/1169/pdfs/eur_20111169_adopted_en.pdf'
- id: swm-reg-1129-2011
  type: regulation
  title: Regulation (EU) No 1129/2011 — Union list of additives
  publisher: European Union
  year: 2011
  url: https://eur-lex.europa.eu/eli/reg/2011/1129/oj
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: 'Annex establishes Annex II to Regulation 1333/2008, including the sweeteners list and category conditions.
    Historical authorising instrument; subsequent amendments are not exhaustively transcribed. Opened copy:
    https://www.legislation.gov.uk/eur/2011/1129/pdfs/eur_20111129_adopted_en.pdf'
- id: swm-reg-497-2014
  type: regulation
  title: Regulation (EU) No 497/2014 — advantame authorisation and specification
  publisher: European Union
  year: 2014
  url: https://eur-lex.europa.eu/eli/reg/2014/497/oj
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: 'Annex I authorises E969 in listed categories; Annex II describes three-step chemical synthesis and
    CAS 714229-20-6. Opened copy: https://www.legislation.gov.uk/eur/2014/497/pdfs/eur_20140497_adopted_en.pdf'
- id: swm-reg-1049-2012
  type: regulation
  title: Regulation (EU) No 1049/2012 — polyglycitol syrup
  publisher: European Union
  year: 2012
  url: https://eur-lex.europa.eu/eli/reg/2012/1049/oj
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: 'E964 authorisation in specified foods, including confectionery and chewing gum, with category limits.
