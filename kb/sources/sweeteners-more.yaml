- id: swm-fda-sweeteners
  type: reference
  title: Aspartame and Other Sweeteners in Food
  publisher: US Food and Drug Administration
  url: https://www.fda.gov/food/food-additives-petitions/aspartame-and-other-sweeteners-food
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: US status of advantame, neotame, saccharin and thaumatin; permits sugar alcohols including mannitol
    and lactitol. Thaumatin notices received no questions; this is not food additive approval.
- id: swm-fda-high-intensity
  type: reference
  title: High-Intensity Sweeteners
  publisher: US Food and Drug Administration
  year: 2014
  url: https://www.fda.gov/food/food-additives-petitions/high-intensity-sweeteners
  licence: Facts cited; source text not reproduced or adapted
  accessed: '2026-10-26'
  note: FDA explicitly prohibits cyclamates and their salts in US food.
- id: swm-efsa-advantame-2013
  type: regulatory_opinion
  title: Scientific Opinion on the safety of advantame for the proposed uses as a food additive
  publisher: European Food Safety Authority
  year: 2013
  url: https://doi.org/10.2903/j.efsa.2013.3301
  licence: EFSA Journal ? CC BY-ND 4.0; facts cited, no text reproduced or adapted
  accessed: '2026-10-26'
  note: 'ADI 5 mg/kg body weight/day. Opened copy: https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2013.3301'
  doi: 10.2903/j.efsa.2013.3301
- id: swm-efsa-neotame-2025
  type: regulatory_opinion
  title: Re-evaluation of neotame (E 961) as food additive
  publisher: European Food Safety Authority
  year: 2025
  url: https://doi.org/10.2903/j.efsa.2025.9480
  licence: EFSA Journal ? CC BY-ND 4.0; facts cited, no text reproduced or adapted
  accessed: '2026-10-26'
  note: 'ADI 10 mg/kg body weight/day replaces 2 mg/kg from 2007; confirms EU authorisation. Opened copy: https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2025.9480'
  doi: 10.2903/j.efsa.2025.9480
- id: swm-efsa-saccharin-2024
  type: regulatory_opinion
  title: Re-evaluation of saccharin and its sodium, potassium and calcium salts (E 954) as food additives
  publisher: European Food Safety Authority
  year: 2024
  url: https://doi.org/10.2903/j.efsa.2024.9044
  licence: EFSA Journal ? CC BY-ND 4.0; facts cited, no text reproduced or adapted
  accessed: '2026-10-26'
  note: 'ADI 9 mg/kg body weight/day expressed as free imide. Manufacturing routes differ; assessment supported
    Remsen-Fahlberg products, with insufficient impurity data for the Maumee route. CAS identifiers refer to
    individual forms. Opened copy: https://efsa.onlinelibrary.wiley.com/doi/full/10.2903/j.efsa.2024.9044'
  doi: 10.2903/j.efsa.2024.9044
- id: swm-efsa-thaumatin-2021
  type: regulatory_opinion
  title: Re-evaluation of thaumatin (E 957) as food additive
  publisher: European Food Safety Authority
  year: 2021
  url: https://doi.org/10.2903/j.efsa.2021.6884
  licence: EFSA Journal ? CC BY-ND 4.0; facts cited, no text reproduced or adapted
  accessed: '2026-10-26'
  note: 'EU specification describes aqueous extraction of fruit arils. No numerical ADI needed; EU authorised
    sweetener and flavour enhancer. Opened copy: https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2021.6884'
  doi: 10.2903/j.efsa.2021.6884
- id: swm-efsa-neohesperidin-2022
  type: regulatory_opinion
  title: Re-evaluation of neohesperidine dihydrochalcone (E 959) as a food additive
  publisher: European Food Safety Authority
  year: 2022
  url: https://doi.org/10.2903/j.efsa.2022.7595
  licence: EFSA Journal ? CC BY-ND 4.0; facts cited, no text reproduced or adapted
  accessed: '2026-10-26'
  note: 'ADI 20 mg/kg body weight/day; manufacture by hydrogenation of neohesperidin extracted from bitter
    oranges; CAS 20702-77-6. Opened copy: https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2022.7595'
  doi: 10.2903/j.efsa.2022.7595
- id: swm-efsa-salt-2026
  type: regulatory_opinion
  title: Re-evaluation of salt of aspartame-acesulfame (E 962) as food additive
  publisher: European Food Safety Authority
  year: 2026
  url: https://doi.org/10.2903/j.efsa.2026.10259
  licence: EFSA Journal ? CC BY-ND 4.0; facts cited, no text reproduced or adapted
  accessed: '2026-10-26'
  note: 'Respective component ADIs apply: aspartame 40 and acesulfame K 15 mg/kg body weight/day, not a standalone
    E962 ADI; describes manufacture, dissociation and CAS 106372-55-8. Opened copy: https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2026.10259'
  doi: 10.2903/j.efsa.2026.10259
