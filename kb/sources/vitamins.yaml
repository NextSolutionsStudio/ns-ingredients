# New citations for the "vitamins-allergens" batch. All opened this session (2026-09-27).
sources:
  - id: efsa-tocopherols-2015
    type: regulatory_opinion
    title: "Scientific Opinion on the re-evaluation of tocopherol-rich extract (E 306), alpha-tocopherol (E 307), gamma-tocopherol (E 308) and delta-tocopherol (E 309) as food additives"
    publisher: European Food Safety Authority
    year: 2015
    url: https://doi.org/10.2903/j.efsa.2015.4247
    doi: 10.2903/j.efsa.2015.4247
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: 2026-09-27
    note: >-
      E 306 is described as of natural origin; E 307 (and E 308/E 309) as synthetic
      (all-rac-/dl-alpha-tocopherol etc). JECFA derived an ADI of 0.15-2 mg/kg bw/day for
      alpha-tocopherol; the critical effect in animal studies was prolonged coagulation time;
      the Panel found no safety concern at reported food-additive use levels. Specifications
      for both additives are set in Reg 231/2012.
  - id: dir-2002-46-annex2
    type: regulation
    title: "Directive 2002/46/EC on food supplements, consolidated text (Annex I permitted vitamins/minerals; Annex II permitted source substances)"
    publisher: European Union
    year: 2002
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02002L0046-20220930
    licence: "EU reuse policy (Decision 2011/833/EU) — CC BY 4.0"
    accessed: 2026-09-27
    note: >-
      Annex II lists, among the permitted forms: for vitamin E — D-alpha-tocopherol,
      DL-alpha-tocopherol, D-alpha-tocopheryl acetate, DL-alpha-tocopheryl acetate,
      D-alpha-tocopheryl acid succinate, mixed tocopherols, tocotrienol tocopherol; for
      vitamin B12 — cyanocobalamin, hydroxocobalamin, 5'-deoxyadenosylcobalamin,
      methylcobalamin; for folate — pteroylmonoglutamic acid (folic acid),
      calcium-L-methylfolate, (6S)-5-methyltetrahydrofolic acid glucosamine salt. Wording
      verified against the UK retained-law mirror of this consolidated CELEX text
      (legislation.gov.uk/eudr), because eur-lex.europa.eu returned no renderable content to
      this session's fetch tool.
  - id: efsa-folate-ul-2023
    type: regulatory_opinion
    title: "Scientific opinion on the tolerable upper intake level for folate"
    publisher: European Food Safety Authority
    year: 2023
    url: https://doi.org/10.2903/j.efsa.2023.8353
    doi: 10.2903/j.efsa.2023.8353
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: 2026-09-27
    note: >-
      Retains the Scientific Committee on Food's tolerable upper intake levels for folic
      acid: 1000 µg/day for adults, including pregnancy and lactation, down to 200 µg/day for
      infants aged 4-11 months. Applies to folic acid and the two authorised
      5-methyltetrahydrofolate salts, not to naturally occurring food folate. The critical
      effect used to set the UL is masking or exacerbating cobalamin (vitamin B12)-deficient
      neuropathy.
  - id: calvillo-b12-fermentation-2022
    type: review
    title: "Bioprocess Strategies for Vitamin B12 Production by Microbial Fermentation and Its Market Applications"
    authors: "Calvillo Á, Pellicer T, Carnicer M, Planas À"
    publisher: "Bioengineering (MDPI)"
    year: 2022
    url: https://doi.org/10.3390/bioengineering9080365
    doi: 10.3390/bioengineering9080365
    licence: "CC BY 4.0"
    accessed: 2026-09-27
    note: >-
      Pseudomonas denitrificans (aerobic pathway) and Propionibacterium freudenreichii
      (anaerobic pathway) are the industrial fermentation strains. Methylcobalamin,
      hydroxocobalamin and adenosylcobalamin occur naturally in the fermentation broth;
      cyanocobalamin is made from them by treatment with potassium cyanide or thiocyanate
      during downstream processing because it is more stable, and is the dominant commercial
      form.
  - id: chemanalyst-vitamin-e-2025
    type: reference
    title: "Understanding the Production Process of Vitamin E: Processes, Raw Materials, and Innovations"
    publisher: ChemAnalyst
    year: 2025
    url: https://www.chemanalyst.com/NewsAndDeals/NewsDetails/understanding-the-production-process-of-vitamin-e-processes-raw-materials-38889
    licence: "Cited, not reproduced"
    accessed: 2026-09-27
    note: >-
      Trade-press description: natural vitamin E is obtained from vegetable oils (soybean,
      sunflower, wheat germ) by distillation and purification of the deodoriser fraction;
      synthetic vitamin E is made from the petrochemical derivatives trimethylhydroquinone and
      isophytol by condensation, then often esterified (acetate/succinate) for stability.
  - id: biovit-vitamin-d3-lichen
    type: reference
    title: "Vitamin D3 ingredient page (lichen- vs lanolin-derived cholecalciferol)"
    publisher: BIOVIT
    url: https://www.biovit.com/ingredients/vitamin-d3
    licence: "Cited, not reproduced"
    accessed: 2026-09-27
    note: >-
      Manufacturer page describing lichen (Cladonia rangiferina) as the only known
      non-animal source of cholecalciferol, delivering the same molecule as lanolin
      (sheep-wool-grease)-derived vitamin D3; marketed specifically for vegan-labelled
      products.
  - id: faulkner-hogg-oats-2026
    type: review
    title: "Oats in Gluten-Free Diets: An Examination of the Codex Standard and Country-Specific Differences in Gluten-Free-Food Labeling Regulations, for Oats and Oats Declared as Ingredients in Gluten-Free Products"
    authors: "Faulkner-Hogg K, Hughes J, Grafenauer S"
    publisher: "Nutrition Reviews"
    year: 2026
    url: https://doi.org/10.1093/nutrit/nuag100
    doi: 10.1093/nutrit/nuag100
    licence: "Cited, not reproduced"
    accessed: 2026-09-27
    note: >-
      Oat avenin lacks the proline/glutamine pattern that drives coeliac immune reactions and
      is a minority of total oat protein, but roughly 8% of coeliac patients still react to
      pure avenin; most of the practical risk in ordinary oats is cross-contact with wheat,
      rye and barley during cultivation, harvest and handling. Codex and EU rules allow
      specially produced, uncontaminated oats at <=20 mg/kg gluten to be labelled gluten-free.
