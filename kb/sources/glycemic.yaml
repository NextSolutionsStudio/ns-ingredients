# The method behind the glycemic-load estimate (src/core/nutrition.ts), added 2026-10-26. Ids prefixed gi-.
# Per-ingredient GI values cite their own studies in kb/sources/glycemic-values.yaml.
sources:
  - id: gi-dodd-2011
    type: rct
    title: "Calculating meal glycemic index by using measured and published food values compared with directly measured meal glycemic index"
    authors: "Dodd H, Williams S, Brown R, Venn B"
    publisher: "The American Journal of Clinical Nutrition 94(4):992-996"
    year: 2011
    url: https://doi.org/10.3945/ajcn.111.012138
    doi: 10.3945/ajcn.111.012138
    licence: "Journal copyright — facts cited, text not reproduced"
    accessed: 2026-10-26
    note: "Seven foods tested in 30 healthy people, then combined into three mixed meals of 50 g available carbohydrate. The weighted-sum formula overestimated every measured meal GI: by 12, 15 and 19 GI units (22%, 40%, 50%) for the potato, rice and spaghetti meals; published food values overestimated too. Read from the University of Otago repository record."
