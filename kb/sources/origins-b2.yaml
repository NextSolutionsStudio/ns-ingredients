  - id: acevedo-rocha-2019-bvit
    type: review
    title: "Microbial cell factories for the sustainable manufacturing of B vitamins"
    authors: "Acevedo-Rocha CG, Gronenberg LS, Mack M, Commichau FM, Genee HJ"
    year: 2019
    url: https://doi.org/10.1016/j.copbio.2018.07.006
    doi: 10.1016/j.copbio.2018.07.006
    licence: publisher-subscription
    accessed: '2026-11-16'
    note: "Abstract only (PMID 30138794, sources-pack/review-b-vitamin-manufacture.txt): most current B-vitamin production uses non-renewable chemical methods; fermentative bioprocesses still face hurdles to reach the market."

  - id: wang-2021-vitamins-pmc8247775
    type: review
    title: "Microbial Cell Factories for Green Production of Vitamins"
    authors: "Wang Y, Liu L, Jin Z, Zhang D"
    year: 2021
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8247775/
    doi: 10.3389/fbioe.2021.661562
    licence: CC-BY-4.0
    accessed: '2026-11-16'
    note: "Full text opened (PMC8247775, Europe PMC): reviews B-vitamin (B1, B3, B5, B6) and vitamin C production, noting most B vitamins are manufactured by chemical synthesis alongside developing microbial cell factories, and commercial L-ascorbic acid manufacture via the Reichstein process and two-step fermentation."

