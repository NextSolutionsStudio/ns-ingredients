# Sources for popular-pl-b1 (batch b1, 2026-11-16).
# EFSA abstracts and PMC full texts were opened via Europe PMC (Wiley returns 403);
# EU regulations were opened via Spain's official DOUE mirror (boe.es) where EUR-Lex returned HTTP 202.
sources:
  - id: reg-1925-2006
    type: regulation
    title: >-
      Regulation (EC) No 1925/2006 on the addition of vitamins and minerals and of certain other substances to
      foods (with Annexes I and II as amended by Regulation (EC) No 1170/2009)
    publisher: European Union
    year: 2006
    url: https://eur-lex.europa.eu/eli/reg/2006/1925/oj
    licence: "EU reuse policy (Decision 2011/833/EU) — CC BY 4.0"
    accessed: '2026-11-16'
    note: >-
      Canonical ELI URL; opened via boe.es DOUE mirrors (DOUE-L-2006-82776 and DOUE-L-2009-82310). Annex I
      lists permitted vitamins and minerals (including vitamin D, B1, niacin, pantothenic acid, B6, calcium,
      iron); Annex II lists permitted vitamin formulations and mineral substances.
  - id: reg-2065-2003
    type: regulation
    title: "Regulation (EC) No 2065/2003 on smoke flavourings used or intended for use in or on foods"
    publisher: European Union
    year: 2003
    url: https://eur-lex.europa.eu/eli/reg/2003/2065/oj
    licence: "EU reuse policy (Decision 2011/833/EU) — CC BY 4.0"
    accessed: '2026-11-16'
    note: >-
      Canonical ELI URL; opened via boe.es DOUE mirror (DOUE-L-2003-81885). Regulates smoke flavouring primary
      products separately from other flavourings, requiring authorisation on an EU Union list.
  - id: reg-2024-2067
    type: regulation
    title: >-
      Commission Implementing Regulation (EU) 2024/2067 amending Implementing Regulation (EU) No 1321/2013 as
      regards the deletion of entries SF-001 to SF-010 from the Union list of authorised smoke flavouring
      primary products
    publisher: European Union
    year: 2024
    url: https://eur-lex.europa.eu/eli/reg_impl/2024/2067/oj
    licence: "EU reuse policy (Decision 2011/833/EU) — CC BY 4.0"
    accessed: '2026-11-16'
    note: >-
      Canonical ELI URL; opened via boe.es DOUE mirror (DOUE-L-2024-81233). Deletes SF-001 through SF-010 from
      the Union list after non-renewal decisions (SF-007 and SF-010 expired 1 Jan 2024 without renewal
      application); sets transitional placing-on-the-market deadlines of 1 July 2029 for categories 1.7
      (cheese), 8 (meat), 9.2 (processed fish) and 9.3 (fish roe), and 1 July 2026 for all other food
      categories.
  - id: reg-828-2014
    type: regulation
    title: >-
      Commission Implementing Regulation (EU) No 828/2014 on the requirements for the provision of information
      to consumers on the absence or reduced presence of gluten in food
    publisher: European Union
    year: 2014
    url: https://eur-lex.europa.eu/eli/reg_impl/2014/828/oj
    licence: "EU reuse policy (Decision 2011/833/EU) — CC BY 4.0"
    accessed: '2026-11-16'
    note: >-
      Canonical ELI URL; opened via boe.es DOUE mirror (DOUE-L-2014-81720). Sets the 'gluten-free' threshold at
      <= 20 mg/kg gluten in food as sold to the final consumer (and 'very low gluten' at <= 100 mg/kg for
      specifically processed cereal ingredients).
  - id: reg-2022-2104
    type: regulation
    title: >-
      Commission Delegated Regulation (EU) 2022/2104 supplementing Regulation (EU) No 1308/2013 as regards
      marketing standards for olive oil
    publisher: European Union
    year: 2022
    url: https://eur-lex.europa.eu/eli/reg_del/2022/2104/oj
    licence: "EU reuse policy (Decision 2011/833/EU) — CC BY 4.0"
    accessed: '2026-11-16'
    note: >-
      Canonical ELI URL; opened via boe.es DOUE mirror (DOUE-L-2022-81606). Defines the EU legal categories for
      olive oils (extra virgin, virgin, refined olive oil, olive oil composed of refined and virgin olive oils,
      olive-pomace oils) and their labelling rules.
  - id: efsa-b6-ul-2023
    type: regulatory_opinion
    title: Scientific opinion on the tolerable upper intake level for vitamin B6
    publisher: European Food Safety Authority
    year: 2023
    url: https://doi.org/10.2903/j.efsa.2023.8006
    doi: 10.2903/j.efsa.2023.8006
    pmid: '37207271'
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: '2026-11-16'
    note: >-
      Abstract opened via Europe PMC. Establishes a UL of 12 mg/day for adults (including pregnancy and
      lactation) based on peripheral neuropathy, and 2.2-10.7 mg/day for infants, children and adolescents.
  - id: efsa-vitd-ul-2023
    type: regulatory_opinion
    title: >-
      Scientific opinion on the tolerable upper intake level for vitamin D, including the derivation of a
      conversion factor for calcidiol monohydrate
    publisher: European Food Safety Authority
    year: 2023
    url: https://doi.org/10.2903/j.efsa.2023.8145
    doi: 10.2903/j.efsa.2023.8145
    pmid: '37560437'
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: '2026-11-16'
    note: >-
      Abstract opened via Europe PMC. Covers ergocalciferol (vitamin D2), cholecalciferol (vitamin D3) and
      calcidiol monohydrate; establishes a UL of 100 ug VDE/day for adults and adolescents 11-17 years, and
      50 ug VDE/day for children 1-10 years, based on persistent hypercalciuria.
  - id: efsa-iron-ul-2024
    type: regulatory_opinion
    title: Scientific opinion on the tolerable upper intake level for iron
    publisher: European Food Safety Authority
    year: 2024
    url: https://doi.org/10.2903/j.efsa.2024.8819
    doi: 10.2903/j.efsa.2024.8819
    pmid: '38868106'
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: '2026-11-16'
    note: >-
      Abstract opened via Europe PMC. Concludes no UL could be established for iron; sets a safe level of intake
      of 40 mg/day for adults (including pregnancy and lactation), 10-35 mg/day for children and adolescents,
      and 5 mg/day supplemental iron for infants 4-11 months based on absence of black stools.
  - id: efsa-calcium-ul-2012
    type: regulatory_opinion
    title: Scientific Opinion on the Tolerable Upper Intake Level of calcium
    publisher: European Food Safety Authority
    year: 2012
    url: https://doi.org/10.2903/j.efsa.2012.2814
    doi: 10.2903/j.efsa.2012.2814
    pmid: '42016128'
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: '2026-11-16'
    note: >-
      Abstract opened via Europe PMC. Confirms the UL of 2,500 mg/day for adults (including pregnant and
      lactating women) from diet and supplements combined; insufficient data to set a UL for infants, children
      or adolescents.
  - id: efsa-nmn-2026
    type: regulatory_opinion
    title: >-
      Safety of beta-nicotinamide mononucleotide (beta-NMN) pursuant the regulation (EU) 2015/2283 and the
      bioavailability of nicotinamide from this source in the context of Directive 2002/46/EC
    publisher: European Food Safety Authority
    year: 2026
    url: https://doi.org/10.2903/j.efsa.2026.10007
    doi: 10.2903/j.efsa.2026.10007
    pmid: '42125559'
    licence: "EFSA Journal — CC BY-ND 4.0 (cite, do not adapt)"
    accessed: '2026-11-16'
    note: >-
      Full text opened via Europe PMC (PMC13158811). Section 1.2 states the SCF (2002) Tolerable Upper Intake
      Level for nicotinamide of 900 mg/day (12.5 mg/kg bw/day) for adults (excluding pregnant and lactating
      women).
  - id: nnr-niacin-2023
    type: review
    title: Niacin - a scoping review for Nordic Nutrition Recommendations 2023
    publisher: Food & Nutrition Research
    year: 2023
    url: https://doi.org/10.29219/fnr.v67.10299
    doi: 10.29219/fnr.v67.10299
    pmid: '38187785'
    licence: CC BY 4.0
    accessed: '2026-11-16'
    note: >-
      Full text opened via Europe PMC (PMC10770643). States the EU SCF Tolerable Upper Intake Levels of
      10 mg/day for nicotinic acid (based on flushing at 30-1000 mg/day) and 900 mg/day for nicotinamide for
      adults.
  - id: nnr-pantothenic-2023
    type: review
    title: Pantothenic acid - a scoping review for Nordic Nutrition Recommendations 2023
    publisher: Food & Nutrition Research
    year: 2023
    url: https://doi.org/10.29219/fnr.v67.10255
    doi: 10.29219/fnr.v67.10255
    pmid: '38187802'
    licence: CC BY 4.0
    accessed: '2026-11-16'
    note: >-
      Full text opened via Europe PMC (PMC10770646). Reports that no UL was established by the SCF due to lack
      of systematic oral dose-response studies.
  - id: nnr-thiamin-2023
    type: review
    title: Thiamin (Vitamin B1) - A scoping review for Nordic Nutrition Recommendations 2023
    publisher: Food & Nutrition Research
    year: 2023
    url: https://doi.org/10.29219/fnr.v67.10290
    doi: 10.29219/fnr.v67.10290
    pmid: '38084159'
    licence: CC BY 4.0
    accessed: '2026-11-16'
    note: >-
      Full text opened via Europe PMC (PMC10710862). Reports that no UL could be established by SCF (2001) due
      to lack of data; notes thiamine chloride and thiamine mononitrate as permitted supplement salts.
  - id: pmc-vitd2-2026
    type: review
    title: >-
      Content of Vitamin D2 in Alternative Biological and Nutritional Sources and Its Effectiveness as Compared
      to Vitamin D3 - A Narrative Review
    publisher: Metabolites (MDPI)
    year: 2026
    url: https://doi.org/10.3390/metabo16070485
    doi: 10.3390/metabo16070485
    pmid: '42506436'
    licence: CC BY 4.0
    accessed: '2026-11-16'
    note: >-
      Abstract and text opened via Europe PMC (PMC13414236). Covers vitamin D2 (ergocalciferol) from fungal,
      yeast and algal ergosterol under UV irradiation as a non-animal vitamin D source.
