    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Caramelization
    licence: CC BY-SA 4.0
    accessed: '2026-11-16'
    note: >-
      Opened via Wikipedia API. Pyrolytic browning of sugars (e.g. sucrose inversion to fructose and glucose,
